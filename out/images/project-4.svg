<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#991b1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f1d1d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Scan lines overlay -->
  <g opacity="0.03" stroke="#ff0000" stroke-width="0.5">
    <line x1="0" y1="10" x2="600" y2="10" /><line x1="0" y1="20" x2="600" y2="20" />
    <line x1="0" y1="30" x2="600" y2="30" /><line x1="0" y1="40" x2="600" y2="40" />
    <line x1="0" y1="50" x2="600" y2="50" /><line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="70" x2="600" y2="70" /><line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="90" x2="600" y2="90" /><line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="110" x2="600" y2="110" /><line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="130" x2="600" y2="130" /><line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="150" x2="600" y2="150" /><line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="170" x2="600" y2="170" /><line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="190" x2="600" y2="190" /><line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="210" x2="600" y2="210" /><line x1="0" y1="220" x2="600" y2="220" />
    <line x1="0" y1="230" x2="600" y2="230" /><line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="250" x2="600" y2="250" /><line x1="0" y1="260" x2="600" y2="260" />
    <line x1="0" y1="270" x2="600" y2="270" /><line x1="0" y1="280" x2="600" y2="280" />
    <line x1="0" y1="290" x2="600" y2="290" /><line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="310" x2="600" y2="310" /><line x1="0" y1="320" x2="600" y2="320" />
    <line x1="0" y1="330" x2="600" y2="330" /><line x1="0" y1="340" x2="600" y2="340" />
    <line x1="0" y1="350" x2="600" y2="350" /><line x1="0" y1="360" x2="600" y2="360" />
    <line x1="0" y1="370" x2="600" y2="370" /><line x1="0" y1="380" x2="600" y2="380" />
    <line x1="0" y1="390" x2="600" y2="390" />
  </g>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="44" fill="#0f0f0f" opacity="0.98" />
  <circle cx="20" cy="22" r="5" fill="#ef4444" opacity="0.9" filter="url(#redGlow)" />
  <circle cx="34" cy="22" r="5" fill="#f59e0b" opacity="0.7" />
  <circle cx="48" cy="22" r="5" fill="#10b981" opacity="0.5" />
  <text x="300" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle" letter-spacing="1">THREATSHIELD AI — ACTIVE THREAT DETECTION SYSTEM</text>
  <circle cx="572" cy="22" r="5" fill="#ef4444" filter="url(#redGlow)" />
  <text x="562" y="26" font-family="Arial, sans-serif" font-size="7" fill="#fca5a5" text-anchor="end">ALERT</text>

  <!-- Central shield -->
  <g transform="translate(300, 210)" filter="url(#redGlow)">
    <!-- Outer shield glow rings -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#ef4444" stroke-width="0.5" opacity="0.2" />
    <circle cx="0" cy="0" r="78" fill="none" stroke="#ef4444" stroke-width="0.8" opacity="0.3" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.4" />
    <!-- Shield body -->
    <path d="M0,-55 L42,-30 L42,12 Q42,50 0,68 Q-42,50 -42,12 L-42,-30 Z" fill="url(#shieldGrad)" stroke="#ef4444" stroke-width="2" opacity="0.95" />
    <!-- Shield inner highlight -->
    <path d="M0,-42 L30,-22 L30,10 Q30,38 0,52 Q-30,38 -30,10 L-30,-22 Z" fill="none" stroke="#fca5a5" stroke-width="0.8" opacity="0.4" />
    <!-- AI text on shield -->
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">AI</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="7" fill="#fca5a5" text-anchor="middle" letter-spacing="1">THREAT</text>
    <text x="0" y="26" font-family="Arial, sans-serif" font-size="7" fill="#fca5a5" text-anchor="middle" letter-spacing="1">SHIELD</text>
  </g>

  <!-- Threat nodes circling -->
  <!-- Blocked threat (top-left) -->
  <g filter="url(#glow)">
    <circle cx="160" cy="120" r="18" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" />
    <line x1="154" y1="114" x2="166" y2="126" stroke="#ef4444" stroke-width="2" />
    <line x1="166" y1="114" x2="154" y2="126" stroke="#ef4444" stroke-width="2" />
  </g>
  <text x="160" y="148" font-family="Arial, sans-serif" font-size="7.5" fill="#fca5a5" text-anchor="middle" font-weight="700">MALWARE</text>
  <text x="160" y="158" font-family="Arial, sans-serif" font-size="6.5" fill="#ef4444" text-anchor="middle">BLOCKED</text>
  <line x1="176" y1="130" x2="240" y2="168" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5" />

  <!-- Blocked threat (top-right) -->
  <g filter="url(#glow)">
    <circle cx="440" cy="120" r="18" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" />
    <line x1="434" y1="114" x2="446" y2="126" stroke="#ef4444" stroke-width="2" />
    <line x1="446" y1="114" x2="434" y2="126" stroke="#ef4444" stroke-width="2" />
  </g>
  <text x="440" y="148" font-family="Arial, sans-serif" font-size="7.5" fill="#fca5a5" text-anchor="middle" font-weight="700">PHISHING</text>
  <text x="440" y="158" font-family="Arial, sans-serif" font-size="6.5" fill="#ef4444" text-anchor="middle">BLOCKED</text>
  <line x1="424" y1="130" x2="358" y2="168" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5" />

  <!-- Investigating (bottom-left) -->
  <g filter="url(#glow)">
    <circle cx="160" cy="310" r="18" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="160" y="315" font-family="Arial, sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle">?</text>
  </g>
  <text x="160" y="338" font-family="Arial, sans-serif" font-size="7.5" fill="#fbbf24" text-anchor="middle" font-weight="700">ANOMALY</text>
  <text x="160" y="348" font-family="Arial, sans-serif" font-size="6.5" fill="#f59e0b" text-anchor="middle">ANALYSING</text>
  <line x1="176" y1="300" x2="240" y2="258" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5" />

  <!-- Blocked threat (bottom-right) -->
  <g filter="url(#glow)">
    <circle cx="440" cy="310" r="18" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" />
    <line x1="434" y1="304" x2="446" y2="316" stroke="#ef4444" stroke-width="2" />
    <line x1="446" y1="304" x2="434" y2="316" stroke="#ef4444" stroke-width="2" />
  </g>
  <text x="440" y="338" font-family="Arial, sans-serif" font-size="7.5" fill="#fca5a5" text-anchor="middle" font-weight="700">RANSOMWARE</text>
  <text x="440" y="348" font-family="Arial, sans-serif" font-size="6.5" fill="#ef4444" text-anchor="middle">BLOCKED</text>
  <line x1="424" y1="300" x2="358" y2="258" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5" />

  <!-- Stats cards: left side -->
  <rect x="20" y="58" width="120" height="52" rx="6" fill="#0f0f0f" opacity="0.9" stroke="#ef4444" stroke-width="0.8" />
  <text x="32" y="74" font-family="Arial, sans-serif" font-size="7" fill="#fca5a5" font-weight="700" letter-spacing="0.5">THREATS TODAY</text>
  <text x="32" y="96" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="900">2,841</text>
  <text x="32" y="105" font-family="Arial, sans-serif" font-size="6.5" fill="#ef4444">all blocked</text>

  <rect x="152" y="58" width="120" height="52" rx="6" fill="#0f0f0f" opacity="0.9" stroke="#10b981" stroke-width="0.8" />
  <text x="164" y="74" font-family="Arial, sans-serif" font-size="7" fill="#6ee7b7" font-weight="700" letter-spacing="0.5">AI ACCURACY</text>
  <text x="164" y="96" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="900">99.4%</text>
  <text x="164" y="105" font-family="Arial, sans-serif" font-size="6.5" fill="#34d399">detection rate</text>

  <rect x="328" y="58" width="120" height="52" rx="6" fill="#0f0f0f" opacity="0.9" stroke="#f59e0b" stroke-width="0.8" />
  <text x="340" y="74" font-family="Arial, sans-serif" font-size="7" fill="#fbbf24" font-weight="700" letter-spacing="0.5">RESPONSE TIME</text>
  <text x="340" y="96" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="900">0.3ms</text>
  <text x="340" y="105" font-family="Arial, sans-serif" font-size="6.5" fill="#fbbf24">avg response</text>

  <rect x="460" y="58" width="120" height="52" rx="6" fill="#0f0f0f" opacity="0.9" stroke="#8b5cf6" stroke-width="0.8" />
  <text x="472" y="74" font-family="Arial, sans-serif" font-size="7" fill="#c4b5fd" font-weight="700" letter-spacing="0.5">ENDPOINTS</text>
  <text x="472" y="96" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="900">48K</text>
  <text x="472" y="105" font-family="Arial, sans-serif" font-size="6.5" fill="#a78bfa">protected</text>

  <!-- Bottom status bar -->
  <rect x="0" y="378" width="600" height="22" fill="#0f0f0f" opacity="0.98" />
  <circle cx="16" cy="389" r="4" fill="#ef4444" filter="url(#redGlow)" />
  <text x="26" y="393" font-family="Arial, sans-serif" font-size="8" fill="#fca5a5" font-weight="700">ACTIVE MONITORING</text>
  <text x="300" y="393" font-family="Arial, sans-serif" font-size="9" fill="#ef4444" font-weight="600" text-anchor="middle" letter-spacing="0.5">NEOSOFT TECH · THREATSHIELD AI · AI-POWERED THREAT DETECTION &amp; RESPONSE</text>
</svg>
