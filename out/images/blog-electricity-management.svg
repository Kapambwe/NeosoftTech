<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1e2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#132236;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ca8a04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ca8a04;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#eab308" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50" /><line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" /><line x1="0" y1="400" x2="800" y2="400" />
    <line x1="50" y1="0" x2="50" y2="450" /><line x1="100" y1="0" x2="100" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" /><line x1="200" y1="0" x2="200" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" /><line x1="300" y1="0" x2="300" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
  </g>

  <!-- Transmission tower left (stylized) -->
  <g transform="translate(48, 90)" opacity="0.75" stroke="#eab308" stroke-width="1.5" fill="none">
    <line x1="30" y1="0" x2="30" y2="180" />
    <line x1="10" y1="30" x2="50" y2="30" />
    <line x1="5" y1="60" x2="55" y2="60" />
    <line x1="0" y1="90" x2="60" y2="90" />
    <line x1="30" y1="0" x2="10" y2="30" />
    <line x1="30" y1="0" x2="50" y2="30" />
    <line x1="10" y1="30" x2="5" y2="60" />
    <line x1="50" y1="30" x2="55" y2="60" />
    <line x1="5" y1="60" x2="0" y2="90" />
    <line x1="55" y1="60" x2="60" y2="90" />
    <line x1="10" y1="90" x2="20" y2="180" />
    <line x1="50" y1="90" x2="40" y2="180" />
  </g>
  <!-- Transmission wires -->
  <g opacity="0.5" stroke="#fde047" stroke-width="1" fill="none">
    <path d="M 58 120 Q 200 155 340 130" stroke-dasharray="none" />
    <path d="M 63 150 Q 200 185 340 160" />
    <path d="M 68 180 Q 200 210 340 190" />
  </g>

  <!-- Lightning bolt icon left -->
  <g transform="translate(30, 280)" filter="url(#glow)" opacity="0.9">
    <polygon points="28,0 14,30 22,30 8,60 34,22 24,22" fill="#eab308" />
  </g>

  <!-- Grid network nodes -->
  <g opacity="0.4" stroke="#3b82f6" stroke-width="1" fill="none" stroke-dasharray="4 3">
    <line x1="100" y1="340" x2="180" y2="300" />
    <line x1="180" y1="300" x2="260" y2="340" />
    <line x1="260" y1="340" x2="320" y2="290" />
    <line x1="180" y1="300" x2="220" y2="240" />
    <line x1="220" y1="240" x2="320" y2="290" />
  </g>
  <g filter="url(#glow)">
    <circle cx="100" cy="340" r="7" fill="#1d4ed8" opacity="0.9" />
    <circle cx="100" cy="340" r="3.5" fill="#93c5fd" />
    <circle cx="180" cy="300" r="9" fill="#eab308" opacity="0.9" />
    <circle cx="180" cy="300" r="4.5" fill="#fde047" />
    <circle cx="220" cy="240" r="7" fill="#22c55e" opacity="0.9" />
    <circle cx="220" cy="240" r="3.5" fill="#86efac" />
    <circle cx="260" cy="340" r="7" fill="#1d4ed8" opacity="0.9" />
    <circle cx="260" cy="340" r="3.5" fill="#93c5fd" />
    <circle cx="320" cy="290" r="10" fill="#eab308" opacity="0.95" />
    <circle cx="320" cy="290" r="5" fill="#fde047" />
  </g>

  <!-- Left side text -->
  <text x="58" y="235" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#fde047" opacity="0.95">Electricity Energy</text>
  <text x="58" y="258" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#fde047" opacity="0.95">Management</text>
  <text x="58" y="282" font-family="Arial, sans-serif" font-size="11" fill="#eab308" opacity="0.85">Generate · Transmit · Distribute</text>
  <text x="58" y="298" font-family="Arial, sans-serif" font-size="11" fill="#eab308" opacity="0.85">Trade · Meter · Comply</text>

  <!-- Main dashboard card -->
  <rect x="368" y="26" width="400" height="398" rx="16" fill="url(#cardGrad)" opacity="0.95" />
  <rect x="368" y="26" width="400" height="398" rx="16" fill="none" stroke="#eab308" stroke-width="1" opacity="0.35" />

  <!-- Dashboard header -->
  <rect x="368" y="26" width="400" height="48" rx="16" fill="#0a1628" opacity="0.9" />
  <rect x="368" y="58" width="400" height="16" fill="#0a1628" opacity="0.9" />
  <circle cx="384" cy="45" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="400" cy="45" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="416" cy="45" r="5" fill="#22c55e" opacity="0.8" />
  <text x="432" y="51" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fde047" letter-spacing="0.5">NATIONAL GRID OPERATIONS DASHBOARD</text>

  <!-- KPI Row -->
  <rect x="384" y="90" width="108" height="64" rx="8" fill="#0a1628" opacity="0.8" />
  <text x="400" y="109" font-family="Arial, sans-serif" font-size="9" fill="#fde047" font-weight="600" letter-spacing="0.5">GENERATION</text>
  <text x="400" y="136" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">3,384</text>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="9" fill="#fde047">MW Installed</text>

  <rect x="504" y="90" width="108" height="64" rx="8" fill="#0a1628" opacity="0.8" />
  <text x="520" y="109" font-family="Arial, sans-serif" font-size="9" fill="#86efac" font-weight="600" letter-spacing="0.5">FREQUENCY</text>
  <text x="520" y="136" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">50.01</text>
  <text x="520" y="150" font-family="Arial, sans-serif" font-size="9" fill="#86efac">Hz — Stable</text>

  <rect x="624" y="90" width="120" height="64" rx="8" fill="#0a1628" opacity="0.8" />
  <text x="640" y="109" font-family="Arial, sans-serif" font-size="9" fill="#93c5fd" font-weight="600" letter-spacing="0.5">SAPP TRADES</text>
  <text x="640" y="136" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">5</text>
  <text x="640" y="150" font-family="Arial, sans-serif" font-size="9" fill="#93c5fd">Countries Active</text>

  <!-- Sine wave / load curve -->
  <text x="384" y="182" font-family="Arial, sans-serif" font-size="10" fill="#fde047" font-weight="700" letter-spacing="0.5">LOAD PROFILE (24H) — MW</text>
  <rect x="384" y="190" width="352" height="100" rx="6" fill="#060d17" opacity="0.7" />
  <polyline points="384,260 404,255 424,248 444,242 464,238 484,237 504,240 524,246 544,252 564,256 584,258 604,254 624,248 644,242 656,238 668,236 692,240 716,248 736,256" fill="none" stroke="#eab308" stroke-width="2.5" opacity="0.9" />
  <polyline points="384,270 404,268 424,264 444,260 464,258 484,256 504,258 524,262 544,266 564,268 584,270 604,267 624,263 644,259 656,257 668,256 692,258 716,263 736,268" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" stroke-dasharray="5 3" />
  <text x="386" y="285" font-family="Arial, sans-serif" font-size="7.5" fill="#78716c">00:00</text>
  <text x="454" y="285" font-family="Arial, sans-serif" font-size="7.5" fill="#78716c">06:00</text>
  <text x="524" y="285" font-family="Arial, sans-serif" font-size="7.5" fill="#78716c">12:00</text>
  <text x="594" y="285" font-family="Arial, sans-serif" font-size="7.5" fill="#78716c">18:00</text>
  <text x="660" y="285" font-family="Arial, sans-serif" font-size="7.5" fill="#78716c">24:00</text>

  <!-- Generation mix bars -->
  <text x="384" y="312" font-family="Arial, sans-serif" font-size="10" fill="#fde047" font-weight="700" letter-spacing="0.5">GENERATION MIX (%)</text>
  <rect x="384" y="320" width="352" height="72" rx="6" fill="#060d17" opacity="0.7" />

  <!-- Hydro bar -->
  <rect x="396" y="332" width="96" height="12" rx="2" fill="#1e3a5f" opacity="0.6" />
  <rect x="396" y="332" width="76" height="12" rx="2" fill="url(#bar2)" />
  <text x="398" y="343" font-family="Arial, sans-serif" font-size="7.5" fill="#fff" opacity="0.9">Hydro  79%</text>
  <!-- Thermal bar -->
  <rect x="396" y="350" width="96" height="12" rx="2" fill="#1e3a5f" opacity="0.6" />
  <rect x="396" y="350" width="20" height="12" rx="2" fill="url(#bar1)" />
  <text x="398" y="361" font-family="Arial, sans-serif" font-size="7.5" fill="#fff" opacity="0.9">Thermal  19%</text>
  <!-- Solar bar -->
  <rect x="396" y="368" width="96" height="12" rx="2" fill="#1e3a5f" opacity="0.6" />
  <rect x="396" y="368" width="5" height="12" rx="2" fill="url(#bar3)" />
  <text x="398" y="379" font-family="Arial, sans-serif" font-size="7.5" fill="#fff" opacity="0.9">Solar  2%</text>

  <!-- Live alerts panel -->
  <rect x="510" y="312" width="225" height="80" rx="8" fill="#060d17" opacity="0.8" />
  <text x="524" y="329" font-family="Arial, sans-serif" font-size="9" fill="#fde047" font-weight="700" letter-spacing="0.5">LIVE GRID ALERTS</text>
  <circle cx="522" cy="342" r="4" fill="#22c55e" />
  <text x="532" y="346" font-family="Arial, sans-serif" font-size="9" fill="#e7e5e4">Kafue Gorge — 990 MW ✓</text>
  <circle cx="522" cy="358" r="4" fill="#eab308" />
  <text x="532" y="362" font-family="Arial, sans-serif" font-size="9" fill="#e7e5e4">Kariba North — Reduced load</text>
  <circle cx="522" cy="374" r="4" fill="#3b82f6" />
  <text x="532" y="378" font-family="Arial, sans-serif" font-size="9" fill="#e7e5e4">SAPP ZW export — 120 MW</text>
  <circle cx="522" cy="388" r="4" fill="#22c55e" />
  <text x="532" y="392" font-family="Arial, sans-serif" font-size="9" fill="#e7e5e4">Smart meters active — 98.4%</text>

  <!-- Bottom label bar -->
  <rect x="0" y="418" width="800" height="32" fill="#060d17" opacity="0.95" />
  <text x="400" y="438" font-family="Arial, sans-serif" font-size="11" fill="#eab308" font-weight="600" text-anchor="middle" letter-spacing="1">NEOSOFT TECH · ELECTRICITY ENERGY MANAGEMENT PLATFORM · ZAMBIA POWER GRID</text>

  <!-- Decorative arc -->
  <path d="M 15 415 Q 180 360 365 310" stroke="#eab308" stroke-width="1.5" fill="none" opacity="0.2" stroke-dasharray="6 4" />
</svg>
