<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Deep government blue background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052776;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a0647;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c2d6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#071a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b91c1c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGreenFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.04">
    <line x1="0" y1="50" x2="900" y2="50" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="900" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="900" y2="150" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="900" y2="250" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="900" y2="350" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="900" y2="450" stroke="white" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="500" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- ======== RIGHT PANEL: Audit Dashboard ======== -->
  <rect x="472" y="44" width="402" height="412" rx="14" fill="#0c2d6b" opacity="0.75" filter="url(#shadow)"/>

  <!-- Dashboard header -->
  <text x="673" y="72" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">REAL-TIME AUDIT DASHBOARD</text>

  <!-- ALERT banner: Public Finance Abuse -->
  <rect x="488" y="82" width="370" height="38" rx="6" fill="url(#redGrad)" filter="url(#glow)"/>
  <text x="500" y="97" fill="white" font-size="12" font-weight="700">⚠ ALERT: Public Finance Abuse Detected</text>
  <text x="500" y="113" fill="rgba(255,255,255,0.85)" font-size="10">Ministry of Works — ZMW 4.2M irregular payment flagged · 14:32</text>

  <!-- ALERT banner 2: Compliance -->
  <rect x="488" y="126" width="370" height="30" rx="6" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="141" fill="#fcd34d" font-size="11" font-weight="600">⏱ REVIEW DUE: Road Development Agency — Q4 Audit</text>
  <text x="500" y="154" fill="#94a3b8" font-size="9">Deadline: 5 days · Status: In Progress · Lead: Chanda Mwape</text>

  <!-- Compliance metrics row -->
  <text x="488" y="177" fill="#93c5fd" font-size="10" font-weight="700" letter-spacing="0.5">COMPLIANCE STATUS — 47 ENTITIES MONITORED</text>

  <!-- Metric boxes -->
  <rect x="488" y="184" width="86" height="52" rx="6" fill="#0f2044"/>
  <text x="531" y="205" fill="#4ade80" font-size="20" font-weight="700" text-anchor="middle">29</text>
  <text x="531" y="220" fill="#86efac" font-size="9" text-anchor="middle">Compliant</text>
  <text x="531" y="231" fill="#4b6b8a" font-size="8" text-anchor="middle">61.7%</text>

  <rect x="582" y="184" width="86" height="52" rx="6" fill="#0f2044"/>
  <text x="625" y="205" fill="#fbbf24" font-size="20" font-weight="700" text-anchor="middle">12</text>
  <text x="625" y="220" fill="#fde68a" font-size="9" text-anchor="middle">Under Review</text>
  <text x="625" y="231" fill="#4b6b8a" font-size="8" text-anchor="middle">25.5%</text>

  <rect x="676" y="184" width="86" height="52" rx="6" fill="#0f2044"/>
  <text x="719" y="205" fill="#f87171" font-size="20" font-weight="700" text-anchor="middle">6</text>
  <text x="719" y="220" fill="#fca5a5" font-size="9" text-anchor="middle">Non-Compliant</text>
  <text x="719" y="231" fill="#4b6b8a" font-size="8" text-anchor="middle">12.8%</text>

  <rect x="770" y="184" width="82" height="52" rx="6" fill="#0f2044"/>
  <text x="811" y="205" fill="#c084fc" font-size="20" font-weight="700" text-anchor="middle">ZMW</text>
  <text x="811" y="218" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">87M</text>
  <text x="811" y="231" fill="#4b6b8a" font-size="8" text-anchor="middle">Funds Recovered</text>

  <!-- Forest Audit GIS Map simulation -->
  <text x="488" y="254" fill="#93c5fd" font-size="10" font-weight="700" letter-spacing="0.5">FOREST RESOURCE AUDIT — GIS MAP (ZAMBIA)</text>

  <rect x="488" y="261" width="370" height="100" rx="6" fill="#0a1e3a"/>
  <!-- Map background terrain -->
  <ellipse cx="673" cy="311" rx="160" ry="44" fill="#143d1c" opacity="0.6"/>
  <ellipse cx="600" cy="295" rx="80" ry="28" fill="#166534" opacity="0.5"/>
  <ellipse cx="750" cy="320" rx="70" ry="22" fill="#14532d" opacity="0.5"/>

  <!-- Forest markers -->
  <!-- Fully Protected (green) -->
  <circle cx="590" cy="290" r="7" fill="#4ade80" stroke="white" stroke-width="1.5"/>
  <circle cx="630" cy="305" r="7" fill="#4ade80" stroke="white" stroke-width="1.5"/>
  <circle cx="680" cy="296" r="7" fill="#4ade80" stroke="white" stroke-width="1.5"/>
  <!-- Partially Protected (amber) -->
  <circle cx="720" cy="318" r="7" fill="#fbbf24" stroke="white" stroke-width="1.5"/>
  <circle cx="660" cy="328" r="7" fill="#fbbf24" stroke="white" stroke-width="1.5"/>
  <!-- At Risk (red) -->
  <circle cx="760" cy="305" r="7" fill="#ef4444" stroke="white" stroke-width="1.5"/>
  <circle cx="618" cy="330" r="7" fill="#ef4444" stroke="white" stroke-width="1.5"/>

  <!-- Map legend -->
  <circle cx="500" cy="350" r="4" fill="#4ade80"/>
  <text x="508" y="354" fill="white" font-size="9">Fully Protected</text>
  <circle cx="560" cy="350" r="4" fill="#fbbf24"/>
  <text x="568" y="354" fill="white" font-size="9">At Risk</text>
  <circle cx="610" cy="350" r="4" fill="#ef4444"/>
  <text x="618" y="354" fill="white" font-size="9">Non-Compliant</text>

  <!-- Biodiversity score bar -->
  <text x="700" y="345" fill="#93c5fd" font-size="9">Biodiversity Score</text>
  <rect x="700" y="349" width="150" height="8" rx="4" fill="#0f2044"/>
  <rect x="700" y="349" width="107" height="8" rx="4" fill="url(#barGreenFull)"/>
  <text x="856" y="357" fill="#4ade80" font-size="9">71/100</text>

  <!-- Audit timeline -->
  <text x="488" y="380" fill="#93c5fd" font-size="10" font-weight="700" letter-spacing="0.5">ACTIVE AUDIT ENGAGEMENTS</text>

  <!-- Timeline bars -->
  <rect x="488" y="387" width="10" height="10" rx="2" fill="url(#blueGrad)"/>
  <text x="502" y="397" fill="white" font-size="10">Ministry of Finance</text>
  <rect x="620" y="387" width="90" height="10" rx="3" fill="url(#blueGrad)" opacity="0.9"/>
  <text x="715" y="397" fill="#93c5fd" font-size="9">87% complete</text>

  <rect x="488" y="403" width="10" height="10" rx="2" fill="url(#amberGrad)"/>
  <text x="502" y="413" fill="white" font-size="10">Road Dev. Agency</text>
  <rect x="620" y="403" width="55" height="10" rx="3" fill="url(#amberGrad)" opacity="0.9"/>
  <text x="679" y="413" fill="#fde68a" font-size="9">53%</text>

  <rect x="488" y="419" width="10" height="10" rx="2" fill="url(#redGrad)"/>
  <text x="502" y="429" fill="white" font-size="10">Ministry of Works</text>
  <rect x="620" y="419" width="22" height="10" rx="3" fill="url(#redGrad)" opacity="0.9"/>
  <text x="646" y="429" fill="#fca5a5" font-size="9">21% — FLAGGED</text>

  <rect x="488" y="435" width="10" height="10" rx="2" fill="url(#greenGrad)"/>
  <text x="502" y="445" fill="white" font-size="10">ZESCO Limited</text>
  <rect x="620" y="435" width="140" height="10" rx="3" fill="url(#greenGrad)" opacity="0.9"/>
  <text x="764" y="445" fill="#4ade80" font-size="9">✓ Signed Off</text>

  <!-- ======== LEFT PANEL: Title & Info ======== -->
  <!-- Badge -->
  <rect x="36" y="50" width="216" height="26" rx="13" fill="#1d4ed8" opacity="0.9"/>
  <text x="144" y="67" fill="white" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">GOVERNMENT AUDIT PLATFORM</text>

  <!-- Title -->
  <text x="36" y="122" fill="white" font-size="28" font-weight="800" letter-spacing="-0.5">Government</text>
  <text x="36" y="154" fill="white" font-size="28" font-weight="800" letter-spacing="-0.5">Auditing</text>
  <text x="36" y="182" fill="#60a5fa" font-size="18" font-weight="600">Web Application</text>
  <text x="36" y="206" fill="#93c5fd" font-size="13">Real-Time. AI-Powered. Accountable.</text>

  <line x1="36" y1="222" x2="430" y2="222" stroke="#1d4ed8" stroke-width="1"/>

  <!-- Core module tags -->
  <rect x="36" y="232" width="136" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="104" y="247" fill="#93c5fd" font-size="10" text-anchor="middle">Real-time Auditing</text>

  <rect x="180" y="232" width="140" height="22" rx="4" fill="#3b0000" stroke="#ef4444" stroke-width="1"/>
  <text x="250" y="247" fill="#fca5a5" font-size="10" text-anchor="middle">Public Finance Abuse</text>

  <rect x="36" y="262" width="118" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="95" y="277" fill="#93c5fd" font-size="10" text-anchor="middle">Audit Management</text>

  <rect x="162" y="262" width="118" height="22" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
  <text x="221" y="277" fill="#86efac" font-size="10" text-anchor="middle">Forest GIS Audit</text>

  <rect x="36" y="292" width="110" height="22" rx="4" fill="#3b0764" stroke="#c084fc" stroke-width="1"/>
  <text x="91" y="307" fill="#c4b5fd" font-size="10" text-anchor="middle">Compliance Engine</text>

  <rect x="154" y="292" width="126" height="22" rx="4" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="217" y="307" fill="#fde68a" font-size="10" text-anchor="middle">Recovery Tracking</text>

  <!-- Stat boxes -->
  <rect x="36" y="328" width="88" height="58" rx="8" fill="#0c2d6b"/>
  <text x="80" y="353" fill="#3b82f6" font-size="22" font-weight="800" text-anchor="middle">4</text>
  <text x="80" y="368" fill="#93c5fd" font-size="10" text-anchor="middle">Core modules</text>
  <text x="80" y="379" fill="#1e3d74" font-size="9" text-anchor="middle">integrated</text>

  <rect x="132" y="328" width="88" height="58" rx="8" fill="#0c2d6b"/>
  <text x="176" y="350" fill="#ef4444" font-size="16" font-weight="800" text-anchor="middle">Live</text>
  <text x="176" y="365" fill="#ef4444" font-size="14" font-weight="800" text-anchor="middle">Alerts</text>
  <text x="176" y="379" fill="#93c5fd" font-size="9" text-anchor="middle">real-time flags</text>

  <rect x="228" y="328" width="88" height="58" rx="8" fill="#0c2d6b"/>
  <text x="272" y="353" fill="#22c55e" font-size="22" font-weight="800" text-anchor="middle">GIS</text>
  <text x="272" y="368" fill="#86efac" font-size="10" text-anchor="middle">Forest Maps</text>
  <text x="272" y="379" fill="#1e3d74" font-size="9" text-anchor="middle">Zambia-wide</text>

  <rect x="324" y="328" width="88" height="58" rx="8" fill="#0c2d6b"/>
  <text x="368" y="349" fill="#fbbf24" font-size="14" font-weight="800" text-anchor="middle">ZMW 87M</text>
  <text x="368" y="363" fill="#fde68a" font-size="10" text-anchor="middle">Recovered</text>
  <text x="368" y="378" fill="#1e3d74" font-size="9" text-anchor="middle">from violations</text>

  <!-- Footer -->
  <text x="36" y="430" fill="#1e3d74" font-size="11">NeoSoft · Government Accountability Technology</text>
  <text x="36" y="448" fill="#3b82f6" font-size="11" opacity="0.7">kapambwe.github.io/GovernmentAuditingWebApp</text>
  <text x="36" y="464" fill="#ef4444" font-size="11" opacity="0.8">Powered by Blazor WebAssembly + Radzen + Leaflet</text>
</svg>
