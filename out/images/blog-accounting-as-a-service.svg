  <rect x="30" y="222" width="130" height="64" rx="10" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.5" />
  <text x="46" y="242" font-family="Arial, sans-serif" font-size="8" fill="#99f6e4">NET PROFIT</text>
  <text x="46" y="262" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">K 1.51M</text>
  <rect x="46" y="270" width="50" height="3" rx="1.5" fill="url(#tealGrad)" />
  <text x="100" y="280" font-family="Arial, sans-serif" font-size="8" fill="#2dd4bf">▲ 24%</text>

  <!-- Card 4: Clients -->
  <rect x="30" y="298" width="130" height="64" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="30" y="298" width="130" height="64" rx="10" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4" />
  <text x="46" y="318" font-family="Arial, sans-serif" font-size="8" fill="#bfdbfe">ACTIVE CLIENTS</text>
  <text x="46" y="338" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">348</text>
  <rect x="46" y="346" width="50" height="3" rx="1.5" fill="url(#blueGrad)" />
  <text x="100" y="356" font-family="Arial, sans-serif" font-size="8" fill="#60a5fa">▲ 31</text>

