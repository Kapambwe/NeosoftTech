  <rect x="590" y="13" width="185" height="22" rx="11" fill="url(#greenGrad)" opacity="0.9" />
  <text x="682" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#052e16">AaaS · Multi-Tenant · Partner Network</text>

