  <text x="30" y="18" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#6ee7b7" letter-spacing="2">NEOSOFT</text>
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Accounting as a Service — Software Provider Platform</text>
