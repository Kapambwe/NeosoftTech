  <rect x="460" y="325" width="155" height="50" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5" />
  <text x="476" y="347" font-family="Arial, sans-serif" font-size="12">💰</text>
  <text x="500" y="347" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fde68a">Revenue Sharing</text>
