  <rect x="460" y="148" width="155" height="75" rx="12" fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.7" />
  <text x="476" y="170" font-family="Arial, sans-serif" font-size="14">🤝</text>
  <text x="502" y="168" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#6ee7b7">Resellers</text>
