  <rect x="460" y="236" width="155" height="75" rx="12" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.7" />
  <text x="476" y="258" font-family="Arial, sans-serif" font-size="14">🔗</text>
  <text x="502" y="256" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#99f6e4">Partners</text>
  <text x="502" y="269" font-family="Arial, sans-serif" font-size="7.5" fill="#2dd4bf">Integrate &amp; Consult</text>
  <text x="476" y="283" font-family="Arial, sans-serif" font-size="7" fill="#2dd4bf">✓ API &amp; ERP integrations</text>
  <text x="476" y="296" font-family="Arial, sans-serif" font-size="7" fill="#2dd4bf">✓ Training &amp; onboarding</text>

