  <!-- Bar chart bars -->
  <rect x="205" y="186" width="22" height="54" rx="3" fill="url(#chartBar)" opacity="0.7" />
  <rect x="237" y="170" width="22" height="70" rx="3" fill="url(#chartBar)" opacity="0.75" />
  <rect x="269" y="155" width="22" height="85" rx="3" fill="url(#chartBar)" opacity="0.8" />
  <rect x="301" y="140" width="22" height="100" rx="3" fill="url(#chartBar)" opacity="0.85" />
  <rect x="333" y="122" width="22" height="118" rx="3" fill="url(#chartBar)" opacity="0.9" />
  <rect x="365" y="108" width="22" height="132" rx="3" fill="url(#chartBar)" />
  <rect x="397" y="96" width="22" height="144" rx="3" fill="url(#greenGrad)" filter="url(#glow)" />

