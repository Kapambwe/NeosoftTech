  <rect x="0" y="408" width="800" height="42" fill="#000000" opacity="0.35" />
  <g font-family="Arial, sans-serif" font-size="8.5" fill="#6ee7b7">
    <text x="30" y="424" font-weight="700" fill="#ffffff">12+</text>
    <text x="30" y="437">Accounting Modules</text>
    <line x1="115" y1="412" x2="115" y2="446" stroke="#34d399" stroke-width="0.8" opacity="0.4" />
    <text x="130" y="424" font-weight="700" fill="#ffffff">Multi-Tenant</text>
    <text x="130" y="437">Company Management</text>
    <line x1="248" y1="412" x2="248" y2="446" stroke="#34d399" stroke-width="0.8" opacity="0.4" />
    <text x="263" y="424" font-weight="700" fill="#fbbf24">Influencers</text>
    <text x="263" y="437">Promote &amp; Earn</text>
    <line x1="340" y1="412" x2="340" y2="446" stroke="#34d399" stroke-width="0.8" opacity="0.4" />
    <text x="355" y="424" font-weight="700" fill="#34d399">Resellers</text>
    <text x="355" y="437">Onboard Clients</text>
    <line x1="432" y1="412" x2="432" y2="446" stroke="#34d399" stroke-width="0.8" opacity="0.4" />
    <text x="447" y="424" font-weight="700" fill="#2dd4bf">ZRA/VAT</text>
    <text x="447" y="437">Tax Compliance</text>
    <line x1="514" y1="412" x2="514" y2="446" stroke="#34d399" stroke-width="0.8" opacity="0.4" />
    <text x="530" y="424" font-weight="700" fill="#60a5fa">kapambwe.github.io</text>
    <text x="530" y="437" fill="#93c5fd">/NeosoftWebApp</text>
