  <rect x="30" y="70" width="130" height="64" rx="10" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5" />
  <text x="46" y="90" font-family="Arial, sans-serif" font-size="8" fill="#6ee7b7">TOTAL REVENUE</text>
  <text x="46" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">K 2.4M</text>
  <rect x="46" y="118" width="50" height="3" rx="1.5" fill="url(#greenGrad)" />
  <text x="100" y="128" font-family="Arial, sans-serif" font-size="8" fill="#34d399">▲ 18%</text>

  <!-- Card 2: Expenses -->
  <rect x="30" y="146" width="130" height="64" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="30" y="146" width="130" height="64" rx="10" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4" />
  <text x="46" y="166" font-family="Arial, sans-serif" font-size="8" fill="#fde68a">TOTAL EXPENSES</text>
  <text x="46" y="186" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">K 890K</text>
  <rect x="46" y="194" width="50" height="3" rx="1.5" fill="url(#amberGrad)" />
  <text x="100" y="204" font-family="Arial, sans-serif" font-size="8" fill="#fbbf24">▼ 5%</text>

  <!-- Card 3: Net Profit -->
