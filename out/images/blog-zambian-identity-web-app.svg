  <text x="48" y="158" font-size="34" font-weight="800" fill="#a1a1aa">Identity</text>
  <text x="48" y="190" font-size="24" font-weight="700" fill="#60a5fa">WebApp</text>
  <text x="48" y="216" font-size="12.5" fill="#94a3b8">NRC · TPIN · PACRA · Biometric</text>
