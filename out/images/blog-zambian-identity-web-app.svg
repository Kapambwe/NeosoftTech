  <text x="217" y="296" font-size="9.5" fill="#94a3b8" text-anchor="middle">Real-Time</text>
  <text x="217" y="310" font-size="9.5" fill="#94a3b8" text-anchor="middle">Response</text>

  <rect x="280" y="254" width="106" height="68" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1"/>
  <text x="333" y="278" font-size="22" font-weight="800" fill="#34d399" text-anchor="middle">17</text>
