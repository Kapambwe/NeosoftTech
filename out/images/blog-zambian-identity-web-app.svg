  <text x="112" y="356" font-size="10.5" fill="#a1a1aa" text-anchor="middle">🪪 NRC Verification</text>

  <rect x="188" y="338" width="145" height="26" rx="13" fill="#1e293b"/>
  <text x="260" y="356" font-size="10.5" fill="#60a5fa" text-anchor="middle">🏢 PACRA Integration</text>

  <rect x="48" y="374" width="138" height="26" rx="13" fill="#1e293b"/>
  <text x="117" y="392" font-size="10.5" fill="#34d399" text-anchor="middle">📷 Biometric KYC</text>

  <rect x="198" y="374" width="135" height="26" rx="13" fill="#1e293b"/>
  <text x="265" y="392" font-size="10.5" fill="#c4b5fd" text-anchor="middle">🔐 W3C Credentials</text>

