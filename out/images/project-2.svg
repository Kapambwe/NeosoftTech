<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d4a6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#164e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Grid -->
  <g opacity="0.05" stroke="#67e8f9" stroke-width="0.5">
    <line x1="0" y1="50" x2="600" y2="50" /><line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" /><line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="250" x2="600" y2="250" /><line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="75" y1="0" x2="75" y2="400" /><line x1="150" y1="0" x2="150" y2="400" />
    <line x1="225" y1="0" x2="225" y2="400" /><line x1="300" y1="0" x2="300" y2="400" />
    <line x1="375" y1="0" x2="375" y2="400" /><line x1="450" y1="0" x2="450" y2="400" />
    <line x1="525" y1="0" x2="525" y2="400" />
  </g>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="44" fill="#061220" opacity="0.95" />
  <circle cx="20" cy="22" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="34" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="48" cy="22" r="5" fill="#10b981" opacity="0.8" />
  <text x="300" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle" letter-spacing="1">SECUREVAULT CLOUD — ZERO-KNOWLEDGE ENCRYPTION</text>

  <!-- Central cloud + lock composition -->
  <!-- Cloud outline (large) -->
  <g transform="translate(300, 195)" filter="url(#glow)">
    <ellipse cx="0" cy="15" rx="90" ry="55" fill="url(#shieldGrad)" opacity="0.5" stroke="#0891b2" stroke-width="1.5" />
    <circle cx="-60" cy="10" r="38" fill="url(#shieldGrad)" opacity="0.5" stroke="#0891b2" stroke-width="1" />
    <circle cx="60" cy="10" r="38" fill="url(#shieldGrad)" opacity="0.5" stroke="#0891b2" stroke-width="1" />
    <circle cx="0" cy="-15" r="45" fill="url(#shieldGrad)" opacity="0.5" stroke="#0891b2" stroke-width="1" />
  </g>

  <!-- Lock body on cloud -->
  <g transform="translate(300, 185)" filter="url(#glow)">
    <!-- Shackle -->
    <path d="M-18,-28 L-18,-44 Q-18,-62 0,-62 Q18,-62 18,-44 L18,-28" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
    <!-- Lock body -->
    <rect x="-28" y="-28" width="56" height="46" rx="6" fill="#0e7490" stroke="#06b6d4" stroke-width="2" />
    <!-- Keyhole -->
    <circle cx="0" cy="-8" r="8" fill="#0c1a2e" stroke="#67e8f9" stroke-width="1.5" />
    <rect x="-4" y="-2" width="8" height="14" rx="2" fill="#0c1a2e" />
    <!-- Encrypted dots on lock face -->
    <text x="-20" y="10" font-family="monospace" font-size="7" fill="#67e8f9" opacity="0.6">⬛⬜⬛⬜⬛</text>
    <text x="-20" y="20" font-family="monospace" font-size="7" fill="#67e8f9" opacity="0.6">⬜⬛⬜⬛⬜</text>
  </g>

  <!-- Encryption streams / data lines orbiting the cloud -->
  <g opacity="0.5" stroke="#06b6d4" stroke-width="0.8" fill="none">
    <ellipse cx="300" cy="195" rx="140" ry="90" stroke-dasharray="6,4" />
    <ellipse cx="300" cy="195" rx="165" ry="108" stroke="#0891b2" stroke-dasharray="4,6" opacity="0.3" />
  </g>

  <!-- Encrypted data packets orbiting -->
  <g filter="url(#soft)" opacity="0.85">
    <!-- Packet 1 -->
    <rect x="148" y="155" width="28" height="18" rx="3" fill="#164e63" stroke="#06b6d4" stroke-width="1" />
    <text x="162" y="168" font-family="monospace" font-size="6" fill="#67e8f9" text-anchor="middle">AES</text>
    <!-- Packet 2 -->
    <rect x="148" y="215" width="28" height="18" rx="3" fill="#164e63" stroke="#06b6d4" stroke-width="1" />
    <text x="162" y="228" font-family="monospace" font-size="6" fill="#67e8f9" text-anchor="middle">256</text>
    <!-- Packet 3 -->
    <rect x="424" y="155" width="28" height="18" rx="3" fill="#164e63" stroke="#06b6d4" stroke-width="1" />
    <text x="438" y="168" font-family="monospace" font-size="6" fill="#67e8f9" text-anchor="middle">RSA</text>
    <!-- Packet 4 -->
    <rect x="424" y="215" width="28" height="18" rx="3" fill="#164e63" stroke="#06b6d4" stroke-width="1" />
    <text x="438" y="228" font-family="monospace" font-size="6" fill="#67e8f9" text-anchor="middle">E2E</text>
  </g>

  <!-- Status cards row -->
  <rect x="20" y="58" width="130" height="56" rx="6" fill="#0c2340" opacity="0.9" stroke="#0891b2" stroke-width="0.8" />
  <text x="32" y="74" font-family="Arial, sans-serif" font-size="7.5" fill="#67e8f9" font-weight="700" letter-spacing="0.5">STORAGE</text>
  <text x="32" y="98" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="900">4.8</text>
  <text x="78" y="98" font-family="Arial, sans-serif" font-size="11" fill="#a5f3fc">PB</text>
  <text x="32" y="108" font-family="Arial, sans-serif" font-size="7" fill="#67e8f9">encrypted at rest</text>

  <rect x="162" y="58" width="130" height="56" rx="6" fill="#0c2340" opacity="0.9" stroke="#0891b2" stroke-width="0.8" />
  <text x="174" y="74" font-family="Arial, sans-serif" font-size="7.5" fill="#67e8f9" font-weight="700" letter-spacing="0.5">UPTIME</text>
  <text x="174" y="98" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="900">99.99</text>
  <text x="252" y="98" font-family="Arial, sans-serif" font-size="11" fill="#34d399">%</text>
  <text x="174" y="108" font-family="Arial, sans-serif" font-size="7" fill="#34d399">SLA guaranteed</text>

  <rect x="304" y="58" width="130" height="56" rx="6" fill="#0c2340" opacity="0.9" stroke="#0891b2" stroke-width="0.8" />
  <text x="316" y="74" font-family="Arial, sans-serif" font-size="7.5" fill="#67e8f9" font-weight="700" letter-spacing="0.5">CLIENTS</text>
  <text x="316" y="98" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="900">1,240</text>
  <text x="316" y="108" font-family="Arial, sans-serif" font-size="7" fill="#67e8f9">enterprise accounts</text>

  <rect x="446" y="58" width="134" height="56" rx="6" fill="#0c2340" opacity="0.9" stroke="#0891b2" stroke-width="0.8" />
  <text x="458" y="74" font-family="Arial, sans-serif" font-size="7.5" fill="#67e8f9" font-weight="700" letter-spacing="0.5">THREATS BLOCKED</text>
  <text x="458" y="98" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="900">2.1M</text>
  <text x="458" y="108" font-family="Arial, sans-serif" font-size="7" fill="#f87171">this month</text>

  <!-- Feature tags bottom -->
  <g font-family="Arial, sans-serif" font-size="8" font-weight="600">
    <rect x="20" y="320" width="110" height="22" rx="11" fill="#0e7490" opacity="0.9" />
    <text x="75" y="335" fill="#a5f3fc" text-anchor="middle">Zero-Knowledge</text>
    <rect x="140" y="320" width="90" height="22" rx="11" fill="#0e7490" opacity="0.9" />
    <text x="185" y="335" fill="#a5f3fc" text-anchor="middle">End-to-End</text>
    <rect x="240" y="320" width="100" height="22" rx="11" fill="#0e7490" opacity="0.9" />
    <text x="290" y="335" fill="#a5f3fc" text-anchor="middle">Multi-Region</text>
    <rect x="350" y="320" width="90" height="22" rx="11" fill="#0e7490" opacity="0.9" />
    <text x="395" y="335" fill="#a5f3fc" text-anchor="middle">ISO 27001</text>
    <rect x="450" y="320" width="130" height="22" rx="11" fill="#0e7490" opacity="0.9" />
    <text x="515" y="335" fill="#a5f3fc" text-anchor="middle">GDPR Compliant</text>
  </g>

  <!-- Binary stream decorative -->
  <text x="20" y="360" font-family="monospace" font-size="7" fill="#0891b2" opacity="0.4">01101000 01100101 01101100 01110000 01100110 01110101 01101100</text>
  <text x="20" y="372" font-family="monospace" font-size="7" fill="#0891b2" opacity="0.3">10110100 01001100 11010010 00101101 10011010 01110100 00110110</text>

  <!-- Bottom bar -->
  <rect x="0" y="378" width="600" height="22" fill="#061220" opacity="0.95" />
  <circle cx="16" cy="389" r="4" fill="#10b981" filter="url(#glow)" />
  <text x="26" y="393" font-family="Arial, sans-serif" font-size="8" fill="#67e8f9">All Systems Secure</text>
  <text x="300" y="393" font-family="Arial, sans-serif" font-size="9" fill="#0891b2" font-weight="600" text-anchor="middle" letter-spacing="0.5">NEOSOFT TECH · SECUREVAULT CLOUD · ZERO-KNOWLEDGE ENCRYPTION</text>
</svg>
