<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Deep green agricultural gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14532d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#052e16;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)" />

  <!-- Subtle grid -->
  <g opacity="0.05">
    <line x1="0" y1="62.5" x2="900" y2="62.5" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="125" x2="900" y2="125" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="187.5" x2="900" y2="187.5" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="900" y2="250" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="312.5" x2="900" y2="312.5" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="375" x2="900" y2="375" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="437.5" x2="900" y2="437.5" stroke="white" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="500" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Right side: supply chain flow diagram -->
  <rect x="490" y="50" width="380" height="400" rx="14" fill="#065f46" opacity="0.6" filter="url(#shadow)"/>

  <!-- Supply chain title -->
  <text x="680" y="78" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SUPPLY CHAIN NETWORK</text>

  <!-- Farmer node -->
  <rect x="580" y="95" width="200" height="52" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="116" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">🌾 Zambian Farmers</text>
  <text x="680" y="133" fill="#86efac" font-size="10" text-anchor="middle">Cattle · Goats · Crops · Dairy</text>

  <!-- Arrow down -->
  <line x1="680" y1="147" x2="680" y2="168" stroke="#4ade80" stroke-width="2"/>
  <polygon points="680,172 674,163 686,163" fill="#4ade80"/>

  <!-- NSA Platform node (highlighted) -->
  <rect x="555" y="174" width="250" height="52" rx="8" fill="url(#greenGrad)" filter="url(#glow)"/>
  <text x="680" y="196" fill="white" font-size="12" font-weight="700" text-anchor="middle">📱 NonStateActor Platform</text>
  <text x="680" y="212" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">30 modules · 13 institutions</text>

  <!-- Arrow down -->
  <line x1="680" y1="226" x2="680" y2="247" stroke="#4ade80" stroke-width="2"/>
  <polygon points="680,251 674,242 686,242" fill="#4ade80"/>

  <!-- Buyers row -->
  <!-- Zambeef -->
  <rect x="510" y="253" width="112" height="44" rx="6" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
  <text x="566" y="272" fill="#7dd3fc" font-size="10" font-weight="600" text-anchor="middle">Zambeef</text>
  <text x="566" y="287" fill="#94a3b8" font-size="9" text-anchor="middle">Local Market</text>

  <!-- Zamgoat -->
  <rect x="632" y="253" width="112" height="44" rx="6" fill="#2d1b69" stroke="#a78bfa" stroke-width="1"/>
  <text x="688" y="272" fill="#c4b5fd" font-size="10" font-weight="600" text-anchor="middle">Zamgoat</text>
  <text x="688" y="287" fill="#94a3b8" font-size="9" text-anchor="middle">Saudi Arabia</text>

  <!-- Export arrows  -->
  <line x1="566" y1="297" x2="566" y2="320" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="566,324 560,315 572,315" fill="#38bdf8"/>
  <line x1="688" y1="297" x2="688" y2="320" stroke="#a78bfa" stroke-width="1.5"/>
  <polygon points="688,324 682,315 694,315" fill="#a78bfa"/>

  <!-- Export destinations -->
  <rect x="506" y="326" width="122" height="36" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
  <text x="567" y="344" fill="#7dd3fc" font-size="10" font-weight="600" text-anchor="middle">ZMW 35/kg</text>
  <text x="567" y="357" fill="#94a3b8" font-size="9" text-anchor="middle">Local contract</text>

  <rect x="638" y="326" width="112" height="36" rx="6" fill="#3b0764" stroke="#c026d3" stroke-width="1"/>
  <text x="694" y="344" fill="#e879f9" font-size="10" font-weight="600" text-anchor="middle">Export: UAE/KSA</text>
  <text x="694" y="357" fill="#94a3b8" font-size="9" text-anchor="middle">Live livestock</text>

  <!-- International orgs row -->
  <rect x="510" y="378" width="112" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="566" y="396" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">GIZ / FAO</text>
  <text x="566" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">€850K program</text>

  <rect x="638" y="378" width="112" height="36" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="694" y="396" fill="#fcd34d" font-size="10" font-weight="600" text-anchor="middle">COFCO / Shoprite</text>
  <text x="694" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">Grains + Retail</text>

  <!-- Left panel: title block -->
  <!-- Badge -->
  <rect x="40" y="55" width="200" height="26" rx="13" fill="#065f46" opacity="0.9"/>
  <text x="140" y="72" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">AGRICULTURAL TECH PLATFORM</text>

  <!-- Main title -->
  <text x="40" y="130" fill="white" font-size="30" font-weight="700" letter-spacing="-0.5">NonStateActor</text>
  <text x="40" y="162" fill="#4ade80" font-size="18" font-weight="600">Web Application</text>
  <text x="40" y="190" fill="#86efac" font-size="14">Connecting Farmers to Global Markets</text>

  <!-- Divider -->
  <line x1="40" y1="208" x2="440" y2="208" stroke="#166534" stroke-width="1"/>

  <!-- Stats row 1 -->
  <rect x="40" y="220" width="88" height="62" rx="8" fill="#065f46" opacity="0.9"/>
  <text x="84" y="245" fill="#4ade80" font-size="22" font-weight="700" text-anchor="middle">13</text>
  <text x="84" y="261" fill="#86efac" font-size="10" text-anchor="middle">Institutions</text>
  <text x="84" y="275" fill="#4b7c5a" font-size="9" text-anchor="middle">connected</text>

  <rect x="140" y="220" width="88" height="62" rx="8" fill="#065f46" opacity="0.9"/>
  <text x="184" y="245" fill="#fbbf24" font-size="22" font-weight="700" text-anchor="middle">30</text>
  <text x="184" y="261" fill="#86efac" font-size="10" text-anchor="middle">Modules</text>
  <text x="184" y="275" fill="#4b7c5a" font-size="9" text-anchor="middle">per institution</text>

  <rect x="240" y="220" width="88" height="62" rx="8" fill="#065f46" opacity="0.9"/>
  <text x="284" y="245" fill="#2dd4bf" font-size="22" font-weight="700" text-anchor="middle">5+</text>
  <text x="284" y="261" fill="#86efac" font-size="10" text-anchor="middle">Countries</text>
  <text x="284" y="275" fill="#4b7c5a" font-size="9" text-anchor="middle">export markets</text>

  <rect x="340" y="220" width="88" height="62" rx="8" fill="#065f46" opacity="0.9"/>
  <text x="384" y="245" fill="#f472b6" font-size="22" font-weight="700" text-anchor="middle">GIS</text>
  <text x="384" y="261" fill="#86efac" font-size="10" text-anchor="middle">Farm Mapping</text>
  <text x="384" y="275" fill="#4b7c5a" font-size="9" text-anchor="middle">live tracking</text>

  <!-- Module tags row 1 -->
  <rect x="40" y="300" width="106" height="22" rx="4" fill="#14532d" opacity="0.9"/>
  <text x="93" y="315" fill="#86efac" font-size="10" text-anchor="middle">Contract Farming</text>
  <rect x="155" y="300" width="106" height="22" rx="4" fill="#14532d" opacity="0.9"/>
  <text x="208" y="315" fill="#86efac" font-size="10" text-anchor="middle">Market Prices</text>
  <rect x="270" y="300" width="120" height="22" rx="4" fill="#14532d" opacity="0.9"/>
  <text x="330" y="315" fill="#86efac" font-size="10" text-anchor="middle">Livestock Traceability</text>

  <!-- Module tags row 2 -->
  <rect x="40" y="332" width="120" height="22" rx="4" fill="#1e3a5f" opacity="0.9"/>
  <text x="100" y="347" fill="#7dd3fc" font-size="10" text-anchor="middle">International Trade</text>
  <rect x="170" y="332" width="110" height="22" rx="4" fill="#1e3a5f" opacity="0.9"/>
  <text x="225" y="347" fill="#7dd3fc" font-size="10" text-anchor="middle">Climate Smart Ag</text>
  <rect x="290" y="332" width="100" height="22" rx="4" fill="#1e3a5f" opacity="0.9"/>
  <text x="340" y="347" fill="#7dd3fc" font-size="10" text-anchor="middle">GIS Mapping</text>

  <!-- Module tags row 3 -->
  <rect x="40" y="364" width="90" height="22" rx="4" fill="#3b0764" opacity="0.9"/>
  <text x="85" y="379" fill="#c4b5fd" font-size="10" text-anchor="middle">Gender Inclusion</text>
  <rect x="140" y="364" width="100" height="22" rx="4" fill="#3b0764" opacity="0.9"/>
  <text x="190" y="379" fill="#c4b5fd" font-size="10" text-anchor="middle">Produce Tracking</text>
  <rect x="250" y="364" width="110" height="22" rx="4" fill="#3b0764" opacity="0.9"/>
  <text x="305" y="379" fill="#c4b5fd" font-size="10" text-anchor="middle">Value Chain Mgmt</text>

  <!-- Footer -->
  <text x="40" y="440" fill="#4b7c5a" font-size="11">NeoSoft · Zambia · Sierra Leone · Africa</text>
  <text x="40" y="458" fill="#4ade80" font-size="11" opacity="0.7">kapambwe.github.io/NonStateActorWebApp</text>
</svg>
