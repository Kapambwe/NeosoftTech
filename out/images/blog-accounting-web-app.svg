    <line x1="234" y1="412" x2="234" y2="446" stroke="#60a5fa" stroke-width="0.8" opacity="0.4" />
    <text x="250" y="424" font-weight="700" fill="#34d399">12</text>
    <text x="250" y="437">African Countries</text>
    <line x1="342" y1="412" x2="342" y2="446" stroke="#60a5fa" stroke-width="0.8" opacity="0.4" />
    <text x="358" y="424" font-weight="700" fill="#2dd4bf">ZRA/VAT</text>
    <text x="358" y="437">Tax Compliance</text>
    <line x1="448" y1="412" x2="448" y2="446" stroke="#60a5fa" stroke-width="0.8" opacity="0.4" />
    <text x="464" y="424" font-weight="700" fill="#a78bfa">AI-Powered</text>
    <text x="464" y="437">Decision Engine</text>
    <line x1="558" y1="412" x2="558" y2="446" stroke="#60a5fa" stroke-width="0.8" opacity="0.4" />
    <text x="574" y="424" font-weight="700" fill="#60a5fa">kapambwe.github.io</text>
