  <text x="478" y="164" font-family="Arial, sans-serif" font-size="7" fill="#fcd34d">• Zambia Railways Limited</text>
  <text x="478" y="176" font-family="Arial, sans-serif" font-size="7" fill="#fcd34d">• Road Development Agency</text>
  <text x="478" y="188" font-family="Arial, sans-serif" font-size="7" fill="#fcd34d">• National Milling Corp</text>

