  <text x="638" y="152" font-family="Arial, sans-serif" font-size="7" fill="#93c5fd">• Zambian Breweries PLC</text>
  <text x="638" y="164" font-family="Arial, sans-serif" font-size="7" fill="#93c5fd">• Zambia Sugar PLC</text>
  <text x="638" y="176" font-family="Arial, sans-serif" font-size="7" fill="#93c5fd">• Chilanga Cement PLC</text>
  <text x="638" y="188" font-family="Arial, sans-serif" font-size="7" fill="#93c5fd">• Zambeef Products PLC</text>

  <!-- Compliance block -->
  <rect x="462" y="210" width="148" height="75" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="462" y="210" width="148" height="75" rx="10" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5" />
  <text x="478" y="228" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#a7f3d0">🧮  Compliance Built-In</text>
  <text x="478" y="243" font-family="Arial, sans-serif" font-size="7" fill="#6ee7b7">• ZRA VAT Filing (16%)</text>
  <text x="478" y="255" font-family="Arial, sans-serif" font-size="7" fill="#6ee7b7">• Corporate Tax (35%)</text>
  <text x="478" y="267" font-family="Arial, sans-serif" font-size="7" fill="#6ee7b7">• NAPSA · NHIMA · PAYE</text>
  <text x="478" y="279" font-family="Arial, sans-serif" font-size="7" fill="#6ee7b7">• Immutable Audit Trail</text>

