  <!-- Revenue chart -->
  <rect x="188" y="58" width="252" height="196" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="188" y="58" width="252" height="196" rx="12" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4" />
  <text x="203" y="78" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#93c5fd">Enterprise Financial Dashboard</text>

  <!-- Bar chart -->
  <rect x="208" y="178" width="24" height="60" rx="3" fill="url(#barGrad)" opacity="0.6" />
  <rect x="242" y="160" width="24" height="78" rx="3" fill="url(#barGrad)" opacity="0.68" />
  <rect x="276" y="140" width="24" height="98" rx="3" fill="url(#barGrad)" opacity="0.76" />
  <rect x="310" y="120" width="24" height="118" rx="3" fill="url(#barGrad)" opacity="0.84" />
  <rect x="344" y="100" width="24" height="138" rx="3" fill="url(#barGrad)" opacity="0.92" />
  <rect x="378" y="82" width="24" height="156" rx="3" fill="url(#blueGrad)" filter="url(#glow)" />

  <!-- X-axis labels -->
  <g font-family="Arial, sans-serif" font-size="7" fill="#93c5fd">
    <text x="220" y="250" text-anchor="middle">Nov</text>
    <text x="254" y="250" text-anchor="middle">Dec</text>
    <text x="288" y="250" text-anchor="middle">Jan</text>
    <text x="322" y="250" text-anchor="middle">Feb</text>
    <text x="356" y="250" text-anchor="middle">Mar</text>
    <text x="390" y="250" text-anchor="middle">Apr</text>
