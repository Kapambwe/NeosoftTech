<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2d4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#60a5fa" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50" /><line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" /><line x1="0" y1="400" x2="800" y2="400" />
    <line x1="80" y1="0" x2="80" y2="450" /><line x1="160" y1="0" x2="160" y2="450" />
    <line x1="240" y1="0" x2="240" y2="450" /><line x1="320" y1="0" x2="320" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" /><line x1="480" y1="0" x2="480" y2="450" />
    <line x1="560" y1="0" x2="560" y2="450" /><line x1="640" y1="0" x2="640" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
  </g>

  <!-- ── LEFT PANEL: Business Segments ── -->
  <!-- SOE Card -->
  <rect x="28" y="70" width="138" height="64" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="28" y="70" width="138" height="64" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.7" />
  <text x="44" y="90" font-family="Arial, sans-serif" font-size="8" fill="#fde68a">STATE-OWNED ENTERPRISES</text>
  <text x="44" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">SOE Governance</text>
  <text x="44" y="122" font-family="Arial, sans-serif" font-size="7" fill="#fbbf24">Konkola · Zambia Railways · NMC</text>

  <!-- Large Business Card -->
  <rect x="28" y="146" width="138" height="64" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="28" y="146" width="138" height="64" rx="10" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6" />
  <text x="44" y="166" font-family="Arial, sans-serif" font-size="8" fill="#bfdbfe">LARGE ENTERPRISES</text>
  <text x="44" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Corporate Finance</text>
  <text x="44" y="198" font-family="Arial, sans-serif" font-size="7" fill="#60a5fa">Breweries · Sugar · Cement</text>

  <!-- SME Card -->
  <rect x="28" y="222" width="138" height="64" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="28" y="222" width="138" height="64" rx="10" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5" />
  <text x="44" y="242" font-family="Arial, sans-serif" font-size="8" fill="#a7f3d0">SMALL BUSINESSES</text>
  <text x="44" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">SME Growth</text>
  <text x="44" y="274" font-family="Arial, sans-serif" font-size="7" fill="#34d399">ZRA · Payroll · Cash Flow</text>

  <!-- Entrepreneur Card -->
  <rect x="28" y="298" width="138" height="64" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="28" y="298" width="138" height="64" rx="10" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.5" />
  <text x="44" y="318" font-family="Arial, sans-serif" font-size="8" fill="#99f6e4">ENTREPRENEURS</text>
  <text x="44" y="336" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Creator Economy</text>
  <text x="44" y="350" font-family="Arial, sans-serif" font-size="7" fill="#2dd4bf">12 Countries · 72+ Founders</text>

