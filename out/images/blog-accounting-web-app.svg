  <rect x="622" y="210" width="150" height="75" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="622" y="210" width="150" height="75" rx="10" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.5" />
  <text x="638" y="228" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#99f6e4">🤖  AI Intelligence</text>
  <text x="638" y="243" font-family="Arial, sans-serif" font-size="7" fill="#5eead4">• Decision Engine</text>
  <text x="638" y="255" font-family="Arial, sans-serif" font-size="7" fill="#5eead4">• Predictive Cash Flow</text>
  <text x="638" y="267" font-family="Arial, sans-serif" font-size="7" fill="#5eead4">• Insight Engine</text>
  <text x="638" y="279" font-family="Arial, sans-serif" font-size="7" fill="#5eead4">• Real-Time Alerts</text>

  <!-- Entrepreneur block -->
  <rect x="462" y="297" width="310" height="64" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="462" y="297" width="310" height="64" rx="10" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.6" />
  <text x="478" y="315" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#ddd6fe">🎵  Creator &amp; Entrepreneur Economy — 12 African Countries</text>
  <text x="478" y="330" font-family="Arial, sans-serif" font-size="7" fill="#c4b5fd">South Africa · Tanzania · Kenya · Nigeria · Zimbabwe · Ghana · Uganda</text>
  <text x="478" y="345" font-family="Arial, sans-serif" font-size="7" fill="#c4b5fd">Botswana · Rwanda · Ethiopia · Malawi · Morocco</text>
  <text x="478" y="358" font-family="Arial, sans-serif" font-size="7" fill="#c4b5fd">Music · Real Estate · Fashion · Brand Partnerships · Media Production</text>

  <!-- ── TITLE PANEL ── -->
  <rect x="0" y="0" width="800" height="50" fill="#000000" opacity="0.5" />
  <text x="28" y="17" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#93c5fd" letter-spacing="2">KAPAMBWE · NEOSOFT</text>
  <text x="28" y="36" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">AccountingWebApp — Enterprise Finance for Every Business</text>
  <!-- Blue pill badge -->
  <rect x="584" y="12" width="200" height="22" rx="11" fill="url(#blueGrad)" opacity="0.9" />
  <text x="684" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#eff6ff">SOE · Enterprise · SME · Entrepreneur</text>

  <!-- ── BOTTOM STAT BAR ── -->
  <rect x="0" y="408" width="800" height="42" fill="#000000" opacity="0.4" />
  <g font-family="Arial, sans-serif" font-size="8.5" fill="#93c5fd">
