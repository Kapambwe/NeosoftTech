<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#082f49;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#082f49;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <circle cx="800" cy="80" r="200" fill="#0369a1" opacity="0.08"/>
  <circle cx="100" cy="450" r="170" fill="#1d4ed8" opacity="0.07"/>

  <!-- Grid -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="900" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="225" y1="0" x2="225" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="675" y1="0" x2="675" y2="500" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- LEFT PANEL -->
  <text x="48" y="76" font-size="10.5" font-weight="700" fill="#7dd3fc" letter-spacing="2.5">GOVERNMENT DOCUMENT ISSUANCE PLATFORM</text>
  <text x="48" y="122" font-size="33" font-weight="800" fill="white">Document</text>
  <text x="48" y="158" font-size="33" font-weight="800" fill="#38bdf8">Issuer</text>
  <text x="48" y="190" font-size="24" font-weight="700" fill="#93c5fd">WebApp</text>
  <text x="48" y="216" font-size="12.5" fill="#bae6fd">PACRA · ZRA · Council Licences</text>
  <text x="48" y="234" font-size="12.5" fill="#bae6fd">Cryptographic Signing · QR Verify</text>

  <!-- Stat cards -->
  <rect x="48" y="254" width="106" height="68" rx="10" fill="url(#cardGrad)" stroke="#0369a1" stroke-width="1"/>
  <text x="101" y="278" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">&lt; 24h</text>
  <text x="101" y="296" font-size="9.5" fill="#bae6fd" text-anchor="middle">Tax Clearance</text>
  <text x="101" y="310" font-size="9.5" fill="#bae6fd" text-anchor="middle">Issuance</text>

  <rect x="164" y="254" width="106" height="68" rx="10" fill="url(#cardGrad)" stroke="#1d4ed8" stroke-width="1"/>
  <text x="217" y="278" font-size="19" font-weight="800" fill="#93c5fd" text-anchor="middle">Crypto</text>
  <text x="217" y="296" font-size="9.5" fill="#bae6fd" text-anchor="middle">Document</text>
  <text x="217" y="310" font-size="9.5" fill="#bae6fd" text-anchor="middle">Signing</text>

  <rect x="280" y="254" width="106" height="68" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1"/>
  <text x="333" y="278" font-size="22" font-weight="800" fill="#fbbf24" text-anchor="middle">6+</text>
  <text x="333" y="296" font-size="9.5" fill="#bae6fd" text-anchor="middle">Doc Types</text>
  <text x="333" y="310" font-size="9.5" fill="#bae6fd" text-anchor="middle">Supported</text>

  <!-- Feature chips -->
  <rect x="48" y="338" width="147" height="26" rx="13" fill="#0c4a6e"/>
  <text x="121" y="356" font-size="10.5" fill="#7dd3fc" text-anchor="middle">📜 Cert of Incorporation</text>

  <rect x="207" y="338" width="145" height="26" rx="13" fill="#0c4a6e"/>
  <text x="279" y="356" font-size="10.5" fill="#93c5fd" text-anchor="middle">🧾 Tax Clearance Cert</text>

  <rect x="48" y="374" width="138" height="26" rx="13" fill="#0c4a6e"/>
  <text x="117" y="392" font-size="10.5" fill="#38bdf8" text-anchor="middle">🏪 Business Licence</text>

  <rect x="198" y="374" width="154" height="26" rx="13" fill="#0c4a6e"/>
  <text x="275" y="392" font-size="10.5" fill="#fbbf24" text-anchor="middle">🔏 QR Authenticity Verify</text>

  <text x="48" y="452" font-size="12" fill="#7dd3fc" opacity="0.8">kapambwe.github.io/DocumentIssuerWebApp</text>
  <text x="48" y="474" font-size="11" fill="#bae6fd" opacity="0.6">NeoSoft Technologies · PACRA · ZRA · Councils</text>

  <!-- RIGHT PANEL: Certificate mockup -->
  <rect x="462" y="36" width="410" height="428" rx="14" fill="#082f49" opacity="0.9" filter="url(#shadow)"/>
  <text x="667" y="66" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">CERTIFICATE ISSUANCE WORKFLOW</text>

  <!-- Step 1: Application -->
  <rect x="480" y="78" width="374" height="42" rx="7" fill="url(#skyGrad)" opacity="0.9"/>
  <text x="502" y="96" font-size="11" font-weight="700" fill="white">① Application &amp; Identity Verification</text>
  <text x="502" y="112" font-size="10" fill="rgba(255,255,255,0.85)">Company submits · NRC/PACRA identity verified automatically</text>

  <!-- Arrow -->
  <line x1="667" y1="120" x2="667" y2="134" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="662,132 667,140 672,132" fill="#38bdf8"/>

  <!-- Step 2: Agency Review -->
  <rect x="480" y="140" width="374" height="42" rx="7" fill="#0c4a6e" stroke="#0369a1" stroke-width="1"/>
  <text x="502" y="158" font-size="11" font-weight="700" fill="#38bdf8">② Agency Compliance Review</text>
  <text x="502" y="174" font-size="10" fill="#bae6fd">PACRA/ZRA/Council reviewer workflow · Audit trail generated</text>

  <!-- Arrow -->
  <line x1="667" y1="182" x2="667" y2="196" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="662,194 667,202 672,194" fill="#38bdf8"/>

  <!-- Step 3: Auto Check -->
  <rect x="480" y="202" width="374" height="42" rx="7" fill="#0c4a6e" stroke="#059669" stroke-width="1"/>
  <text x="502" y="220" font-size="11" font-weight="700" fill="#34d399">③ Automated Compliance Check</text>
  <text x="502" y="236" font-size="10" fill="#bae6fd">ZRA tax status · PACRA filings · Council clearances</text>

  <!-- Arrow -->
  <line x1="667" y1="244" x2="667" y2="258" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="662,256 667,264 672,256" fill="#38bdf8"/>

  <!-- Step 4: Digital Signing -->
  <rect x="480" y="264" width="374" height="42" rx="7" fill="#0c4a6e" stroke="#7c3aed" stroke-width="1"/>
  <text x="502" y="282" font-size="11" font-weight="700" fill="#c4b5fd">④ Cryptographic Signing + QR Embed</text>
  <text x="502" y="298" font-size="10" fill="#bae6fd">Private key signature · QR verification code embedded</text>

  <!-- Arrow -->
  <line x1="667" y1="306" x2="667" y2="320" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="662,318 667,326 672,318" fill="#38bdf8"/>

  <!-- Step 5: Certificate Issued -->
  <rect x="480" y="326" width="374" height="76" rx="8" fill="#0a3d62" stroke="#0369a1" stroke-width="1.5"/>
  <text x="502" y="349" font-size="11" font-weight="700" fill="#38bdf8">✅ CERTIFICATE ISSUED — PACRA / ZRA / COUNCIL</text>
  <line x1="480" y1="358" x2="854" y2="358" stroke="#0369a1" stroke-width="0.5"/>
  <text x="502" y="373" font-size="10" fill="#7dd3fc">Company: Kapambwe Enterprises Ltd</text>
  <text x="502" y="388" font-size="10" fill="#7dd3fc">Doc: Tax Clearance Certificate · Issued: Mar 19, 2026</text>
  <text x="502" y="399" font-size="9" fill="#93c5fd">Signature: 0x4a2f... · QR: verify.neosoft.zm/doc/TC-2026-00123</text>

  <!-- Public Verify Banner -->
  <rect x="480" y="414" width="374" height="38" rx="7" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
  <text x="667" y="431" font-size="10.5" font-weight="700" fill="#7dd3fc" text-anchor="middle">🔏 Any Party Can Verify This Document in &lt; 1 Second</text>
  <text x="667" y="447" font-size="9.5" fill="#bae6fd" text-anchor="middle">API · QR Scan · Web Portal — No issuing agency contact needed</text>
</svg>
