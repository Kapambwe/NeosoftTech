<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Deep navy gradient background -->
    <linearGradient id="pdpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a6e;stop-opacity:1" />
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="pdpCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#132a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d3a7a;stop-opacity:1" />
    </linearGradient>
    <!-- Gold / Zambia green accent -->
    <linearGradient id="pdpGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pdpGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pdpBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pdpPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="pdpGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="pdpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#pdpBg)" />

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#93c5fd" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="50" y1="0" x2="50" y2="450" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="650" y1="0" x2="650" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="750" y1="0" x2="750" y2="450" />
  </g>

  <!-- === LEFT: Sector nodes feeding into hub === -->
  <!-- Connection lines from sectors to centre hub -->
  <g opacity="0.4" stroke="#60a5fa" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
    <!-- Agriculture -->
    <line x1="80" y1="90" x2="310" y2="220" />
    <!-- Health -->
    <line x1="80" y1="175" x2="310" y2="220" />
    <!-- Education -->
    <line x1="80" y1="260" x2="310" y2="220" />
    <!-- Local Gov -->
    <line x1="80" y1="345" x2="310" y2="220" />
    <!-- Livestock -->
    <line x1="160" y1="50" x2="310" y2="220" />
    <!-- Procurement -->
    <line x1="160" y1="390" x2="310" y2="220" />
  </g>

  <!-- Sector node: Agriculture -->
  <g filter="url(#pdpGlow)">
    <circle cx="80" cy="90" r="22" fill="#10b981" opacity="0.2" />
    <circle cx="80" cy="90" r="14" fill="#10b981" opacity="0.9" />
  </g>
  <text x="80" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">🌾</text>
  <text x="80" y="116" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a7f3d0">Agriculture</text>

  <!-- Sector node: Health -->
  <g filter="url(#pdpGlow)">
    <circle cx="80" cy="175" r="22" fill="#f43f5e" opacity="0.2" />
    <circle cx="80" cy="175" r="14" fill="#f43f5e" opacity="0.9" />
  </g>
  <text x="80" y="179" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">🏥</text>
  <text x="80" y="201" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fda4af">Health</text>

  <!-- Sector node: Education -->
  <g filter="url(#pdpGlow)">
    <circle cx="80" cy="260" r="22" fill="#f59e0b" opacity="0.2" />
    <circle cx="80" cy="260" r="14" fill="#f59e0b" opacity="0.9" />
  </g>
  <text x="80" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">🎓</text>
  <text x="80" y="286" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fde68a">Education</text>

  <!-- Sector node: Local Gov -->
  <g filter="url(#pdpGlow)">
    <circle cx="80" cy="345" r="22" fill="#8b5cf6" opacity="0.2" />
    <circle cx="80" cy="345" r="14" fill="#8b5cf6" opacity="0.9" />
  </g>
  <text x="80" y="349" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">🏛</text>
  <text x="80" y="371" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#c4b5fd">Local Gov</text>

  <!-- Sector node: Livestock -->
  <g filter="url(#pdpGlow)">
    <circle cx="160" cy="50" r="22" fill="#06b6d4" opacity="0.2" />
    <circle cx="160" cy="50" r="14" fill="#06b6d4" opacity="0.9" />
  </g>
  <text x="160" y="54" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">🐄</text>
  <text x="160" y="76" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a5f3fc">Livestock</text>

  <!-- Sector node: Procurement -->
  <g filter="url(#pdpGlow)">
    <circle cx="160" cy="390" r="22" fill="#ec4899" opacity="0.2" />
    <circle cx="160" cy="390" r="14" fill="#ec4899" opacity="0.9" />
  </g>
  <text x="160" y="394" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">📦</text>
  <text x="160" y="416" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fbcfe8">Procurement</text>

  <!-- === CENTRE HUB: Presidential Delivery Intelligence Platform === -->
  <!-- Outer ring -->
  <circle cx="310" cy="220" r="70" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4" />
  <!-- Hub background -->
  <circle cx="310" cy="220" r="58" fill="url(#pdpCard)" filter="url(#pdpShadow)" />
  <circle cx="310" cy="220" r="58" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
  <!-- Hub icon background glow -->
  <circle cx="310" cy="200" r="22" fill="#1d4ed8" opacity="0.4" />
  <!-- Presidential seal silhouette (simplified eagle / crest shape) -->
  <circle cx="310" cy="200" r="16" fill="#2563eb" opacity="0.9" />
  <text x="310" y="205" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">🦅</text>
  <text x="310" y="230" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#93c5fd" letter-spacing="0.5">PRESIDENTIAL</text>
  <text x="310" y="242" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#93c5fd" letter-spacing="0.5">DELIVERY UNIT</text>

  <!-- Arrow from hub to dashboard -->
  <line x1="370" y1="220" x2="420" y2="220" stroke="#60a5fa" stroke-width="2" opacity="0.7" marker-end="url(#arrowBlue)" />
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa" />
    </marker>
  </defs>

  <!-- === RIGHT: National Dashboard Panel === -->
  <rect x="425" y="30" width="350" height="390" rx="12" fill="url(#pdpCard)" filter="url(#pdpShadow)" opacity="0.95" />
  <rect x="425" y="30" width="350" height="390" rx="12" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4" />

  <!-- Dashboard header -->
  <rect x="425" y="30" width="350" height="44" rx="12" fill="#1d4ed8" opacity="0.7" />
  <rect x="425" y="56" width="350" height="18" fill="#1d4ed8" opacity="0.7" />
  <circle cx="449" cy="52" r="6" fill="#f87171" />
  <circle cx="467" cy="52" r="6" fill="#fbbf24" />
  <circle cx="485" cy="52" r="6" fill="#34d399" />
  <text x="510" y="56" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e0f2fe" letter-spacing="0.3">National Delivery Intelligence Dashboard</text>

  <!-- KPI row -->
  <!-- KPI 1: Livestock Registrations -->
  <rect x="440" y="90" width="98" height="62" rx="8" fill="#0f2a5e" opacity="0.8" />
  <rect x="440" y="90" width="98" height="4" rx="2" fill="url(#pdpGreen)" />
  <text x="489" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#34d399">142K</text>
  <text x="489" y="130" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6ee7b7">Livestock Registered</text>
  <text x="489" y="144" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#34d399">▲ 12%</text>

  <!-- KPI 2: Health Visits -->
  <rect x="549" y="90" width="98" height="62" rx="8" fill="#0f2a5e" opacity="0.8" />
  <rect x="549" y="90" width="98" height="4" rx="2" fill="url(#pdpBlue)" />
  <text x="598" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#60a5fa">2.4M</text>
  <text x="598" y="130" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#93c5fd">Patient Visits</text>
  <text x="598" y="144" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#60a5fa">▲ 8%</text>

  <!-- KPI 3: School Enrolment -->
  <rect x="658" y="90" width="98" height="62" rx="8" fill="#0f2a5e" opacity="0.8" />
  <rect x="658" y="90" width="98" height="4" rx="2" fill="url(#pdpGold)" />
  <text x="707" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fbbf24">3.1M</text>
  <text x="707" y="130" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#fde68a">School Enrolment</text>
  <text x="707" y="144" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#fbbf24">▲ 5%</text>

  <!-- Divider -->
  <line x1="440" y1="168" x2="760" y2="168" stroke="#1e3a7a" stroke-width="1" opacity="0.8" />

  <!-- Section label -->
  <text x="440" y="185" font-family="sans-serif" font-size="9" font-weight="bold" fill="#93c5fd" letter-spacing="0.5">PROVINCIAL DELIVERY PERFORMANCE</text>

  <!-- Bar chart -->
  <!-- Y-axis -->
  <line x1="460" y1="192" x2="460" y2="290" stroke="#1e3a7a" stroke-width="1" />
  <!-- X-axis -->
  <line x1="460" y1="290" x2="760" y2="290" stroke="#1e3a7a" stroke-width="1" />
  <!-- Bars: Lusaka, Copperbelt, Southern, Eastern, Northern, Western, N/Western, Luapula, Muchinga -->
  <rect x="468" y="224" width="22" height="66" rx="3" fill="url(#pdpBlue)" opacity="0.85" />
  <rect x="500" y="210" width="22" height="80" rx="3" fill="url(#pdpGreen)" opacity="0.85" />
  <rect x="532" y="238" width="22" height="52" rx="3" fill="url(#pdpGold)" opacity="0.85" />
  <rect x="564" y="230" width="22" height="60" rx="3" fill="url(#pdpPurple)" opacity="0.85" />
  <rect x="596" y="245" width="22" height="45" rx="3" fill="url(#pdpBlue)" opacity="0.85" />
  <rect x="628" y="232" width="22" height="58" rx="3" fill="url(#pdpGreen)" opacity="0.85" />
  <rect x="660" y="220" width="22" height="70" rx="3" fill="url(#pdpGold)" opacity="0.85" />
  <rect x="692" y="248" width="22" height="42" rx="3" fill="url(#pdpPurple)" opacity="0.85" />
  <rect x="724" y="235" width="22" height="55" rx="3" fill="url(#pdpBlue)" opacity="0.85" />
  <!-- Province labels -->
  <text x="479" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,479,304)">Lusaka</text>
  <text x="511" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,511,304)">CB</text>
  <text x="543" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,543,304)">Southern</text>
  <text x="575" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,575,304)">Eastern</text>
  <text x="607" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,607,304)">Northern</text>
  <text x="639" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,639,304)">Western</text>
  <text x="671" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,671,304)">N/West</text>
  <text x="703" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,703,304)">Luapula</text>
  <text x="735" y="304" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd" transform="rotate(-35,735,304)">Muchinga</text>

  <!-- Divider -->
  <line x1="440" y1="322" x2="760" y2="322" stroke="#1e3a7a" stroke-width="1" opacity="0.8" />

  <!-- Alert panel -->
  <text x="440" y="338" font-family="sans-serif" font-size="9" font-weight="bold" fill="#93c5fd" letter-spacing="0.5">EARLY WARNING ALERTS</text>
  <!-- Alert 1 -->
  <rect x="440" y="345" width="152" height="28" rx="6" fill="#7c1d1d" opacity="0.6" />
  <circle cx="454" cy="359" r="5" fill="#f87171" />
  <text x="464" y="363" font-family="sans-serif" font-size="8" fill="#fca5a5">Livestock reg. declining — Eastern</text>
  <!-- Alert 2 -->
  <rect x="602" y="345" width="152" height="28" rx="6" fill="#78350f" opacity="0.6" />
  <circle cx="616" cy="359" r="5" fill="#fbbf24" />
  <text x="626" y="363" font-family="sans-serif" font-size="8" fill="#fde68a">Slow project delivery — Luapula</text>
  <!-- Alert 3 -->
  <rect x="440" y="381" width="152" height="28" rx="6" fill="#78350f" opacity="0.6" />
  <circle cx="454" cy="395" r="5" fill="#fbbf24" />
  <text x="464" y="399" font-family="sans-serif" font-size="8" fill="#fde68a">Drug shortages flagged — Northern</text>
  <!-- Alert 4 -->
  <rect x="602" y="381" width="152" height="28" rx="6" fill="#064e3b" opacity="0.6" />
  <circle cx="616" cy="395" r="5" fill="#34d399" />
  <text x="626" y="399" font-family="sans-serif" font-size="8" fill="#6ee7b7">Farmer reg. on track — Southern</text>

  <!-- === Zambia map outline (simplified) === -->
  <!-- Subtle map watermark in centre area -->
  <g opacity="0.07" fill="#93c5fd">
    <ellipse cx="310" cy="350" rx="90" ry="60" />
  </g>

  <!-- Bottom label -->
  <text x="400" y="438" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f2fe" letter-spacing="1">Presidential Delivery Intelligence Platform</text>
  <text x="400" y="452" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#93c5fd" letter-spacing="0.5">Real-Time National Monitoring · Delivering for the People of Zambia</text>
</svg>
