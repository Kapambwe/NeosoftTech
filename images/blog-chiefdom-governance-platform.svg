        <rect x="10" y="52" rx="10" width="80" height="18" fill="#1e293b"/>
        <text x="50" y="65" text-anchor="middle" font-size="8" fill="#fcd34d">📚 Youth &amp; Edu</text>

        <rect x="104" y="52" rx="10" width="80" height="18" fill="#1e293b"/>
        <text x="144" y="65" text-anchor="middle" font-size="8" fill="#c4b5fd">🏗️ Dev Projects</text>

