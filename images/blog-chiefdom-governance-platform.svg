        <text x="105" y="32" font-size="8" fill="#93c5fd">✓ North-Western</text>
        <text x="105" y="46" font-size="8" fill="#93c5fd">✓ Southern Province</text>
        <text x="105" y="60" font-size="8" fill="#93c5fd">✓ Western Province</text>
