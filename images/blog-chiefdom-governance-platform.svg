  <text x="450" y="480" text-anchor="middle" font-size="10" fill="#475569">kapambwe.github.io/ChiefdomWebApp</text>
  <text x="860" y="480" text-anchor="end" font-size="10" fill="#475569">Traditional Governance · GovTech</text>
