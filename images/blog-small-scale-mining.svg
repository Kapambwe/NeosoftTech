<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Deep amber/earth gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1208;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d2b0e;stop-opacity:1" />
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b2c10;stop-opacity:1" />
    </linearGradient>
    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <!-- Copper gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <!-- Green gem gradient -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <!-- Bar gradients -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <!-- Node glow filter -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle earth texture grid -->
  <g opacity="0.05" stroke="#d97706" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="50" y1="0" x2="50" y2="450" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
  </g>

  <!-- Mining network nodes (left side) -->
  <g opacity="0.35" stroke="#f59e0b" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
    <line x1="80" y1="110" x2="155" y2="185" />
    <line x1="80" y1="110" x2="155" y2="75" />
    <line x1="155" y1="185" x2="240" y2="245" />
    <line x1="155" y1="75" x2="240" y2="140" />
    <line x1="155" y1="75" x2="240" y2="45" />
    <line x1="240" y1="140" x2="330" y2="190" />
    <line x1="240" y1="245" x2="330" y2="190" />
    <line x1="240" y1="45" x2="330" y2="90" />
    <line x1="330" y1="190" x2="330" y2="90" />
  </g>
  <!-- Nodes -->
  <g filter="url(#nodeGlow)">
    <circle cx="80" cy="110" r="10" fill="#d97706" opacity="0.9" />
    <circle cx="80" cy="110" r="5" fill="#fcd34d" />
    <circle cx="155" cy="75" r="8" fill="#b45309" opacity="0.9" />
    <circle cx="155" cy="75" r="4" fill="#fde68a" />
    <circle cx="155" cy="185" r="9" fill="#d97706" opacity="0.9" />
    <circle cx="155" cy="185" r="4.5" fill="#fcd34d" />
    <circle cx="240" cy="45" r="7" fill="#059669" opacity="0.9" />
    <circle cx="240" cy="45" r="3.5" fill="#6ee7b7" />
    <circle cx="240" cy="140" r="11" fill="#d97706" opacity="0.95" />
    <circle cx="240" cy="140" r="5.5" fill="#fde68a" />
    <circle cx="240" cy="245" r="8" fill="#b45309" opacity="0.9" />
    <circle cx="240" cy="245" r="4" fill="#fde68a" />
    <circle cx="330" cy="90" r="9" fill="#059669" opacity="0.9" />
    <circle cx="330" cy="90" r="4.5" fill="#6ee7b7" />
    <circle cx="330" cy="190" r="13" fill="#92400e" opacity="0.95" />
    <circle cx="330" cy="190" r="6.5" fill="#fcd34d" />
  </g>

  <!-- Pickaxe / mining icon (stylized, left bottom) -->
  <g transform="translate(50, 290)" opacity="0.8">
    <circle cx="44" cy="44" r="34" fill="none" stroke="#d97706" stroke-width="2" opacity="0.5" />
    <circle cx="44" cy="44" r="24" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" />
    <!-- Simple pickaxe shape -->
    <line x1="22" y1="66" x2="66" y2="22" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M 22 22 Q 28 14 38 20 L 26 32 Z" fill="#f59e0b" opacity="0.9" />
    <path d="M 66 22 Q 74 28 68 38 L 56 26 Z" fill="#fcd34d" opacity="0.85" />
    <!-- Sparkle gem -->
    <polygon points="44,30 47,37 55,37 49,42 51,50 44,45 37,50 39,42 33,37 41,37" fill="#10b981" opacity="0.85" />
  </g>

  <!-- Main dashboard card (right side) -->
  <rect x="370" y="28" width="395" height="396" rx="16" fill="url(#cardGrad)" opacity="0.93" />
  <rect x="370" y="28" width="395" height="396" rx="16" fill="none" stroke="#d97706" stroke-width="1" opacity="0.4" />

  <!-- Dashboard header bar -->
  <rect x="370" y="28" width="395" height="48" rx="16" fill="#451a03" opacity="0.85" />
  <rect x="370" y="60" width="395" height="16" fill="#451a03" opacity="0.85" />

  <!-- Dashboard title -->
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fde68a" letter-spacing="0.5">SMALL MINERS DIGITAL PLATFORM — PRODUCTION DASHBOARD</text>

  <!-- Three window dots -->
  <circle cx="386" cy="43" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="402" cy="43" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="418" cy="43" r="5" fill="#10b981" opacity="0.8" />

  <!-- KPI Cards row -->
  <!-- Card 1: Active Miners -->
  <rect x="388" y="94" width="108" height="64" rx="8" fill="#451a03" opacity="0.75" />
  <text x="404" y="113" font-family="Arial, sans-serif" font-size="9" fill="#fcd34d" font-weight="600" letter-spacing="0.5">ACTIVE MINERS</text>
  <text x="404" y="140" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="800">4,820</text>
  <text x="460" y="152" font-family="Arial, sans-serif" font-size="9" fill="#34d399">▲ 12%</text>

  <!-- Card 2: Production (kg) -->
  <rect x="508" y="94" width="108" height="64" rx="8" fill="#1a3a1a" opacity="0.75" />
  <text x="524" y="113" font-family="Arial, sans-serif" font-size="9" fill="#6ee7b7" font-weight="600" letter-spacing="0.5">OUTPUT (KG)</text>
  <text x="524" y="140" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="800">12.4t</text>
  <text x="570" y="152" font-family="Arial, sans-serif" font-size="9" fill="#34d399">+8%</text>

  <!-- Card 3: Licensed -->
  <rect x="628" y="94" width="108" height="64" rx="8" fill="#1e3a5f" opacity="0.75" />
  <text x="644" y="113" font-family="Arial, sans-serif" font-size="9" fill="#93c5fd" font-weight="600" letter-spacing="0.5">LICENSED</text>
  <text x="644" y="140" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="800">94%</text>
  <text x="685" y="152" font-family="Arial, sans-serif" font-size="9" fill="#93c5fd">✓ Verified</text>

  <!-- Bar chart heading -->
  <text x="388" y="188" font-family="Arial, sans-serif" font-size="10" fill="#fcd34d" font-weight="700" letter-spacing="0.5">MINERAL PRODUCTION BY TYPE (METRIC TONNES / MONTH)</text>

  <!-- Chart area -->
  <rect x="388" y="196" width="344" height="126" rx="6" fill="#100a02" opacity="0.55" />

  <!-- Y-axis labels -->
  <text x="392" y="316" font-family="Arial, sans-serif" font-size="8" fill="#78716c">0</text>
  <text x="392" y="289" font-family="Arial, sans-serif" font-size="8" fill="#78716c">1</text>
  <text x="392" y="262" font-family="Arial, sans-serif" font-size="8" fill="#78716c">2</text>
  <text x="392" y="235" font-family="Arial, sans-serif" font-size="8" fill="#78716c">3</text>
  <text x="392" y="208" font-family="Arial, sans-serif" font-size="8" fill="#78716c">4</text>

  <!-- Guide lines -->
  <g stroke="#3d2b0e" stroke-width="1" opacity="0.7">
    <line x1="404" y1="316" x2="724" y2="316" />
    <line x1="404" y1="289" x2="724" y2="289" />
    <line x1="404" y1="262" x2="724" y2="262" />
    <line x1="404" y1="235" x2="724" y2="235" />
    <line x1="404" y1="208" x2="724" y2="208" />
  </g>

  <!-- Bars - Copper -->
  <rect x="416" y="208" width="22" height="108" rx="3" fill="url(#bar3)" />
  <rect x="440" y="230" width="22" height="86" rx="3" fill="url(#bar1)" />
  <rect x="464" y="262" width="22" height="54" rx="3" fill="url(#bar2)" />
  <text x="441" y="330" font-family="Arial, sans-serif" font-size="8.5" fill="#a8a29e" text-anchor="middle">Copper</text>

  <!-- Bars - Gold -->
  <rect x="504" y="220" width="22" height="96" rx="3" fill="url(#bar1)" />
  <rect x="528" y="240" width="22" height="76" rx="3" fill="url(#bar3)" />
  <rect x="552" y="271" width="22" height="45" rx="3" fill="url(#bar2)" />
  <text x="528" y="330" font-family="Arial, sans-serif" font-size="8.5" fill="#a8a29e" text-anchor="middle">Gold</text>

  <!-- Bars - Emerald -->
  <rect x="592" y="235" width="22" height="81" rx="3" fill="url(#bar2)" />
  <rect x="616" y="255" width="22" height="61" rx="3" fill="url(#bar1)" />
  <rect x="640" y="279" width="22" height="37" rx="3" fill="url(#bar3)" />
  <text x="616" y="330" font-family="Arial, sans-serif" font-size="8.5" fill="#a8a29e" text-anchor="middle">Emerald</text>

  <!-- Bars - Other -->
  <rect x="680" y="245" width="22" height="71" rx="3" fill="url(#bar1)" />
  <rect x="704" y="263" width="18" height="53" rx="3" fill="url(#bar2)" />
  <text x="693" y="330" font-family="Arial, sans-serif" font-size="8.5" fill="#a8a29e" text-anchor="middle">Other</text>

  <!-- Legend -->
  <rect x="592" y="196" width="10" height="8" rx="1" fill="#ea580c" />
  <text x="605" y="204" font-family="Arial, sans-serif" font-size="8" fill="#a8a29e">Small-Scale</text>
  <rect x="652" y="196" width="10" height="8" rx="1" fill="#f59e0b" />
  <text x="665" y="204" font-family="Arial, sans-serif" font-size="8" fill="#a8a29e">Medium</text>
  <rect x="704" y="196" width="10" height="8" rx="1" fill="#10b981" />
  <text x="717" y="204" font-family="Arial, sans-serif" font-size="8" fill="#a8a29e">Large</text>

  <!-- Compliance panel -->
  <rect x="388" y="340" width="162" height="68" rx="8" fill="#0f0a02" opacity="0.8" />
  <text x="400" y="357" font-family="Arial, sans-serif" font-size="9" fill="#d97706" font-weight="700" letter-spacing="0.5">COMPLIANCE STATUS</text>
  <!-- Bars -->
  <rect x="400" y="363" width="120" height="5" rx="2" fill="#1c1208" />
  <rect x="400" y="363" width="113" height="5" rx="2" fill="#10b981" />
  <text x="527" y="369" font-family="Arial, sans-serif" font-size="8" fill="#6ee7b7">94%</text>
  <rect x="400" y="374" width="120" height="5" rx="2" fill="#1c1208" />
  <rect x="400" y="374" width="96" height="5" rx="2" fill="#f59e0b" />
  <text x="527" y="380" font-family="Arial, sans-serif" font-size="8" fill="#fde68a">80%</text>
  <rect x="400" y="385" width="120" height="5" rx="2" fill="#1c1208" />
  <rect x="400" y="385" width="108" height="5" rx="2" fill="#3b82f6" />
  <text x="527" y="391" font-family="Arial, sans-serif" font-size="8" fill="#93c5fd">90%</text>
  <text x="400" y="402" font-family="Arial, sans-serif" font-size="7.5" fill="#57534e">Licensing · Safety · Env. Reports</text>

  <!-- Miner activity list -->
  <rect x="560" y="340" width="175" height="68" rx="8" fill="#0f0a02" opacity="0.8" />
  <text x="572" y="357" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b" font-weight="700" letter-spacing="0.5">LIVE MINE ACTIVITY</text>
  <circle cx="572" cy="369" r="4" fill="#10b981" />
  <text x="582" y="373" font-family="Arial, sans-serif" font-size="9" fill="#e7e5e4">Copperbelt — Active</text>
  <circle cx="572" cy="383" r="4" fill="#f59e0b" />
  <text x="582" y="387" font-family="Arial, sans-serif" font-size="9" fill="#e7e5e4">Muchinga — Processing</text>
  <circle cx="572" cy="397" r="4" fill="#3b82f6" />
  <text x="582" y="401" font-family="Arial, sans-serif" font-size="9" fill="#e7e5e4">N. Western — Reporting</text>

  <!-- Left side title text -->
  <text x="58" y="230" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#fde68a" opacity="0.95">Small Miners</text>
  <text x="58" y="254" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#fde68a" opacity="0.95">Digital Platform</text>
  <text x="58" y="280" font-family="Arial, sans-serif" font-size="11" fill="#d97706" opacity="0.85">Formalise · Track · Finance</text>
  <text x="58" y="296" font-family="Arial, sans-serif" font-size="11" fill="#d97706" opacity="0.85">Empower Local Miners</text>

  <!-- Decorative arc -->
  <path d="M 15 420 Q 200 340 370 285" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="6 4" />
  <path d="M 10 400 Q 190 328 360 275" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.15" stroke-dasharray="4 6" />

  <!-- Bottom label bar -->
  <rect x="0" y="418" width="800" height="32" fill="#1c0f02" opacity="0.95" />
  <text x="400" y="438" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b" font-weight="600" text-anchor="middle" letter-spacing="1">NEOSOFT TECH · SMALL MINERS PLATFORM · ZAMBIA MINING DIGITALISATION</text>
</svg>
