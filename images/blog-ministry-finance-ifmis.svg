<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2d5e"/>
      <stop offset="100%" stop-color="#1a4a8a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3f7a"/>
      <stop offset="100%" stop-color="#163268"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="75" x2="800" y2="75" stroke="white" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="white" stroke-width="1"/>
    <line x1="0" y1="225" x2="800" y2="225" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="375" x2="800" y2="375" stroke="white" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="450" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="450" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="white" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="450" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="white" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="450" stroke="white" stroke-width="1"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="720" cy="80" r="100" fill="white" fill-opacity="0.03"/>
  <circle cx="720" cy="80" r="65" fill="white" fill-opacity="0.04"/>
  <circle cx="80" cy="380" r="90" fill="white" fill-opacity="0.03"/>

  <!-- Left panel: Title block -->
  <rect x="40" y="40" width="340" height="160" rx="12" fill="white" fill-opacity="0.06"/>
  <rect x="40" y="40" width="4" height="160" rx="2" fill="url(#accentGrad)"/>

  <!-- Zambia coat of arms inspired shield icon -->
  <rect x="58" y="56" width="32" height="36" rx="4" fill="#f59e0b" opacity="0.9"/>
  <text x="74" y="80" text-anchor="middle" fill="#0f2d5e" font-size="18" font-weight="bold" font-family="serif">Z</text>

  <text x="102" y="72" fill="white" font-size="9" font-weight="600" font-family="sans-serif" letter-spacing="2" opacity="0.7">REPUBLIC OF ZAMBIA</text>
  <text x="102" y="86" fill="white" font-size="11" font-weight="700" font-family="sans-serif" opacity="0.9">Ministry of Finance</text>

  <text x="58" y="118" fill="white" font-size="20" font-weight="800" font-family="sans-serif" opacity="0.95">Integrated Financial</text>
  <text x="58" y="142" fill="white" font-size="20" font-weight="800" font-family="sans-serif" opacity="0.95">Management</text>
  <text x="58" y="166" fill="#fbbf24" font-size="20" font-weight="800" font-family="sans-serif">Information System</text>

  <!-- IFMIS badge -->
  <rect x="58" y="182" width="60" height="24" rx="12" fill="url(#accentGrad)"/>
  <text x="88" y="198" text-anchor="middle" fill="#0f2d5e" font-size="10" font-weight="800" font-family="sans-serif">IFMIS</text>

  <rect x="130" y="182" width="100" height="24" rx="12" fill="white" fill-opacity="0.1"/>
  <text x="180" y="198" text-anchor="middle" fill="white" font-size="10" font-weight="600" font-family="sans-serif" opacity="0.9">161 Services</text>

  <rect x="242" y="182" width="118" height="24" rx="12" fill="white" fill-opacity="0.1"/>
  <text x="301" y="198" text-anchor="middle" fill="white" font-size="10" font-weight="600" font-family="sans-serif" opacity="0.9">28 Gov. Entities</text>

  <!-- Central dashboard panel -->
  <rect x="40" y="220" width="720" height="200" rx="12" fill="white" fill-opacity="0.05" filter="url(#shadow)"/>

  <!-- Budget bar chart -->
  <text x="58" y="244" fill="white" font-size="9" font-weight="600" font-family="sans-serif" letter-spacing="1.5" opacity="0.6">BUDGET UTILISATION</text>
  <!-- bars -->
  <rect x="58" y="260" width="18" height="70" rx="3" fill="url(#blueGrad)" opacity="0.8"/>
  <rect x="82" y="275" width="18" height="55" rx="3" fill="url(#blueGrad)" opacity="0.6"/>
  <rect x="106" y="268" width="18" height="62" rx="3" fill="url(#blueGrad)" opacity="0.8"/>
  <rect x="130" y="255" width="18" height="75" rx="3" fill="url(#accentGrad)" opacity="0.9"/>
  <rect x="154" y="271" width="18" height="59" rx="3" fill="url(#blueGrad)" opacity="0.6"/>
  <rect x="178" y="263" width="18" height="67" rx="3" fill="url(#blueGrad)" opacity="0.7"/>
  <!-- baseline -->
  <line x1="58" y1="332" x2="200" y2="332" stroke="white" stroke-width="1" opacity="0.2"/>
  <text x="58" y="346" fill="white" font-size="8" font-family="sans-serif" opacity="0.5">Q1  Q2  Q3  Q4  Q5  Q6</text>

  <!-- Treasury flow diagram -->
  <text x="230" y="244" fill="white" font-size="9" font-weight="600" font-family="sans-serif" letter-spacing="1.5" opacity="0.6">TREASURY FLOW</text>
  <!-- TSA box -->
  <rect x="230" y="254" width="80" height="28" rx="6" fill="url(#blueGrad)" opacity="0.8"/>
  <text x="270" y="272" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">TSA</text>
  <!-- arrows -->
  <line x1="310" y1="268" x2="328" y2="268" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="326,264 334,268 326,272" fill="#60a5fa"/>
  <!-- Revenue box -->
  <rect x="334" y="254" width="80" height="28" rx="6" fill="url(#greenGrad)" opacity="0.8"/>
  <text x="374" y="272" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">Revenue</text>
  <!-- Payments -->
  <line x1="270" y1="282" x2="270" y2="298" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="266,296 270,304 274,296" fill="#60a5fa"/>
  <rect x="230" y="304" width="80" height="28" rx="6" fill="white" fill-opacity="0.12"/>
  <text x="270" y="322" text-anchor="middle" fill="white" font-size="9" font-weight="600" font-family="sans-serif" opacity="0.9">Payments</text>
  <line x1="374" y1="282" x2="374" y2="298" stroke="#34d399" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="370,296 374,304 378,296" fill="#34d399"/>
  <rect x="334" y="304" width="80" height="28" rx="6" fill="white" fill-opacity="0.12"/>
  <text x="374" y="322" text-anchor="middle" fill="white" font-size="9" font-weight="600" font-family="sans-serif" opacity="0.9">Grants</text>
  <text x="270" y="346" fill="white" font-size="8" font-family="sans-serif" opacity="0.5">Cash Management</text>

  <!-- Integration panel -->
  <text x="442" y="244" fill="white" font-size="9" font-weight="600" font-family="sans-serif" letter-spacing="1.5" opacity="0.6">INTEGRATIONS</text>
  <!-- ZRA -->
  <rect x="442" y="255" width="65" height="22" rx="5" fill="#f59e0b" opacity="0.85"/>
  <text x="474" y="270" text-anchor="middle" fill="#0f2d5e" font-size="9" font-weight="800" font-family="sans-serif">ZRA</text>
  <!-- NAPSA -->
  <rect x="515" y="255" width="65" height="22" rx="5" fill="#10b981" opacity="0.85"/>
  <text x="547" y="270" text-anchor="middle" fill="white" font-size="9" font-weight="800" font-family="sans-serif">NAPSA</text>
  <!-- Bank of Zambia -->
  <rect x="442" y="283" width="65" height="22" rx="5" fill="#3b82f6" opacity="0.85"/>
  <text x="474" y="298" text-anchor="middle" fill="white" font-size="8" font-weight="700" font-family="sans-serif">BOZ</text>
  <!-- EGP -->
  <rect x="515" y="283" width="65" height="22" rx="5" fill="white" fill-opacity="0.15"/>
  <text x="547" y="298" text-anchor="middle" fill="white" font-size="8" font-weight="600" font-family="sans-serif">e-GP</text>
  <!-- Customs -->
  <rect x="442" y="311" width="65" height="22" rx="5" fill="white" fill-opacity="0.15"/>
  <text x="474" y="326" text-anchor="middle" fill="white" font-size="8" font-weight="600" font-family="sans-serif">Customs</text>
  <!-- Statistical -->
  <rect x="515" y="311" width="65" height="22" rx="5" fill="white" fill-opacity="0.15"/>
  <text x="547" y="326" text-anchor="middle" fill="white" font-size="7" font-weight="600" font-family="sans-serif">Statistical</text>
  <text x="442" y="346" fill="white" font-size="8" font-family="sans-serif" opacity="0.5">6 System Integrations</text>

  <!-- Decision Engine / AI panel -->
  <text x="612" y="244" fill="white" font-size="9" font-weight="600" font-family="sans-serif" letter-spacing="1.5" opacity="0.6">DECISION ENGINE</text>
  <!-- Risk meter -->
  <circle cx="660" cy="295" r="36" stroke="white" stroke-width="1" fill="none" opacity="0.15"/>
  <circle cx="660" cy="295" r="36" stroke="url(#greenGrad)" stroke-width="3" fill="none" stroke-dasharray="113 226" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 660 295)" opacity="0.9"/>
  <circle cx="660" cy="295" r="36" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-dasharray="57 226" stroke-dashoffset="-113" stroke-linecap="round" transform="rotate(-90 660 295)" opacity="0.8"/>
  <text x="660" y="291" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">RISK</text>
  <text x="660" y="303" text-anchor="middle" fill="#34d399" font-size="10" font-weight="800" font-family="sans-serif">LOW</text>
  <!-- Labels -->
  <rect x="612" y="335" width="45" height="16" rx="4" fill="#10b981" opacity="0.7"/>
  <text x="634" y="347" text-anchor="middle" fill="white" font-size="7" font-weight="600" font-family="sans-serif">Compliant</text>
  <rect x="663" y="335" width="45" height="16" rx="4" fill="#f59e0b" opacity="0.7"/>
  <text x="685" y="347" text-anchor="middle" fill="white" font-size="7" font-weight="600" font-family="sans-serif">Alerts: 3</text>

  <!-- Bottom stats bar -->
  <rect x="40" y="430" width="720" height="2" rx="1" fill="white" fill-opacity="0.08"/>
  
  <!-- Stat pills at bottom -->
  <rect x="400" y="48" width="360" height="160" rx="12" fill="white" fill-opacity="0.05"/>
  <text x="420" y="72" fill="white" font-size="9" font-weight="600" font-family="sans-serif" letter-spacing="1.5" opacity="0.6">PLATFORM COVERAGE</text>
  
  <!-- Stat boxes in right panel -->
  <rect x="420" y="82" width="75" height="48" rx="8" fill="white" fill-opacity="0.08"/>
  <text x="457" y="105" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="800" font-family="sans-serif">161</text>
  <text x="457" y="120" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif" opacity="0.7">Services</text>
  
  <rect x="505" y="82" width="75" height="48" rx="8" fill="white" fill-opacity="0.08"/>
  <text x="542" y="105" text-anchor="middle" fill="#34d399" font-size="22" font-weight="800" font-family="sans-serif">28</text>
  <text x="542" y="120" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif" opacity="0.7">Gov. Entities</text>
  
  <rect x="590" y="82" width="75" height="48" rx="8" fill="white" fill-opacity="0.08"/>
  <text x="627" y="105" text-anchor="middle" fill="#60a5fa" font-size="22" font-weight="800" font-family="sans-serif">15</text>
  <text x="627" y="120" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif" opacity="0.7">Ministries</text>
  
  <rect x="675" y="82" width="65" height="48" rx="8" fill="white" fill-opacity="0.08"/>
  <text x="707" y="105" text-anchor="middle" fill="#f87171" font-size="22" font-weight="800" font-family="sans-serif">13</text>
  <text x="707" y="120" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif" opacity="0.7">Institutions</text>

  <!-- Module pills -->
  <text x="420" y="152" fill="white" font-size="9" font-weight="600" font-family="sans-serif" letter-spacing="1" opacity="0.6">MODULES:</text>
  <rect x="420" y="160" width="50" height="18" rx="9" fill="#1d4ed8" opacity="0.8"/>
  <text x="445" y="173" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">Budget</text>
  <rect x="476" y="160" width="58" height="18" rx="9" fill="#065f46" opacity="0.8"/>
  <text x="505" y="173" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">Treasury</text>
  <rect x="540" y="160" width="62" height="18" rx="9" fill="#7c2d12" opacity="0.8"/>
  <text x="571" y="173" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">Accounting</text>
  <rect x="608" y="160" width="56" height="18" rx="9" fill="#4c1d95" opacity="0.8"/>
  <text x="636" y="173" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">Revenue</text>
  <rect x="670" y="160" width="40" height="18" rx="9" fill="#1f2937" opacity="0.8" stroke="white" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="690" y="173" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">+11</text>
</svg>
