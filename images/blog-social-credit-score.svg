<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Deep navy gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1f3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a6b;stop-opacity:1" />
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3461;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3d74;stop-opacity:1" />
    </linearGradient>
    <!-- Green score gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <!-- Amber gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <!-- Red gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f87171;stop-opacity:1" />
    </linearGradient>
    <!-- Score arc gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Node glow -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#93c5fd" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="50" y1="0" x2="50" y2="450" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="650" y1="0" x2="650" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="750" y1="0" x2="750" y2="450" />
  </g>

  <!-- ── Network / AI nodes (left side) ── -->
  <g opacity="0.3" stroke="#93c5fd" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
    <line x1="75" y1="110" x2="155" y2="185" />
    <line x1="75" y1="110" x2="155" y2="80" />
    <line x1="155" y1="185" x2="240" y2="250" />
    <line x1="155" y1="80" x2="240" y2="140" />
    <line x1="155" y1="80" x2="240" y2="45" />
    <line x1="240" y1="140" x2="330" y2="190" />
    <line x1="240" y1="250" x2="330" y2="190" />
    <line x1="240" y1="45" x2="330" y2="95" />
    <line x1="330" y1="190" x2="330" y2="95" />
  </g>

  <!-- Nodes -->
  <g filter="url(#nodeGlow)">
    <circle cx="75" cy="110" r="10" fill="#3b82f6" opacity="0.9" />
    <circle cx="75" cy="110" r="5" fill="#93c5fd" />
    <circle cx="155" cy="80" r="8" fill="#6366f1" opacity="0.9" />
    <circle cx="155" cy="80" r="4" fill="#c4b5fd" />
    <circle cx="155" cy="185" r="9" fill="#3b82f6" opacity="0.9" />
    <circle cx="155" cy="185" r="4.5" fill="#93c5fd" />
    <circle cx="240" cy="45" r="7" fill="#10b981" opacity="0.9" />
    <circle cx="240" cy="45" r="3.5" fill="#6ee7b7" />
    <circle cx="240" cy="140" r="11" fill="#3b82f6" opacity="0.95" />
    <circle cx="240" cy="140" r="5.5" fill="#bfdbfe" />
    <circle cx="240" cy="250" r="8" fill="#6366f1" opacity="0.9" />
    <circle cx="240" cy="250" r="4" fill="#c4b5fd" />
    <circle cx="330" cy="95" r="9" fill="#10b981" opacity="0.9" />
    <circle cx="330" cy="95" r="4.5" fill="#6ee7b7" />
    <circle cx="330" cy="190" r="13" fill="#1d4ed8" opacity="0.95" />
    <circle cx="330" cy="190" r="6.5" fill="#93c5fd" />
  </g>

  <!-- Left side title text -->
  <text x="55" y="300" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" opacity="0.95">Social Credit</text>
  <text x="55" y="324" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" opacity="0.95">Score System</text>
  <text x="55" y="350" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" opacity="0.85">AI-Powered Accountability</text>
  <text x="55" y="366" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" opacity="0.85">&amp; Transparency Platform</text>

  <!-- Decorative arcs -->
  <path d="M 15 415 Q 195 335 365 285" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.2" stroke-dasharray="6 4" />
  <path d="M 10 398 Q 188 322 355 274" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.12" stroke-dasharray="4 6" />

  <!-- ── Main dashboard card (right) ── -->
  <rect x="365" y="25" width="405" height="400" rx="16" fill="url(#cardGrad)" opacity="0.92" />
  <rect x="365" y="25" width="405" height="400" rx="16" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.35" />

  <!-- Header bar -->
  <rect x="365" y="25" width="405" height="46" rx="16" fill="#1e3a8a" opacity="0.8" />
  <rect x="365" y="55" width="405" height="16" fill="#1e3a8a" opacity="0.8" />

  <!-- Window dots -->
  <circle cx="385" cy="42" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="401" cy="42" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="417" cy="42" r="5" fill="#10b981" opacity="0.8" />

  <!-- Header title -->
  <text x="432" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e0eaff" letter-spacing="0.5">SOCIAL CREDIT SCORE — ACCOUNTABILITY DASHBOARD</text>

  <!-- ── Score gauge (center-top of card) ── -->
  <!-- Gauge background arc -->
  <path d="M 490 175 A 70 70 0 0 1 630 175" stroke="#1e293b" stroke-width="14" fill="none" stroke-linecap="round" />
  <!-- Gauge colored arc (score = 82/100, roughly 80% of the arc) -->
  <path d="M 490 175 A 70 70 0 0 1 617 132" stroke="url(#arcGrad)" stroke-width="14" fill="none" stroke-linecap="round" />
  <!-- Gauge needle -->
  <line x1="560" y1="175" x2="612" y2="130" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <circle cx="560" cy="175" r="6" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2" />
  <!-- Score label -->
  <text x="560" y="168" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">82</text>
  <text x="560" y="185" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" letter-spacing="1">TRUST SCORE</text>
  <!-- Scale labels -->
  <text x="485" y="192" font-family="Arial, sans-serif" font-size="8.5" fill="#ef4444" text-anchor="middle">LOW</text>
  <text x="560" y="118" font-family="Arial, sans-serif" font-size="8.5" fill="#f59e0b" text-anchor="middle">MED</text>
  <text x="635" y="192" font-family="Arial, sans-serif" font-size="8.5" fill="#10b981" text-anchor="middle">HIGH</text>

  <!-- ── KPI Cards row ── -->
  <!-- Card: Honest Work -->
  <rect x="383" y="210" width="118" height="58" rx="8" fill="#064e3b" opacity="0.7" />
  <text x="398" y="229" font-family="Arial, sans-serif" font-size="8.5" fill="#6ee7b7" font-weight="600" letter-spacing="0.5">HONEST WORK</text>
  <text x="398" y="253" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">94%</text>
  <text x="398" y="265" font-family="Arial, sans-serif" font-size="8" fill="#34d399">▲ Rewarded &amp; Visible</text>

  <!-- Card: Compliance -->
  <rect x="513" y="210" width="118" height="58" rx="8" fill="#1e3a8a" opacity="0.7" />
  <text x="528" y="229" font-family="Arial, sans-serif" font-size="8.5" fill="#93c5fd" font-weight="600" letter-spacing="0.5">COMPLIANCE RATE</text>
  <text x="528" y="253" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">87%</text>
  <text x="528" y="265" font-family="Arial, sans-serif" font-size="8" fill="#60a5fa">▲ Real-Time Tracking</text>

  <!-- Card: Misconduct -->
  <rect x="643" y="210" width="118" height="58" rx="8" fill="#7c2d12" opacity="0.7" />
  <text x="658" y="229" font-family="Arial, sans-serif" font-size="8.5" fill="#fca5a5" font-weight="600" letter-spacing="0.5">MISCONDUCT</text>
  <text x="658" y="253" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="800">6%</text>
  <text x="658" y="265" font-family="Arial, sans-serif" font-size="8" fill="#fca5a5">⚠ Flagged Instantly</text>

  <!-- ── Accountability metrics panel ── -->
  <text x="383" y="294" font-family="Arial, sans-serif" font-size="9.5" fill="#93c5fd" font-weight="700" letter-spacing="0.5">ACCOUNTABILITY METRICS — REAL TIME</text>

  <!-- Metric bars -->
  <!-- Transparency -->
  <text x="383" y="314" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">Transparency</text>
  <rect x="460" y="306" width="180" height="8" rx="3" fill="#1e293b" />
  <rect x="460" y="306" width="162" height="8" rx="3" fill="url(#greenGrad)" />
  <text x="648" y="314" font-family="Arial, sans-serif" font-size="9" fill="#34d399">90%</text>

  <!-- Performance -->
  <text x="383" y="330" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">Performance</text>
  <rect x="460" y="322" width="180" height="8" rx="3" fill="#1e293b" />
  <rect x="460" y="322" width="144" height="8" rx="3" fill="url(#greenGrad)" />
  <text x="648" y="330" font-family="Arial, sans-serif" font-size="9" fill="#34d399">80%</text>

  <!-- Integrity -->
  <text x="383" y="346" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">Integrity</text>
  <rect x="460" y="338" width="180" height="8" rx="3" fill="#1e293b" />
  <rect x="460" y="338" width="135" height="8" rx="3" fill="url(#amberGrad)" />
  <text x="648" y="346" font-family="Arial, sans-serif" font-size="9" fill="#fbbf24">75%</text>

  <!-- Citizen Trust -->
  <text x="383" y="362" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">Citizen Trust</text>
  <rect x="460" y="354" width="180" height="8" rx="3" fill="#1e293b" />
  <rect x="460" y="354" width="153" height="8" rx="3" fill="url(#greenGrad)" />
  <text x="648" y="362" font-family="Arial, sans-serif" font-size="9" fill="#34d399">85%</text>

  <!-- ── Entity status list ── -->
  <rect x="383" y="376" width="370" height="36" rx="8" fill="#0f172a" opacity="0.75" />
  <text x="396" y="390" font-family="Arial, sans-serif" font-size="8.5" fill="#60a5fa" font-weight="700" letter-spacing="0.5">ENTITIES MONITORED</text>
  <!-- Entity dots -->
  <circle cx="396" cy="404" r="4" fill="#10b981" />
  <text x="405" y="408" font-family="Arial, sans-serif" font-size="8.5" fill="#e2e8f0">Individuals</text>
  <circle cx="475" cy="404" r="4" fill="#3b82f6" />
  <text x="484" y="408" font-family="Arial, sans-serif" font-size="8.5" fill="#e2e8f0">Institutions</text>
  <circle cx="558" cy="404" r="4" fill="#a78bfa" />
  <text x="567" y="408" font-family="Arial, sans-serif" font-size="8.5" fill="#e2e8f0">Service Delivery</text>
  <circle cx="660" cy="404" r="4" fill="#f59e0b" />
  <text x="669" y="408" font-family="Arial, sans-serif" font-size="8.5" fill="#e2e8f0">Contractors</text>

  <!-- Bottom label bar -->
  <rect x="0" y="418" width="800" height="32" fill="#091830" opacity="0.95" />
  <text x="400" y="438" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa" font-weight="600" text-anchor="middle" letter-spacing="1">NEOSOFT TECH · SOCIAL CREDIT SCORE · ACCOUNTABILITY &amp; TRANSPARENCY PLATFORM</text>
</svg>
