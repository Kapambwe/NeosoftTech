  <rect x="770" y="190" width="80" height="20" rx="2" fill="#4338ca" opacity="0.7" />
  <rect x="790" y="175" width="40" height="20" rx="2" fill="#6366f1" opacity="0.7" />
  <rect x="775" y="220" width="20" height="25" rx="2" fill="#a5b4fc" opacity="0.5" />
  <rect x="805" y="220" width="20" height="25" rx="2" fill="#a5b4fc" opacity="0.5" />
  <rect x="775" y="260" width="20" height="25" rx="2" fill="#a5b4fc" opacity="0.5" />
  <rect x="805" y="260" width="20" height="25" rx="2" fill="#a5b4fc" opacity="0.5" />
  <rect x="787" y="290" width="26" height="30" fill="#6366f1" opacity="0.7" />

