  <text x="440" y="255" font-size="28" font-weight="800" fill="#a5b4fc" text-anchor="middle">100%</text>
  <text x="440" y="278" font-size="11" fill="#c7d2fe" text-anchor="middle">CDF Act Compliant</text>

  <rect x="525" y="225" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" />
  <text x="595" y="255" font-size="28" font-weight="800" fill="#a5b4fc" text-anchor="middle">Act</text>
  <text x="595" y="275" font-size="18" font-weight="800" fill="#a5b4fc" text-anchor="middle">2024</text>
  <text x="595" y="292" font-size="11" fill="#c7d2fe" text-anchor="middle">CDF Act No. 1</text>

