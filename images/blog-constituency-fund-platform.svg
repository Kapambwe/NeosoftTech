  <text x="344" y="341" font-size="12" fill="#a5b4fc" text-anchor="middle">📋 Project Lifecycle</text>

  <rect x="444" y="320" width="175" height="32" rx="16" fill="#3730a3" />
  <text x="531" y="341" font-size="12" fill="#a5b4fc" text-anchor="middle">💰 Financial Control</text>

  <rect x="60" y="365" width="200" height="32" rx="16" fill="#3730a3" />
