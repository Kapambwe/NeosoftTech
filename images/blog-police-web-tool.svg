<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.04">
    <line x1="0" y1="62.5" x2="900" y2="62.5" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="125" x2="900" y2="125" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="187.5" x2="900" y2="187.5" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="900" y2="250" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="312.5" x2="900" y2="312.5" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="375" x2="900" y2="375" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="437.5" x2="900" y2="437.5" stroke="white" stroke-width="0.5"/>
    <line x1="112.5" y1="0" x2="112.5" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="225" y1="0" x2="225" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="337.5" y1="0" x2="337.5" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="562.5" y1="0" x2="562.5" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="675" y1="0" x2="675" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="787.5" y1="0" x2="787.5" y2="500" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Map background area (right side) -->
  <rect x="480" y="60" width="380" height="380" rx="12" fill="#1e293b" opacity="0.8" filter="url(#shadow)"/>
  <!-- Map green areas -->
  <rect x="500" y="80" width="340" height="340" rx="8" fill="#0d1f10" opacity="0.9"/>
  <!-- Map roads -->
  <line x1="500" y1="250" x2="840" y2="250" stroke="#334155" stroke-width="4"/>
  <line x1="670" y1="80" x2="670" y2="420" stroke="#334155" stroke-width="4"/>
  <line x1="500" y1="160" x2="840" y2="160" stroke="#1e293b" stroke-width="2"/>
  <line x1="500" y1="330" x2="840" y2="330" stroke="#1e293b" stroke-width="2"/>
  <line x1="580" y1="80" x2="580" y2="420" stroke="#1e293b" stroke-width="2"/>
  <line x1="760" y1="80" x2="760" y2="420" stroke="#1e293b" stroke-width="2"/>

  <!-- Crime Heatmap dots -->
  <circle cx="620" cy="220" r="30" fill="#dc2626" opacity="0.25"/>
  <circle cx="620" cy="220" r="18" fill="#dc2626" opacity="0.35"/>
  <circle cx="620" cy="220" r="8" fill="#dc2626" opacity="0.8"/>

  <circle cx="700" cy="280" r="22" fill="#f97316" opacity="0.25"/>
  <circle cx="700" cy="280" r="13" fill="#f97316" opacity="0.35"/>
  <circle cx="700" cy="280" r="6" fill="#f97316" opacity="0.8"/>

  <circle cx="560" cy="300" r="18" fill="#eab308" opacity="0.25"/>
  <circle cx="560" cy="300" r="10" fill="#eab308" opacity="0.35"/>
  <circle cx="560" cy="300" r="5" fill="#eab308" opacity="0.7"/>

  <circle cx="780" cy="190" r="14" fill="#eab308" opacity="0.25"/>
  <circle cx="780" cy="190" r="8" fill="#eab308" opacity="0.35"/>
  <circle cx="780" cy="190" r="4" fill="#eab308" opacity="0.7"/>

  <!-- Patrol route arrows -->
  <polyline points="530,360 580,320 630,340 680,290 730,310" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.9"/>
  <!-- Arrow head -->
  <polygon points="730,310 720,302 724,314" fill="#22c55e" opacity="0.9"/>

  <!-- Police car markers -->
  <circle cx="630" cy="340" r="8" fill="#22c55e" stroke="white" stroke-width="2"/>
  <circle cx="680" cy="290" r="6" fill="#22c55e" stroke="white" stroke-width="1.5"/>

  <!-- Investigation markers -->
  <circle cx="620" cy="220" r="10" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.9"/>
  <line x1="617" y1="217" x2="623" y2="223" stroke="#ef4444" stroke-width="2" opacity="0.9"/>
  <line x1="623" y1="217" x2="617" y2="223" stroke="#ef4444" stroke-width="2" opacity="0.9"/>

  <!-- Map label -->
  <text x="500" y="440" fill="white" font-size="10" opacity="0.5">© OpenStreetMap contributors</text>

  <!-- Left panel - title and stats -->
  <!-- Badge -->
  <rect x="40" y="60" width="180" height="26" rx="13" fill="#1e3a8a" opacity="0.8"/>
  <text x="130" y="77" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">LAW ENFORCEMENT TECH</text>

  <!-- Main Title -->
  <text x="40" y="130" fill="white" font-size="32" font-weight="700" letter-spacing="-0.5">Police Web Tool</text>
  <text x="40" y="165" fill="#93c5fd" font-size="18" font-weight="600">Digital Crime Fighting Platform</text>
  <text x="40" y="195" fill="#94a3b8" font-size="13">Predictive Analytics · Real-Time Dispatch</text>
  <text x="40" y="213" fill="#94a3b8" font-size="13">Investigation Maps · Digital Evidence</text>

  <!-- Divider -->
  <line x1="40" y1="232" x2="420" y2="232" stroke="#334155" stroke-width="1"/>

  <!-- Stats row -->
  <!-- Stat 1 -->
  <rect x="40" y="248" width="88" height="68" rx="8" fill="#1e293b" opacity="0.9"/>
  <text x="84" y="273" fill="#dc2626" font-size="22" font-weight="700" text-anchor="middle">16</text>
  <text x="84" y="291" fill="#94a3b8" font-size="10" text-anchor="middle">Modules</text>
  <text x="84" y="306" fill="#64748b" font-size="9" text-anchor="middle">core features</text>

  <!-- Stat 2 -->
  <rect x="140" y="248" width="88" height="68" rx="8" fill="#1e293b" opacity="0.9"/>
  <text x="184" y="273" fill="#22c55e" font-size="22" font-weight="700" text-anchor="middle">AI</text>
  <text x="184" y="291" fill="#94a3b8" font-size="10" text-anchor="middle">Predictive</text>
  <text x="184" y="306" fill="#64748b" font-size="9" text-anchor="middle">analytics</text>

  <!-- Stat 3 -->
  <rect x="240" y="248" width="88" height="68" rx="8" fill="#1e293b" opacity="0.9"/>
  <text x="284" y="273" fill="#f59e0b" font-size="22" font-weight="700" text-anchor="middle">5+</text>
  <text x="284" y="291" fill="#94a3b8" font-size="10" text-anchor="middle">Stations</text>
  <text x="284" y="306" fill="#64748b" font-size="9" text-anchor="middle">Lusaka</text>

  <!-- Stat 4 -->
  <rect x="340" y="248" width="88" height="68" rx="8" fill="#1e293b" opacity="0.9"/>
  <text x="384" y="273" fill="#2563eb" font-size="22" font-weight="700" text-anchor="middle">GIS</text>
  <text x="384" y="291" fill="#94a3b8" font-size="10" text-anchor="middle">Mapping</text>
  <text x="384" y="306" fill="#64748b" font-size="9" text-anchor="middle">heatmaps</text>

  <!-- Module tags -->
  <!-- Row 1 -->
  <rect x="40" y="334" width="96" height="22" rx="4" fill="#1e3a8a" opacity="0.7"/>
  <text x="88" y="349" fill="#93c5fd" font-size="10" text-anchor="middle">Crime Incidents</text>
  <rect x="146" y="334" width="78" height="22" rx="4" fill="#7f1d1d" opacity="0.7"/>
  <text x="185" y="349" fill="#fca5a5" font-size="10" text-anchor="middle">ALPR System</text>
  <rect x="234" y="334" width="90" height="22" rx="4" fill="#14532d" opacity="0.7"/>
  <text x="279" y="349" fill="#86efac" font-size="10" text-anchor="middle">CAD Dispatch</text>
  <rect x="334" y="334" width="88" height="22" rx="4" fill="#78350f" opacity="0.7"/>
  <text x="378" y="349" fill="#fde68a" font-size="10" text-anchor="middle">Link Analysis</text>

  <!-- Row 2 -->
  <rect x="40" y="366" width="100" height="22" rx="4" fill="#4c1d95" opacity="0.7"/>
  <text x="90" y="381" fill="#c4b5fd" font-size="10" text-anchor="middle">Digital Evidence</text>
  <rect x="150" y="366" width="90" height="22" rx="4" fill="#1e3a8a" opacity="0.7"/>
  <text x="195" y="381" fill="#93c5fd" font-size="10" text-anchor="middle">Body Cameras</text>
  <rect x="250" y="366" width="96" height="22" rx="4" fill="#14532d" opacity="0.7"/>
  <text x="298" y="381" fill="#86efac" font-size="10" text-anchor="middle">Cybercrime</text>
  <rect x="356" y="366" width="66" height="22" rx="4" fill="#7f1d1d" opacity="0.7"/>
  <text x="389" y="381" fill="#fca5a5" font-size="10" text-anchor="middle">Biometrics</text>

  <!-- Tagline -->
  <text x="40" y="430" fill="#475569" font-size="11">NeoSoft · Zambia Police Service · Crime Fighting Technology</text>
  <text x="40" y="448" fill="#3b82f6" font-size="11" opacity="0.8">kapambwe.github.io/PoliceWebTool</text>

  <!-- Shield icon (simplified) -->
  <path d="M 430 70 L 456 80 L 456 102 Q 456 118 443 126 Q 430 134 430 134 Q 417 126 417 110 L 417 80 Z" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.6"/>
  <text x="443" y="107" fill="#2563eb" font-size="16" text-anchor="middle" opacity="0.8">★</text>
</svg>
