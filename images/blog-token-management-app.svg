  <text x="48" y="122" font-size="34" font-weight="800" fill="white">Token</text>
  <text x="48" y="158" font-size="34" font-weight="800" fill="#a78bfa">Management</text>
  <text x="48" y="190" font-size="24" font-weight="700" fill="#d8b4fe">App</text>
  <text x="48" y="216" font-size="12.5" fill="#e9d5ff">OAuth 2.0 · JWT · W3C DID</text>
  <text x="48" y="234" font-size="12.5" fill="#e9d5ff">API Keys · Token Rotation</text>

  <!-- Stat cards -->
  <rect x="48" y="254" width="106" height="68" rx="10" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1"/>
  <text x="101" y="278" font-size="19" font-weight="800" fill="#a78bfa" text-anchor="middle">OAuth</text>
  <text x="101" y="296" font-size="9.5" fill="#e9d5ff" text-anchor="middle">2.0 Standard</text>
  <text x="101" y="310" font-size="9.5" fill="#e9d5ff" text-anchor="middle">Auth</text>

  <rect x="164" y="254" width="106" height="68" rx="10" fill="url(#cardGrad)" stroke="#9333ea" stroke-width="1"/>
  <text x="217" y="278" font-size="19" font-weight="800" fill="#d8b4fe" text-anchor="middle">W3C</text>
  <text x="217" y="296" font-size="9.5" fill="#e9d5ff" text-anchor="middle">DID Identity</text>
  <text x="217" y="310" font-size="9.5" fill="#e9d5ff" text-anchor="middle">Standard</text>

  <rect x="280" y="254" width="106" height="68" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1"/>
  <text x="333" y="278" font-size="18" font-weight="800" fill="#67e8f9" text-anchor="middle">100%</text>
  <text x="333" y="296" font-size="9.5" fill="#e9d5ff" text-anchor="middle">API Access</text>
