  <!-- Bar chart -->
  <rect x="492" y="296" width="48" height="80" rx="4" fill="#4c1d95"/>
  <rect x="492" y="316" width="48" height="60" rx="4" fill="url(#violetGrad)"/>
  <text x="516" y="389" font-size="8.5" fill="#c4b5fd" text-anchor="middle">payroll</text>

  <rect x="550" y="296" width="48" height="80" rx="4" fill="#4c1d95"/>
  <rect x="550" y="341" width="48" height="35" rx="4" fill="url(#violetGrad)"/>
  <text x="574" y="389" font-size="8.5" fill="#c4b5fd" text-anchor="middle">audit</text>

  <rect x="608" y="296" width="48" height="80" rx="4" fill="#4c1d95"/>
  <rect x="608" y="296" width="48" height="80" rx="4" fill="url(#violetGrad)"/>
  <text x="632" y="389" font-size="8.5" fill="#c4b5fd" text-anchor="middle">data-sync</text>

  <rect x="666" y="296" width="48" height="80" rx="4" fill="#4c1d95"/>
  <rect x="666" y="351" width="48" height="25" rx="4" fill="url(#violetGrad)"/>
  <text x="690" y="389" font-size="8.5" fill="#c4b5fd" text-anchor="middle">reports</text>

  <!-- Anomaly alert -->
  <rect x="480" y="400" width="374" height="52" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="502" y="421" font-size="11" font-weight="700" fill="#fca5a5">⚠ ANOMALY DETECTED: legacy-report-key</text>
  <text x="502" y="437" font-size="10" fill="#fda4af">Revoked token attempted 47 API calls from IP 196.8.12.x</text>
  <text x="502" y="451" font-size="10" fill="#fda4af">Access blocked · Security team notified · Incident #INS-20260319-04</text>
</svg>
