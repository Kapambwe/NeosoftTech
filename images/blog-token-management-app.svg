  <text x="492" y="204" font-size="10" fill="#e9d5ff">did:neosoft:svc:data-sync</text>
  <text x="630" y="204" font-size="10" fill="#d8b4fe">W3C DID</text>
  <text x="710" y="204" font-size="10" fill="#a78bfa">Never</text>
  <rect x="790" y="190" width="56" height="18" rx="9" fill="#064e3b"/>
  <text x="818" y="203" font-size="9" fill="#34d399" text-anchor="middle">● Active</text>

  <!-- Row 4 -->
  <rect x="480" y="218" width="374" height="36" rx="0" fill="#1e0050" opacity="0.7"/>
  <text x="492" y="240" font-size="10" fill="#94a3b8">legacy-report-key</text>
  <text x="630" y="240" font-size="10" fill="#94a3b8">API Key</text>
  <text x="710" y="240" font-size="10" fill="#ef4444">Expired</text>
  <rect x="790" y="226" width="56" height="18" rx="9" fill="#450a0a"/>
