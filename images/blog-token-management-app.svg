  <text x="112" y="356" font-size="10.5" fill="#c4b5fd" text-anchor="middle">🔑 API Key Manager</text>

  <rect x="188" y="338" width="145" height="26" rx="13" fill="#4c1d95"/>
  <text x="260" y="356" font-size="10.5" fill="#a78bfa" text-anchor="middle">⚡ JWT Token Lifecycle</text>

  <rect x="48" y="374" width="148" height="26" rx="13" fill="#4c1d95"/>
  <text x="122" y="392" font-size="10.5" fill="#d8b4fe" text-anchor="middle">🔄 Auto Token Rotation</text>

  <rect x="208" y="374" width="125" height="26" rx="13" fill="#4c1d95"/>
  <text x="270" y="392" font-size="10.5" fill="#67e8f9" text-anchor="middle">📊 Usage Analytics</text>

