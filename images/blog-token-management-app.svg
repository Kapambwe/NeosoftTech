<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e1065;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b0764;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e1065;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d8b4fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <circle cx="780" cy="80" r="220" fill="#7c3aed" opacity="0.08"/>
  <circle cx="80" cy="450" r="170" fill="#9333ea" opacity="0.08"/>

  <!-- Grid -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="900" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="225" y1="0" x2="225" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="675" y1="0" x2="675" y2="500" stroke="white" stroke-width="0.5"/>
