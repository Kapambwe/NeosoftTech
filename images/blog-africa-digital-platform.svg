<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#022c22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c4a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#022c22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <circle cx="820" cy="90" r="220" fill="#059669" opacity="0.08"/>
  <circle cx="80" cy="440" r="180" fill="#0d9488" opacity="0.07"/>

  <!-- Grid -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="900" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="225" y1="0" x2="225" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="675" y1="0" x2="675" y2="500" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- LEFT PANEL -->
  <text x="48" y="76" font-size="10.5" font-weight="700" fill="#6ee7b7" letter-spacing="2.5">AFRICA GOVERNMENT DIGITAL PLATFORM</text>
  <text x="48" y="122" font-size="33" font-weight="800" fill="white">Africa&apos;s Most</text>
  <text x="48" y="158" font-size="33" font-weight="800" fill="#34d399">Comprehensive</text>
  <text x="48" y="190" font-size="22" font-weight="700" fill="#a7f3d0">Gov Digital Platform</text>
  <text x="48" y="216" font-size="12.5" fill="#6ee7b7">22 Production-Ready Applications</text>
  <text x="48" y="234" font-size="12.5" fill="#6ee7b7">One Unified Digital Operating System</text>

  <!-- Stat cards -->
  <rect x="48" y="254" width="100" height="68" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1"/>
  <text x="98" y="279" font-size="24" font-weight="800" fill="#34d399" text-anchor="middle">22</text>
  <text x="98" y="296" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Production</text>
  <text x="98" y="310" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Apps</text>

  <rect x="160" y="254" width="100" height="68" rx="10" fill="url(#cardGrad)" stroke="#0d9488" stroke-width="1"/>
  <text x="210" y="279" font-size="24" font-weight="800" fill="#2dd4bf" text-anchor="middle">100+</text>
  <text x="210" y="296" font-size="9.5" fill="#a7f3d0" text-anchor="middle">AI-Powered</text>
  <text x="210" y="310" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Tools</text>

  <rect x="272" y="254" width="100" height="68" rx="10" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1"/>
  <text x="322" y="279" font-size="24" font-weight="800" fill="#fbbf24" text-anchor="middle">54M+</text>
  <text x="322" y="296" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Citizens</text>
  <text x="322" y="310" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Served</text>

  <!-- Platform domain chips -->
  <rect x="48" y="338" width="136" height="26" rx="13" fill="#064e3b"/>
  <text x="116" y="356" font-size="10.5" fill="#34d399" text-anchor="middle">🌿 Natural Resources</text>

  <rect x="195" y="338" width="115" height="26" rx="13" fill="#064e3b"/>
  <text x="252" y="356" font-size="10.5" fill="#34d399" text-anchor="middle">🌾 Agriculture</text>

  <rect x="48" y="374" width="115" height="26" rx="13" fill="#064e3b"/>
  <text x="105" y="392" font-size="10.5" fill="#2dd4bf" text-anchor="middle">🏥 Healthcare</text>

  <rect x="174" y="374" width="136" height="26" rx="13" fill="#064e3b"/>
  <text x="242" y="392" font-size="10.5" fill="#2dd4bf" text-anchor="middle">🏛 Governance</text>

  <rect x="48" y="410" width="120" height="26" rx="13" fill="#064e3b"/>
  <text x="108" y="428" font-size="10.5" fill="#6ee7b7" text-anchor="middle">💳 Finance</text>

  <rect x="179" y="410" width="131" height="26" rx="13" fill="#064e3b"/>
  <text x="244" y="428" font-size="10.5" fill="#6ee7b7" text-anchor="middle">🔍 Intelligence</text>

  <text x="48" y="475" font-size="11.5" fill="#6ee7b7" opacity="0.85">Blazor WebAssembly · .NET 10 · AI Backbone</text>
  <text x="48" y="494" font-size="11" fill="#a7f3d0" opacity="0.6">NeoSoft Technologies · Zambia · Africa</text>

  <!-- RIGHT PANEL: Dashboard overview -->
  <rect x="462" y="36" width="410" height="428" rx="14" fill="#022c22" opacity="0.9" filter="url(#shadow)"/>
  <text x="667" y="66" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">PLATFORM COVERAGE MAP</text>

  <!-- Part sections -->
  <rect x="480" y="78" width="374" height="42" rx="7" fill="url(#emeraldGrad)" opacity="0.9"/>
  <text x="500" y="96" font-size="11" font-weight="700" fill="white">🌿 Part I &amp; II — Natural Resources + Agriculture</text>
  <text x="500" y="111" font-size="10" fill="rgba(255,255,255,0.85)">Forest · Gold Mining · Farm Blocks · Ministry Agric · Livestock</text>

  <rect x="480" y="128" width="374" height="42" rx="7" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="500" y="146" font-size="11" font-weight="700" fill="#34d399">🏥 Part III — National Health Ecosystem</text>
  <text x="500" y="161" font-size="10" fill="#6ee7b7">Clinical · PatientPortal · Drug Management · Hospital Admin</text>

  <rect x="480" y="178" width="374" height="42" rx="7" fill="#064e3b" stroke="#0d9488" stroke-width="1"/>
  <text x="500" y="196" font-size="11" font-weight="700" fill="#2dd4bf">🏛 Part IV — Governance &amp; Accountability</text>
  <text x="500" y="211" font-size="10" fill="#6ee7b7">Audit · Chiefdom · CDF · Council · Infrastructure · Construction</text>

  <rect x="480" y="228" width="374" height="42" rx="7" fill="#064e3b" stroke="#0891b2" stroke-width="1"/>
  <text x="500" y="246" font-size="11" font-weight="700" fill="#7dd3fc">🏙 Part V — Citizens, Logistics &amp; Utilities</text>
  <text x="500" y="261" font-size="10" fill="#6ee7b7">CitizensApp · Fleet Management · Electricity · Water</text>

  <rect x="480" y="278" width="374" height="42" rx="7" fill="#064e3b" stroke="#7c3aed" stroke-width="1"/>
  <text x="500" y="296" font-size="11" font-weight="700" fill="#c4b5fd">💳 Part VI — Financial Infrastructure Layer</text>
  <text x="500" y="311" font-size="10" fill="#6ee7b7">Payments · BaaS · Agent Banking · Accounting · Investment</text>

  <rect x="480" y="328" width="374" height="42" rx="7" fill="#064e3b" stroke="#6366f1" stroke-width="1"/>
  <text x="500" y="346" font-size="11" font-weight="700" fill="#a5b4fc">🔍 Part VII — Intelligence Layer</text>
  <text x="500" y="361" font-size="10" fill="#6ee7b7">Entity Resolution · Network Analysis · AML/CFT · 17 Apps</text>

  <!-- Stats bar -->
  <rect x="480" y="382" width="374" height="68" rx="8" fill="#011c14" stroke="#059669" stroke-width="1"/>
  <text x="667" y="402" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">PLATFORM IN NUMBERS</text>

  <!-- Metric bubbles -->
  <rect x="492" y="410" width="80" height="30" rx="6" fill="#064e3b"/>
  <text x="532" y="429" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">22 Apps</text>

  <rect x="582" y="410" width="88" height="30" rx="6" fill="#064e3b"/>
  <text x="626" y="429" font-size="11" font-weight="700" fill="#2dd4bf" text-anchor="middle">100+ AI Tools</text>

  <rect x="680" y="410" width="80" height="30" rx="6" fill="#064e3b"/>
  <text x="720" y="429" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">19 Countries</text>

  <rect x="770" y="410" width="74" height="30" rx="6" fill="#064e3b"/>
  <text x="807" y="429" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">SDG Ready</text>
</svg>
