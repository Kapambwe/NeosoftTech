    <line x1="400" y1="225" x2="400" y2="88" />
    <line x1="400" y1="225" x2="530" y2="110" />
    <line x1="400" y1="225" x2="550" y2="225" />
    <line x1="400" y1="225" x2="530" y2="335" />
    <line x1="400" y1="225" x2="270" y2="335" />
    <line x1="400" y1="225" x2="252" y2="225" />
  </g>

