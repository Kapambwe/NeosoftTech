  <rect x="228" y="308" width="82" height="54" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" />
  <rect x="228" y="308" width="82" height="54" rx="10" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6" />
