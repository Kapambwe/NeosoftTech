  <circle cx="400" cy="225" r="52" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.7" />
  <!-- NeoSoft logo text -->
  <text x="400" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">NeoSoft</text>
  <text x="400" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#93c5fd">Digital Platform</text>
