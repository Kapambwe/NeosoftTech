  <rect x="140" y="100" width="90" height="52" rx="10" fill="#0f2a5e" filter="url(#shadow)" />
  <rect x="140" y="100" width="90" height="52" rx="10" fill="none" stroke="#1fb877" stroke-width="1.2" opacity="0.7" />
  <text x="152" y="118" font-family="Arial, sans-serif" font-size="15" fill="#fbbf24">📣</text>
  <text x="185" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#6ee7b7">Influencers</text>
  <text x="185" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#86efac">Promote &amp; Refer</text>
