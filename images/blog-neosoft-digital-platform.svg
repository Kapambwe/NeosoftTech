  <rect x="571" y="295" width="92" height="52" rx="10" fill="none" stroke="#1fb877" stroke-width="1.2" opacity="0.7" />
  <text x="583" y="313" font-family="Arial, sans-serif" font-size="15" fill="#fbbf24">💰</text>
