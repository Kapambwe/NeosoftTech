    <line x1="400" y1="225" x2="215" y2="130" />
    <line x1="400" y1="225" x2="215" y2="320" />
    <line x1="400" y1="225" x2="585" y2="130" />
    <line x1="400" y1="225" x2="585" y2="320" />
