  <text x="185" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.5" fill="#4ade80">Deploy Solutions</text>

  <!-- Strategic Partners (outer top-right) -->
  <rect x="571" y="100" width="92" height="52" rx="10" fill="#0f2a5e" filter="url(#shadow)" />
  <rect x="571" y="100" width="92" height="52" rx="10" fill="none" stroke="#1fb877" stroke-width="1.2" opacity="0.7" />
  <text x="583" y="118" font-family="Arial, sans-serif" font-size="15" fill="#60a5fa">🔗</text>
  <text x="617" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#6ee7b7">Strategic</text>
  <text x="617" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#6ee7b7">Partners</text>
