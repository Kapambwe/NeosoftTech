  <circle cx="400" cy="225" r="185" fill="none" stroke="#1fb877" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.18" />

  <!-- ── Spoke connectors (center to SaaS nodes) ── -->
  <g stroke="#3b82f6" stroke-width="1.2" opacity="0.4">
