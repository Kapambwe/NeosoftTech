<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0c1a2e;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)" />

  <!-- Decorative road lines -->
  <line x1="0" y1="430" x2="900" y2="430" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="20,10" opacity="0.3" />
  <line x1="0" y1="450" x2="900" y2="450" stroke="#1d4ed8" stroke-width="1" opacity="0.2" />
  <circle cx="820" cy="100" r="200" fill="#1d4ed8" opacity="0.1" />

  <!-- Title area -->
  <text x="60" y="80" font-size="13" font-weight="600" fill="#93c5fd" letter-spacing="3">LOGISTICS &amp; FLEET MANAGEMENT PLATFORM</text>
  <text x="60" y="130" font-size="34" font-weight="800" fill="white">LogisticsWebApp</text>
  <text x="60" y="165" font-size="20" font-weight="400" fill="#bfdbfe">Moving Zambia&apos;s Economy:</text>
  <text x="60" y="193" font-size="20" font-weight="400" fill="#bfdbfe">Agriculture, Mining, Construction &amp; Government</text>

  <!-- Stats row -->
  <rect x="60" y="225" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" />
  <text x="130" y="255" font-size="28" font-weight="800" fill="#93c5fd" text-anchor="middle">23</text>
  <text x="130" y="278" font-size="11" fill="#bfdbfe" text-anchor="middle">Razor Pages</text>

  <rect x="215" y="225" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" />
  <text x="285" y="255" font-size="28" font-weight="800" fill="#93c5fd" text-anchor="middle">34+</text>
  <text x="285" y="278" font-size="11" fill="#bfdbfe" text-anchor="middle">Nav Routes</text>

  <rect x="370" y="225" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" />
  <text x="440" y="255" font-size="28" font-weight="800" fill="#93c5fd" text-anchor="middle">4</text>
  <text x="440" y="278" font-size="11" fill="#bfdbfe" text-anchor="middle">Key Sectors</text>

  <rect x="525" y="225" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" />
  <text x="595" y="255" font-size="24" font-weight="800" fill="#93c5fd" text-anchor="middle">GPS</text>
  <text x="595" y="278" font-size="11" fill="#bfdbfe" text-anchor="middle">Real-Time Tracking</text>

  <!-- Feature tags -->
  <rect x="60" y="320" width="175" height="32" rx="16" fill="#1e3a5f" />
  <text x="147" y="341" font-size="12" fill="#93c5fd" text-anchor="middle">🚛 Fleet Management</text>

  <rect x="247" y="320" width="175" height="32" rx="16" fill="#1e3a5f" />
  <text x="334" y="341" font-size="12" fill="#93c5fd" text-anchor="middle">👤 Driver Management</text>

  <rect x="434" y="320" width="175" height="32" rx="16" fill="#1e3a5f" />
  <text x="521" y="341" font-size="12" fill="#93c5fd" text-anchor="middle">📦 Load Tracking</text>

  <rect x="60" y="365" width="195" height="32" rx="16" fill="#1e3a5f" />
  <text x="157" y="386" font-size="12" fill="#93c5fd" text-anchor="middle">🗺️ Route Planning</text>

  <rect x="267" y="365" width="195" height="32" rx="16" fill="#1e3a5f" />
  <text x="364" y="386" font-size="12" fill="#93c5fd" text-anchor="middle">📊 Commercial Module</text>

  <!-- Right panel - truck icon (simple) -->
  <rect x="720" y="270" width="140" height="70" rx="8" fill="#1d4ed8" opacity="0.4" />
  <rect x="820" y="260" width="50" height="80" rx="6" fill="#2563eb" opacity="0.5" />
  <circle cx="745" cy="345" r="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="3" />
  <circle cx="745" cy="345" r="8" fill="#60a5fa" opacity="0.7" />
  <circle cx="845" cy="345" r="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="3" />
  <circle cx="845" cy="345" r="8" fill="#60a5fa" opacity="0.7" />

  <!-- URL at bottom -->
  <text x="60" y="460" font-size="13" fill="#93c5fd" opacity="0.8">kapambwe.github.io/LogisticsWebApp</text>
  <text x="60" y="485" font-size="12" fill="#bfdbfe" opacity="0.6">NeoSoft Technologies · Zambia Digital Ecosystem</text>
</svg>
