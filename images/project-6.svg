  <text x="32" y="236" font-family="Arial, sans-serif" font-size="7" fill="#7dd3fc" font-weight="700" letter-spacing="0.5">DATA MIGRATED</text>
  <text x="32" y="258" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="900">28TB</text>
