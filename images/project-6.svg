  <circle cx="20" cy="22" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="34" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="48" cy="22" r="5" fill="#10b981" opacity="0.8" />
  <text x="300" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="1">CLOUDMIGRATE SUITE — INFRASTRUCTURE MIGRATION</text>

  <!-- ═══ MIGRATION FLOW DIAGRAM ═══ -->

  <!-- LEFT: On-Premise Infrastructure -->
  <text x="85" y="68" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" font-weight="700" text-anchor="middle" letter-spacing="0.8">ON-PREMISE</text>
  <!-- Server rack group -->
  <g transform="translate(30, 75)">
    <!-- Server 1 -->
    <rect x="10" y="0" width="90" height="18" rx="3" fill="url(#serverGrad)" stroke="#1e3a5f" stroke-width="1" />
    <rect x="14" y="4" width="6" height="10" rx="1" fill="#0ea5e9" opacity="0.6" />
    <rect x="22" y="4" width="6" height="10" rx="1" fill="#0ea5e9" opacity="0.4" />
    <rect x="72" y="6" width="8" height="6" rx="1" fill="#0f172a" />
    <circle cx="88" cy="9" r="3" fill="#f59e0b" />
    <text x="36" y="13" font-family="monospace" font-size="6" fill="#64748b">WEB-01</text>

    <!-- Server 2 -->
    <rect x="10" y="22" width="90" height="18" rx="3" fill="url(#serverGrad)" stroke="#1e3a5f" stroke-width="1" />
    <rect x="14" y="26" width="6" height="10" rx="1" fill="#0ea5e9" opacity="0.6" />
    <rect x="22" y="26" width="6" height="10" rx="1" fill="#0ea5e9" opacity="0.4" />
    <rect x="72" y="28" width="8" height="6" rx="1" fill="#0f172a" />
    <circle cx="88" cy="31" r="3" fill="#10b981" />
    <text x="36" y="35" font-family="monospace" font-size="6" fill="#64748b">DB-01</text>

    <!-- Server 3 -->
    <rect x="10" y="44" width="90" height="18" rx="3" fill="url(#serverGrad)" stroke="#1e3a5f" stroke-width="1" />
    <rect x="14" y="48" width="6" height="10" rx="1" fill="#0ea5e9" opacity="0.6" />
    <rect x="22" y="48" width="6" height="10" rx="1" fill="#0ea5e9" opacity="0.2" />
    <rect x="72" y="50" width="8" height="6" rx="1" fill="#0f172a" />
    <circle cx="88" cy="53" r="3" fill="#ef4444" />
    <text x="36" y="57" font-family="monospace" font-size="6" fill="#64748b">APP-02</text>

    <!-- Server 4 -->
    <rect x="10" y="66" width="90" height="18" rx="3" fill="url(#serverGrad)" stroke="#1e3a5f" stroke-width="1" />
    <rect x="14" y="70" width="6" height="10" rx="1" fill="#0ea5e9" opacity="0.3" />
    <rect x="22" y="70" width="6" height="10" rx="1" fill="#0ea5e9" opacity="0.5" />
    <rect x="72" y="72" width="8" height="6" rx="1" fill="#0f172a" />
    <circle cx="88" cy="75" r="3" fill="#10b981" />
    <text x="36" y="79" font-family="monospace" font-size="6" fill="#64748b">STOR-01</text>

