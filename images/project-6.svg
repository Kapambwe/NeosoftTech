  <rect x="160" y="220" width="128" height="52" rx="6" fill="#082032" opacity="0.9" stroke="#10b981" stroke-width="0.8" />
  <text x="172" y="236" font-family="Arial, sans-serif" font-size="7" fill="#6ee7b7" font-weight="700" letter-spacing="0.5">DOWNTIME</text>
  <text x="172" y="258" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="900">0 min</text>
  <text x="172" y="268" font-family="Arial, sans-serif" font-size="7" fill="#34d399">zero-downtime migration</text>

  <rect x="300" y="220" width="128" height="52" rx="6" fill="#082032" opacity="0.9" stroke="#f59e0b" stroke-width="0.8" />
  <text x="312" y="236" font-family="Arial, sans-serif" font-size="7" fill="#fbbf24" font-weight="700" letter-spacing="0.5">COST SAVING</text>
  <text x="312" y="258" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="900">-42%</text>
  <text x="312" y="268" font-family="Arial, sans-serif" font-size="7" fill="#fbbf24">vs on-premise ops</text>

  <rect x="440" y="220" width="140" height="52" rx="6" fill="#082032" opacity="0.9" stroke="#a78bfa" stroke-width="0.8" />
  <text x="452" y="236" font-family="Arial, sans-serif" font-size="7" fill="#c4b5fd" font-weight="700" letter-spacing="0.5">SERVICES LIVE</text>
