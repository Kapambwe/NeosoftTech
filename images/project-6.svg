  <!-- Migration arrows (animated look with gradient) -->
  <!-- Main migration arrow -->
  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0ea5e9" />
