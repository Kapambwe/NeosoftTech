<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1f5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a8f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a96;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.4" />
    </linearGradient>
    <radialGradient id="hubGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000033" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="90" x2="800" y2="90" stroke="white" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="white" stroke-width="1"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="white" stroke-width="1"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="white" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="450" stroke="white" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="450" stroke="white" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="450" stroke="white" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="450" stroke="white" stroke-width="1"/>
  </g>

  <!-- Left panel — map placeholder -->
  <rect x="30" y="60" width="310" height="330" rx="14" fill="url(#mapGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#shadow)" />
  <!-- Map shape (abstract Zambia outline) -->
  <polygon points="80,90 160,75 230,85 280,100 310,130 320,170 300,210 270,240 240,260 200,270 160,265 120,255 90,230 70,200 65,165 70,130" fill="none" stroke="rgba(96,165,250,0.5)" stroke-width="2" transform="translate(10,50)" />
  <!-- Constituency pins -->
  <circle cx="140" cy="165" r="6" fill="url(#greenGrad)" opacity="0.9" filter="url(#glow)" />
  <circle cx="185" cy="148" r="5" fill="url(#amberGrad)" opacity="0.9" />
  <circle cx="220" cy="190" r="7" fill="url(#greenGrad)" opacity="0.9" filter="url(#glow)" />
  <circle cx="165" cy="220" r="5" fill="url(#tealGrad)" opacity="0.9" />
  <circle cx="240" cy="235" r="6" fill="url(#purpleGrad)" opacity="0.9" />
  <circle cx="130" cy="250" r="4" fill="url(#amberGrad)" opacity="0.9" />
  <circle cx="270" cy="168" r="5" fill="url(#tealGrad)" opacity="0.9" />
  <circle cx="195" cy="265" r="4" fill="url(#greenGrad)" opacity="0.8" />
  <!-- Connectivity lines between pins -->
  <line x1="140" y1="165" x2="185" y2="148" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
  <line x1="185" y1="148" x2="220" y2="190" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
  <line x1="220" y1="190" x2="165" y2="220" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
  <line x1="165" y1="220" x2="130" y2="250" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
  <line x1="220" y1="190" x2="240" y2="235" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
  <line x1="240" y1="235" x2="195" y2="265" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
  <line x1="270" y1="168" x2="220" y2="190" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
  <!-- Map label -->
  <rect x="55" y="345" width="165" height="26" rx="6" fill="rgba(255,255,255,0.08)" />
  <text x="138" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)">Constituency Map</text>

  <!-- Right panel - stats cards -->
  <!-- Card 1: Registered Voters -->
  <rect x="360" y="60" width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)" />
  <rect x="360" y="60" width="5" height="85" rx="2" fill="url(#greenGrad)" />
  <text x="380" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.55)">REGISTERED VOTERS</text>
  <text x="380" y="118" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">7.2M+</text>
  <text x="510" y="118" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">▲ 12%</text>

  <!-- Card 2: Constituencies -->
  <rect x="575" y="60" width="195" height="85" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)" />
  <rect x="575" y="60" width="5" height="85" rx="2" fill="url(#tealGrad)" />
  <text x="595" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.55)">CONSTITUENCIES</text>
  <text x="595" y="118" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">156</text>
  <text x="648" y="118" font-family="Arial, sans-serif" font-size="10" fill="#38bdf8">Nationwide</text>

  <!-- Card 3: Ward Coverage -->
  <rect x="360" y="160" width="200" height="85" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)" />
  <rect x="360" y="160" width="5" height="85" rx="2" fill="url(#amberGrad)" />
  <text x="380" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.55)">WARD COVERAGE</text>
  <text x="380" y="218" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">1,500+</text>
  <text x="496" y="218" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">Wards</text>

  <!-- Card 4: Voter Turnout Forecast -->
  <rect x="575" y="160" width="195" height="85" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)" />
  <rect x="575" y="160" width="5" height="85" rx="2" fill="url(#purpleGrad)" />
  <text x="595" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.55)">TURNOUT FORECAST</text>
  <text x="595" y="218" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">68%</text>
  <text x="647" y="218" font-family="Arial, sans-serif" font-size="10" fill="#a78bfa">Predicted</text>

  <!-- Bottom feature pills -->
  <rect x="360" y="265" width="410" height="125" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.10)" stroke-width="1" filter="url(#shadow)" />
  <text x="378" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.85)">Key Platform Capabilities</text>

  <!-- Feature items -->
  <circle cx="378" cy="315" r="4" fill="url(#greenGrad)" />
  <text x="390" y="319" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">Voter Registration &amp; Verification</text>

  <circle cx="378" cy="340" r="4" fill="url(#tealGrad)" />
  <text x="390" y="344" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">Constituency Intelligence &amp; Analytics</text>

  <circle cx="378" cy="365" r="4" fill="url(#amberGrad)" />
  <text x="390" y="369" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">Real-Time Election Monitoring Dashboard</text>

  <circle cx="575" cy="315" r="4" fill="url(#purpleGrad)" />
  <text x="587" y="319" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">AI Voter Sentiment Insights</text>

  <circle cx="575" cy="340" r="4" fill="url(#greenGrad)" />
  <text x="587" y="344" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">Campaign Targeting Engine</text>

  <circle cx="575" cy="365" r="4" fill="url(#tealGrad)" />
  <text x="587" y="369" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">Candidate Performance Tracker</text>

  <!-- Title overlay -->
  <rect x="0" y="0" width="800" height="52" fill="rgba(10,20,60,0.65)" />
  <text x="30" y="19" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="2">NEOSOFT · VOTER MANAGEMENT SYSTEM</text>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="white">The Digital Intelligence Platform That Wins Elections</text>

  <!-- Bottom bar -->
  <rect x="0" y="420" width="800" height="30" fill="rgba(10,20,60,0.5)" />
  <text x="30" y="440" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">kapambwe.github.io/VotersWebApp</text>
  <text x="680" y="440" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">NeoSoft © 2026</text>
</svg>
