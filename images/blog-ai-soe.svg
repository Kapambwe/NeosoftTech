      <line x1="40" y1="28" x2="60" y2="32" />
      <line x1="40" y1="28" x2="40" y2="14" />
      <line x1="20" y1="32" x2="18" y2="50" />
      <line x1="60" y1="32" x2="62" y2="50" />
      <line x1="18" y1="50" x2="40" y2="55" />
      <line x1="62" y1="50" x2="40" y2="55" />
      <line x1="40" y1="55" x2="40" y2="66" />
