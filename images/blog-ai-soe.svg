  <text x="637" y="116" font-family="Arial, sans-serif" font-size="9" fill="#fca5a5" font-weight="600" letter-spacing="0.5">AT RISK</text>
  <text x="637" y="142" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="800">7</text>
  <text x="666" y="142" font-family="Arial, sans-serif" font-size="10" fill="#fca5a5">⚠ Alert</text>

  <!-- ── Bar chart ── -->
