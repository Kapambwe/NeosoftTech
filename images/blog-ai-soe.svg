  <text x="400" y="438" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa" font-weight="600" text-anchor="middle" letter-spacing="1">NEOSOFT TECH · SOE MONITOR · ZAMBIA GOVERNMENT INVESTMENT DEPARTMENT</text>
