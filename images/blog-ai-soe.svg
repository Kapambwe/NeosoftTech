  <text x="581" y="378" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">ZESCO — Profitable</text>
  <circle cx="572" cy="388" r="4" fill="#f59e0b" />
  <text x="581" y="392" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">ZAMTEL — Review</text>
  <circle cx="572" cy="401" r="4" fill="#ef4444" />
  <text x="581" y="405" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">ZNBC — At Risk</text>

  <!-- ── Title text (left side, bottom) ── -->
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" opacity="0.95">Digital SOE</text>
  <text x="60" y="263" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" opacity="0.95">Governance</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" opacity="0.8">AI-Powered Monitoring</text>
