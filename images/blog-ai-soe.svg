    <circle cx="40" cy="28" r="4" fill="#60a5fa" />
    <circle cx="20" cy="32" r="3" fill="#818cf8" />
    <circle cx="60" cy="32" r="3" fill="#818cf8" />
    <circle cx="18" cy="50" r="3" fill="#60a5fa" />
    <circle cx="62" cy="50" r="3" fill="#60a5fa" />
    <circle cx="40" cy="55" r="4" fill="#34d399" />
    <circle cx="40" cy="14" r="3" fill="#34d399" />
    <circle cx="40" cy="66" r="3" fill="#818cf8" />
