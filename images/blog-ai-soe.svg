  <rect x="608" y="260" width="22" height="58" rx="3" fill="url(#bar2)" />
  <rect x="632" y="282" width="22" height="36" rx="3" fill="url(#bar3)" />
  <text x="608" y="332" font-family="Arial, sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Transport</text>

  <!-- Bars - Telecom -->
  <rect x="668" y="232" width="22" height="86" rx="3" fill="url(#bar1)" />
  <rect x="692" y="250" width="22" height="68" rx="3" fill="url(#bar2)" />
  <text x="681" y="332" font-family="Arial, sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Telecom</text>

  <!-- Legend -->
  <rect x="590" y="196" width="10" height="8" rx="1" fill="#3b82f6" />
  <text x="603" y="204" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Revenue</text>
  <rect x="638" y="196" width="10" height="8" rx="1" fill="#10b981" />
  <text x="651" y="204" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Profit</text>
  <rect x="680" y="196" width="10" height="8" rx="1" fill="#7c3aed" />
  <text x="693" y="204" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Debt</text>

  <!-- ── AI Analysis panel ── -->
