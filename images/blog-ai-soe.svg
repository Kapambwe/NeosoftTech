  <text x="392" y="290" font-family="Arial, sans-serif" font-size="8" fill="#64748b">2</text>
  <text x="392" y="263" font-family="Arial, sans-serif" font-size="8" fill="#64748b">4</text>
  <text x="392" y="235" font-family="Arial, sans-serif" font-size="8" fill="#64748b">6</text>
  <text x="392" y="208" font-family="Arial, sans-serif" font-size="8" fill="#64748b">8</text>

