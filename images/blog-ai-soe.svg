<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Deep blue gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2a5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4db3;stop-opacity:1" />
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#243f80;stop-opacity:1" />
    </linearGradient>
    <!-- Green accent gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <!-- Amber accent gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <!-- Chart bar gradient -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Node glow -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#93c5fd" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="50" y1="0" x2="50" y2="450" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="650" y1="0" x2="650" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="750" y1="0" x2="750" y2="450" />
  </g>

  <!-- ── Network / AI nodes (left side) ── -->
  <!-- Connection lines first so nodes appear on top -->
  <g opacity="0.35" stroke="#93c5fd" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
    <line x1="80" y1="120" x2="160" y2="200" />
    <line x1="80" y1="120" x2="160" y2="90" />
    <line x1="160" y1="200" x2="250" y2="260" />
    <line x1="160" y1="90" x2="250" y2="150" />
    <line x1="160" y1="90" x2="250" y2="50" />
    <line x1="250" y1="150" x2="340" y2="200" />
    <line x1="250" y1="260" x2="340" y2="200" />
    <line x1="250" y1="50" x2="340" y2="100" />
    <line x1="340" y1="200" x2="340" y2="100" />
  </g>

  <!-- Nodes -->
  <g filter="url(#nodeGlow)">
    <circle cx="80" cy="120" r="10" fill="#3b82f6" opacity="0.9" />
    <circle cx="80" cy="120" r="5" fill="#93c5fd" />

    <circle cx="160" cy="90" r="8" fill="#6366f1" opacity="0.9" />
    <circle cx="160" cy="90" r="4" fill="#c4b5fd" />

    <circle cx="160" cy="200" r="9" fill="#3b82f6" opacity="0.9" />
    <circle cx="160" cy="200" r="4.5" fill="#93c5fd" />

    <circle cx="250" cy="50" r="7" fill="#10b981" opacity="0.9" />
    <circle cx="250" cy="50" r="3.5" fill="#6ee7b7" />

    <circle cx="250" cy="150" r="11" fill="#3b82f6" opacity="0.95" />
    <circle cx="250" cy="150" r="5.5" fill="#bfdbfe" />

    <circle cx="250" cy="260" r="8" fill="#6366f1" opacity="0.9" />
    <circle cx="250" cy="260" r="4" fill="#c4b5fd" />

    <circle cx="340" cy="100" r="9" fill="#10b981" opacity="0.9" />
    <circle cx="340" cy="100" r="4.5" fill="#6ee7b7" />

    <circle cx="340" cy="200" r="13" fill="#1d4ed8" opacity="0.95" />
    <circle cx="340" cy="200" r="6.5" fill="#93c5fd" />
