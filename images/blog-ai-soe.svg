  <text x="400" y="362" font-family="Arial, sans-serif" font-size="9" fill="#7c3aed" font-weight="700" letter-spacing="0.5">AI RISK ANALYSIS</text>
  <!-- Risk bars -->
  <rect x="400" y="368" width="120" height="5" rx="2" fill="#1e293b" />
  <rect x="400" y="368" width="36" height="5" rx="2" fill="#ef4444" />
  <text x="527" y="374" font-family="Arial, sans-serif" font-size="8" fill="#fca5a5">30%</text>
  <rect x="400" y="378" width="120" height="5" rx="2" fill="#1e293b" />
  <rect x="400" y="378" width="78" height="5" rx="2" fill="#f59e0b" />
  <text x="527" y="384" font-family="Arial, sans-serif" font-size="8" fill="#fcd34d">65%</text>
  <rect x="400" y="388" width="120" height="5" rx="2" fill="#1e293b" />
  <rect x="400" y="388" width="102" height="5" rx="2" fill="#10b981" />
  <text x="527" y="394" font-family="Arial, sans-serif" font-size="8" fill="#6ee7b7">85%</text>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="7.5" fill="#475569">High · Medium · Governance</text>

  <!-- ── SOE Status list ── -->
