  <!-- AI brain symbol (stylized) -->
  <g transform="translate(60, 300)" opacity="0.85">
    <circle cx="40" cy="40" r="32" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5" />
    <circle cx="40" cy="40" r="22" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.6" />
