    <line x1="405" y1="318" x2="720" y2="318" />
    <line x1="405" y1="290" x2="720" y2="290" />
    <line x1="405" y1="263" x2="720" y2="263" />
    <line x1="405" y1="235" x2="720" y2="235" />
    <line x1="405" y1="208" x2="720" y2="208" />
  </g>

  <!-- Bars - Energy -->
  <rect x="416" y="220" width="22" height="98" rx="3" fill="url(#bar1)" />
  <rect x="440" y="245" width="22" height="73" rx="3" fill="url(#bar2)" />
  <rect x="464" y="268" width="22" height="50" rx="3" fill="url(#bar3)" />
  <text x="430" y="332" font-family="Arial, sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Energy</text>

  <!-- Bars - Mining -->
  <rect x="500" y="210" width="22" height="108" rx="3" fill="url(#bar1)" />
  <rect x="524" y="228" width="22" height="90" rx="3" fill="url(#bar2)" />
  <rect x="548" y="255" width="22" height="63" rx="3" fill="url(#bar3)" />
