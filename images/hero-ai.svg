<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580">
  <defs>
    <!-- Transparent background so it blends with the hero gradient -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.85" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Soft glow for rings -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Card shadow -->
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ═══ OUTER ORBITAL RINGS around AI brain ═══ -->
  <g transform="translate(320, 272)">
    <ellipse cx="0" cy="0" rx="250" ry="250" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.15" />
    <ellipse cx="0" cy="0" rx="210" ry="210" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.2" />
    <ellipse cx="0" cy="0" rx="170" ry="170" fill="none" stroke="#93c5fd" stroke-width="0.8" opacity="0.2" />
    <ellipse cx="0" cy="0" rx="130" ry="130" fill="none" stroke="#bfdbfe" stroke-width="0.8" opacity="0.15" />
  </g>

  <!-- ═══ NEURAL NETWORK CONNECTIONS (background layer) ═══ -->
  <g stroke="#93c5fd" stroke-width="0.8" opacity="0.25" fill="none">
    <!-- Outer network spokes from brain -->
    <line x1="320" y1="272" x2="120" y2="100" />
    <line x1="320" y1="272" x2="520" y2="100" />
    <line x1="320" y1="272" x2="80" y2="272" />
    <line x1="320" y1="272" x2="560" y2="272" />
    <line x1="320" y1="272" x2="120" y2="450" />
    <line x1="320" y1="272" x2="520" y2="450" />
    <line x1="320" y1="272" x2="220" y2="80" />
    <line x1="320" y1="272" x2="420" y2="80" />
    <line x1="320" y1="272" x2="180" y2="470" />
    <line x1="320" y1="272" x2="460" y2="470" />
    <!-- Cross-connections between nodes -->
    <line x1="120" y1="100" x2="220" y2="80" />
    <line x1="520" y1="100" x2="420" y2="80" />
    <line x1="120" y1="100" x2="80" y2="272" />
    <line x1="520" y1="100" x2="560" y2="272" />
    <line x1="80" y1="272" x2="120" y2="450" />
    <line x1="560" y1="272" x2="520" y2="450" />
    <line x1="120" y1="450" x2="180" y2="470" />
    <line x1="520" y1="450" x2="460" y2="470" />
    <line x1="180" y1="470" x2="460" y2="470" />
    <line x1="220" y1="80" x2="420" y2="80" />
  </g>

  <!-- Faint secondary cross-connections -->
  <g stroke="#60a5fa" stroke-width="0.5" opacity="0.12" fill="none">
    <line x1="120" y1="100" x2="520" y2="450" />
    <line x1="520" y1="100" x2="120" y2="450" />
    <line x1="80" y1="272" x2="420" y2="80" />
    <line x1="560" y1="272" x2="220" y2="80" />
    <line x1="80" y1="272" x2="460" y2="470" />
    <line x1="560" y1="272" x2="180" y2="470" />
  </g>

  <!-- ═══ CENTRAL AI BRAIN ═══ -->
  <g transform="translate(320, 272)" filter="url(#ringGlow)">
    <!-- Pulsing rings -->
    <circle cx="0" cy="0" r="85" fill="url(#ringGrad)" stroke="#3b82f6" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.5" />
    <!-- Inner brain shape -->
    <circle cx="0" cy="0" r="48" fill="#1e3a8a" opacity="0.9" stroke="#3b82f6" stroke-width="2" />
    <!-- Neural connections inside brain -->
    <g stroke="#93c5fd" stroke-width="1.2" opacity="0.8">
      <!-- Top cluster -->
      <line x1="0" y1="-30" x2="-18" y2="-14" />
      <line x1="0" y1="-30" x2="18" y2="-14" />
      <line x1="0" y1="-30" x2="0" y2="-44" />
      <!-- Middle cluster -->
      <line x1="-18" y1="-14" x2="-30" y2="4" />
      <line x1="18" y1="-14" x2="30" y2="4" />
      <line x1="-18" y1="-14" x2="0" y2="0" />
      <line x1="18" y1="-14" x2="0" y2="0" />
      <!-- Bottom cluster -->
      <line x1="-30" y1="4" x2="-18" y2="22" />
      <line x1="30" y1="4" x2="18" y2="22" />
      <line x1="0" y1="0" x2="-18" y2="22" />
      <line x1="0" y1="0" x2="18" y2="22" />
      <line x1="-18" y1="22" x2="0" y2="36" />
      <line x1="18" y1="22" x2="0" y2="36" />
    </g>
    <!-- Neural nodes inside brain -->
    <g filter="url(#glow)">
      <circle cx="0" cy="-44" r="4" fill="#34d399" />
      <circle cx="0" cy="-30" r="5.5" fill="#60a5fa" />
      <circle cx="-18" cy="-14" r="4" fill="#818cf8" />
      <circle cx="18" cy="-14" r="4" fill="#818cf8" />
      <circle cx="-30" cy="4" r="4.5" fill="#60a5fa" />
      <circle cx="30" cy="4" r="4.5" fill="#60a5fa" />
      <circle cx="0" cy="0" r="6" fill="#3b82f6" />
      <circle cx="-18" cy="22" r="4" fill="#34d399" />
      <circle cx="18" cy="22" r="4" fill="#34d399" />
      <circle cx="0" cy="36" r="5" fill="#60a5fa" />
    </g>
    <!-- AI label -->
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3" opacity="0.95">AI</text>
  </g>

  <!-- ═══ OUTER NETWORK NODES ═══ -->
  <!-- Top-left: Governance node -->
  <g filter="url(#glow)">
    <circle cx="120" cy="100" r="22" fill="url(#nodeBlue)" opacity="0.9" />
    <circle cx="120" cy="100" r="14" fill="#1e3a8a" />
    <!-- Building icon -->
    <rect x="112" y="94" width="16" height="12" rx="1" fill="none" stroke="#93c5fd" stroke-width="1.2" />
    <line x1="120" y1="94" x2="120" y2="88" stroke="#93c5fd" stroke-width="1.2" />
    <rect x="116" y="98" width="3" height="8" fill="#60a5fa" opacity="0.8" />
    <rect x="121" y="98" width="3" height="8" fill="#60a5fa" opacity="0.8" />
  </g>
  <text x="120" y="134" font-family="Arial, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="700">GOVERNANCE</text>

  <!-- Top-right: Finance node -->
  <g filter="url(#glow)">
    <circle cx="520" cy="100" r="22" fill="url(#nodeAmber)" opacity="0.9" />
    <circle cx="520" cy="100" r="14" fill="#451a03" />
    <!-- Dollar/coin icon -->
    <circle cx="520" cy="100" r="8" fill="none" stroke="#fcd34d" stroke-width="1.5" />
    <text x="520" y="104" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#fcd34d" text-anchor="middle">$</text>
  </g>
  <text x="520" y="134" font-family="Arial, sans-serif" font-size="9" fill="#fcd34d" text-anchor="middle" font-weight="700">FINANCE</text>

  <!-- Left: Agriculture node -->
  <g filter="url(#glow)">
    <circle cx="80" cy="272" r="22" fill="url(#nodeGreen)" opacity="0.9" />
    <circle cx="80" cy="272" r="14" fill="#052e16" />
    <!-- Leaf icon -->
    <path d="M74,278 Q80,262 86,278 Q80,282 74,278 Z" fill="#4ade80" />
    <line x1="80" y1="280" x2="80" y2="286" stroke="#4ade80" stroke-width="1.5" />
  </g>
  <text x="80" y="306" font-family="Arial, sans-serif" font-size="9" fill="#4ade80" text-anchor="middle" font-weight="700">AGRICULTURE</text>

  <!-- Right: SME node -->
  <g filter="url(#glow)">
    <circle cx="560" cy="272" r="22" fill="url(#nodePurple)" opacity="0.9" />
    <circle cx="560" cy="272" r="14" fill="#2e1065" />
    <!-- Chart bars icon -->
    <rect x="553" y="270" width="4" height="8" rx="1" fill="#c4b5fd" />
    <rect x="559" y="266" width="4" height="12" rx="1" fill="#c4b5fd" />
    <rect x="565" y="272" width="4" height="6" rx="1" fill="#c4b5fd" />
    <line x1="551" y1="279" x2="571" y2="279" stroke="#a78bfa" stroke-width="1" />
  </g>
  <text x="560" y="306" font-family="Arial, sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="700">SME GROWTH</text>

  <!-- Bottom-left: Transparency node -->
  <g filter="url(#glow)">
    <circle cx="120" cy="450" r="22" fill="url(#nodeGreen)" opacity="0.9" />
    <circle cx="120" cy="450" r="14" fill="#052e16" />
    <!-- Eye icon -->
    <ellipse cx="120" cy="450" rx="8" ry="5" fill="none" stroke="#4ade80" stroke-width="1.5" />
    <circle cx="120" cy="450" r="2.5" fill="#4ade80" />
  </g>
  <text x="120" y="484" font-family="Arial, sans-serif" font-size="9" fill="#4ade80" text-anchor="middle" font-weight="700">TRANSPARENCY</text>

  <!-- Bottom-right: Trust node -->
  <g filter="url(#glow)">
    <circle cx="520" cy="450" r="22" fill="url(#nodeBlue)" opacity="0.9" />
    <circle cx="520" cy="450" r="14" fill="#1e1b4b" />
    <!-- Shield icon -->
    <path d="M520,440 L526,443 L526,450 Q526,456 520,459 Q514,456 514,450 L514,443 Z" fill="none" stroke="#93c5fd" stroke-width="1.5" />
    <text x="520" y="454" font-family="Arial, sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">✓</text>
  </g>
  <text x="520" y="484" font-family="Arial, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="700">TRUST</text>

  <!-- Top-center-left: Data node -->
  <g filter="url(#glow)">
    <circle cx="220" cy="80" r="16" fill="url(#nodeBlue)" opacity="0.85" />
    <circle cx="220" cy="80" r="9" fill="#1e3a8a" />
    <!-- DB cylinders -->
    <ellipse cx="220" cy="75" rx="5" ry="2" fill="none" stroke="#93c5fd" stroke-width="1" />
    <ellipse cx="220" cy="81" rx="5" ry="2" fill="none" stroke="#93c5fd" stroke-width="1" />
    <line x1="215" y1="75" x2="215" y2="81" stroke="#93c5fd" stroke-width="1" />
    <line x1="225" y1="75" x2="225" y2="81" stroke="#93c5fd" stroke-width="1" />
  </g>

  <!-- Top-center-right: Cloud node -->
  <g filter="url(#glow)">
    <circle cx="420" cy="80" r="16" fill="url(#nodePurple)" opacity="0.85" />
    <circle cx="420" cy="80" r="9" fill="#2e1065" />
    <!-- Cloud icon -->
    <path d="M413,82 Q413,77 417,77 Q418,74 422,74 Q426,74 427,77 Q430,77 430,81 Q430,85 426,84 L414,84 Q411,84 413,82Z" fill="none" stroke="#c4b5fd" stroke-width="1" />
  </g>

  <!-- Bottom-center-left node -->
  <g filter="url(#glow)">
    <circle cx="180" cy="470" r="16" fill="url(#nodeAmber)" opacity="0.85" />
    <circle cx="180" cy="470" r="9" fill="#451a03" />
    <!-- Link chain icon -->
    <path d="M175,468 Q175,464 178,464 L183,464 Q186,464 186,468 Q186,472 183,472 L178,472 Q175,472 175,468Z" fill="none" stroke="#fcd34d" stroke-width="1" />
    <line x1="183" y1="468" x2="187" y2="468" stroke="#fcd34d" stroke-width="1" />
  </g>

  <!-- Bottom-center-right node -->
  <g filter="url(#glow)">
    <circle cx="460" cy="470" r="16" fill="url(#nodeGreen)" opacity="0.85" />
    <circle cx="460" cy="470" r="9" fill="#052e16" />
    <!-- Signal waves -->
    <g stroke="#4ade80" stroke-width="1" fill="none">
      <path d="M455,470 Q457,465 460,465 Q463,465 465,470" />
      <path d="M452,470 Q455,462 460,462 Q465,462 468,470" />
    </g>
  </g>

  <!-- ═══ DATA CARDS floating around ═══ -->
  <!-- Card: Real-time Analytics -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="152" width="140" height="68" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="0.8" opacity="0.9" />
    <text x="32" y="170" font-family="Arial, sans-serif" font-size="7.5" fill="#93c5fd" font-weight="700" letter-spacing="0.8">REAL-TIME ANALYTICS</text>
    <!-- Mini sparkline -->
    <polyline points="32,185 50,178 68,182 86,172 104,176 122,168 140,174" fill="none" stroke="#34d399" stroke-width="1.5" />
    <circle cx="140" cy="174" r="3" fill="#34d399" filter="url(#glow)" />
    <text x="32" y="208" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">+24.3%</text>
    <text x="80" y="208" font-family="Arial, sans-serif" font-size="7.5" fill="#64748b"> growth trend</text>
  </g>

  <!-- Card: AI Confidence -->
  <g filter="url(#cardShadow)">
    <rect x="480" y="152" width="140" height="68" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="0.8" opacity="0.9" />
    <text x="492" y="170" font-family="Arial, sans-serif" font-size="7.5" fill="#c4b5fd" font-weight="700" letter-spacing="0.8">AI CONFIDENCE</text>
    <!-- Gauge-style bars -->
    <rect x="492" y="176" width="108" height="6" rx="3" fill="#1e293b" />
    <rect x="492" y="176" width="92" height="6" rx="3" fill="#8b5cf6" />
    <text x="492" y="196" font-family="Arial, sans-serif" font-size="8" fill="#a78bfa">Prediction accuracy</text>
    <text x="586" y="196" font-family="Arial, sans-serif" font-size="9" fill="#c4b5fd" font-weight="700" text-anchor="end">94.7%</text>
    <text x="492" y="210" font-family="Arial, sans-serif" font-size="7.5" fill="#64748b">Based on 2.4M data points</text>
  </g>

  <!-- Card: Connected citizens -->
  <g filter="url(#cardShadow)">
    <rect x="200" y="510" width="240" height="52" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="0.8" opacity="0.9" />
    <circle cx="222" cy="536" r="6" fill="#10b981" filter="url(#glow)" />
    <text x="234" y="530" font-family="Arial, sans-serif" font-size="8" fill="#6ee7b7" font-weight="700">CITIZENS CONNECTED</text>
    <text x="234" y="546" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="900">2.8M+</text>
    <text x="234" y="555" font-family="Arial, sans-serif" font-size="7" fill="#6ee7b7">across 10 provinces</text>
    <!-- mini bar -->
    <rect x="360" y="522" width="64" height="4" rx="2" fill="#1e293b" />
    <rect x="360" y="522" width="54" height="4" rx="2" fill="#10b981" />
    <rect x="360" y="530" width="64" height="4" rx="2" fill="#1e293b" />
    <rect x="360" y="530" width="44" height="4" rx="2" fill="#34d399" />
    <rect x="360" y="538" width="64" height="4" rx="2" fill="#1e293b" />
    <rect x="360" y="538" width="58" height="4" rx="2" fill="#059669" />
  </g>

  <!-- Floating data pulse dots -->
  <g opacity="0.6" filter="url(#glow)">
    <circle cx="200" cy="170" r="3" fill="#60a5fa" />
    <circle cx="270" cy="130" r="2.5" fill="#34d399" />
    <circle cx="380" cy="130" r="2.5" fill="#34d399" />
    <circle cx="440" cy="170" r="3" fill="#60a5fa" />
    <circle cx="180" cy="370" r="2.5" fill="#a78bfa" />
    <circle cx="460" cy="370" r="2.5" fill="#a78bfa" />
    <circle cx="200" cy="420" r="3" fill="#fbbf24" />
    <circle cx="440" cy="420" r="3" fill="#fbbf24" />
  </g>
</svg>
