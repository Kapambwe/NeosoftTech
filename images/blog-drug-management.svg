<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2744;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <circle cx="800" cy="80" r="200" fill="#1d4ed8" opacity="0.07"/>
  <circle cx="100" cy="450" r="180" fill="#059669" opacity="0.07"/>

  <!-- Grid lines -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="900" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="500" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- LEFT PANEL: Title and stats -->
  <text x="50" y="78" font-size="11" font-weight="700" fill="#7dd3fc" letter-spacing="2.5">PHARMACEUTICAL SUPPLY CHAIN</text>
  <text x="50" y="122" font-size="36" font-weight="800" fill="white">Drug.Management</text>
  <text x="50" y="157" font-size="36" font-weight="800" fill="#38bdf8">.System</text>
  <text x="50" y="193" font-size="14" fill="#93c5fd">End-to-End Medicine Integrity</text>
  <text x="50" y="213" font-size="14" fill="#93c5fd">From Warehouse to Patient</text>

  <!-- Stat cards -->
  <rect x="50" y="240" width="110" height="72" rx="10" fill="url(#cardGrad)" stroke="#1d4ed8" stroke-width="1"/>
  <text x="105" y="266" font-size="26" font-weight="800" fill="#38bdf8" text-anchor="middle">60+</text>
  <text x="105" y="285" font-size="10" fill="#93c5fd" text-anchor="middle">Drug Interaction</text>
  <text x="105" y="299" font-size="10" fill="#93c5fd" text-anchor="middle">Checks</text>

  <rect x="175" y="240" width="110" height="72" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1"/>
  <text x="230" y="266" font-size="26" font-weight="800" fill="#34d399" text-anchor="middle">95%+</text>
  <text x="230" y="285" font-size="10" fill="#93c5fd" text-anchor="middle">Error Reduction</text>
  <text x="230" y="299" font-size="10" fill="#93c5fd" text-anchor="middle">Rate</text>

  <rect x="300" y="240" width="110" height="72" rx="10" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1"/>
  <text x="355" y="266" font-size="26" font-weight="800" fill="#c4b5fd" text-anchor="middle">15+</text>
  <text x="355" y="285" font-size="10" fill="#93c5fd" text-anchor="middle">Allergy Families</text>
  <text x="355" y="299" font-size="10" fill="#93c5fd" text-anchor="middle">Screened</text>

  <!-- Feature chips -->
  <rect x="50" y="330" width="170" height="28" rx="14" fill="#1e3a5f"/>
  <text x="135" y="349" font-size="11" fill="#7dd3fc" text-anchor="middle">💊 QR Authenticity Verify</text>

  <rect x="232" y="330" width="185" height="28" rx="14" fill="#1e3a5f"/>
  <text x="324" y="349" font-size="11" fill="#7dd3fc" text-anchor="middle">🔬 Clinical Safety Engine</text>

  <rect x="50" y="370" width="175" height="28" rx="14" fill="#1e3a5f"/>
  <text x="137" y="389" font-size="11" fill="#7dd3fc" text-anchor="middle">📦 Supply Chain Custody</text>

  <rect x="237" y="370" width="180" height="28" rx="14" fill="#1e3a5f"/>
  <text x="327" y="389" font-size="11" fill="#7dd3fc" text-anchor="middle">🏥 ZAMRA Compliance</text>

  <text x="50" y="450" font-size="12" fill="#7dd3fc" opacity="0.8">kapambwe.github.io/DrugMonitorWebApp</text>
  <text x="50" y="474" font-size="11" fill="#93c5fd" opacity="0.6">NeoSoft Technologies · Zambia Health Stack · SDG 3</text>

  <!-- RIGHT PANEL: Supply chain flow diagram -->
  <rect x="465" y="40" width="405" height="420" rx="14" fill="#0f2744" opacity="0.8" filter="url(#shadow)"/>
  <text x="667" y="70" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">SUPPLY CHAIN CHAIN OF CUSTODY</text>

  <!-- Flow steps -->
  <!-- Step 1 -->
  <rect x="482" y="82" width="370" height="48" rx="8" fill="url(#blueGrad)" opacity="0.85"/>
  <text x="520" y="101" font-size="12" font-weight="700" fill="white">📥 Procurement &amp; Receipt</text>
  <text x="520" y="119" font-size="10" fill="rgba(255,255,255,0.8)">GRN capture · Supplier verification · 3-way invoice matching</text>

  <!-- Arrow -->
  <line x1="667" y1="130" x2="667" y2="146" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="662,144 667,152 672,144" fill="#38bdf8"/>

  <!-- Step 2 -->
  <rect x="482" y="152" width="370" height="48" rx="8" fill="#1e3a5f" stroke="#1d4ed8" stroke-width="1"/>
  <text x="520" y="171" font-size="12" font-weight="700" fill="#7dd3fc">🏬 Storage &amp; Inventory</text>
  <text x="520" y="189" font-size="10" fill="#93c5fd">Expiry tracking · Auto reorder alerts · In-transit visibility</text>

  <!-- Arrow -->
  <line x1="667" y1="200" x2="667" y2="216" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="662,214 667,222 672,214" fill="#38bdf8"/>

  <!-- Step 3 -->
  <rect x="482" y="222" width="370" height="48" rx="8" fill="#1e3a5f" stroke="#059669" stroke-width="1"/>
  <text x="520" y="241" font-size="12" font-weight="700" fill="#34d399">🚚 Distribution &amp; Logistics</text>
  <text x="520" y="259" font-size="10" fill="#93c5fd">Authorised dispatch · Custody transfer docs · Audit trail</text>

  <!-- Arrow -->
  <line x1="667" y1="270" x2="667" y2="286" stroke="#34d399" stroke-width="2"/>
  <polygon points="662,284 667,292 672,284" fill="#34d399"/>

  <!-- Step 4 -->
  <rect x="482" y="292" width="370" height="48" rx="8" fill="#1e3a5f" stroke="#7c3aed" stroke-width="1"/>
  <text x="520" y="311" font-size="12" font-weight="700" fill="#c4b5fd">💉 Dispensing &amp; Patient Supply</text>
  <text x="520" y="329" font-size="10" fill="#93c5fd">Rx-linked dispensing · Dose-check · Adherence monitoring</text>

  <!-- Arrow -->
  <line x1="667" y1="340" x2="667" y2="356" stroke="#c4b5fd" stroke-width="2"/>
  <polygon points="662,354 667,362 672,354" fill="#c4b5fd"/>

  <!-- Step 5 -->
  <rect x="482" y="362" width="370" height="48" rx="8" fill="#1e3a5f" stroke="#d97706" stroke-width="1"/>
  <text x="520" y="381" font-size="12" font-weight="700" fill="#fbbf24">🔍 Surveillance &amp; Compliance</text>
  <text x="520" y="399" font-size="10" fill="#93c5fd">Post-market surveillance · QR verify · ZAMRA reporting</text>

  <!-- ZAMRA badge -->
  <rect x="482" y="422" width="100" height="26" rx="13" fill="#059669" opacity="0.8"/>
  <text x="532" y="439" font-size="10" font-weight="700" fill="white" text-anchor="middle">ZAMRA Ready</text>
  <rect x="592" y="422" width="100" height="26" rx="13" fill="#1d4ed8" opacity="0.8"/>
  <text x="642" y="439" font-size="10" font-weight="700" fill="white" text-anchor="middle">PEPFAR Aligned</text>
  <rect x="702" y="422" width="140" height="26" rx="13" fill="#7c3aed" opacity="0.8"/>
  <text x="772" y="439" font-size="10" font-weight="700" fill="white" text-anchor="middle">Global Fund Compliant</text>
</svg>
