<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgLandAudit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#064e3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glowLand">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgLandAudit)" />

  <!-- GIS Overlay Grid -->
  <g opacity="0.15" stroke="#34d399" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Title Badge -->
  <rect x="50" y="40" width="380" height="36" rx="18" fill="#15803d" opacity="0.6" />
  <text x="70" y="63" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#86efac" letter-spacing="1">
    VERIFIABLE LAND TITLE DEEDS & GIS AUDIT
  </text>

  <!-- Land Parcel Polygon (Cryptographic Certificate Graphic) -->
  <g transform="translate(70, 110)">
    <polygon points="20,160 140,40 320,80 280,240 80,260" fill="#166534" opacity="0.4" stroke="#4ade80" stroke-width="3" filter="url(#glowLand)" />
    <!-- Pin marker -->
    <circle cx="180" cy="130" r="16" fill="#ef4444" />
    <circle cx="180" cy="130" r="6" fill="#ffffff" />
    <text x="80" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Parcel #LND-904-2026</text>
    <text x="80" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#86efac">12.5 Hectares • Verifiable Title</text>
  </g>

  <!-- Title Deed Credential Certificate -->
  <g transform="translate(420, 110)">
    <rect x="0" y="0" width="330" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="20" y="20" width="290" height="40" rx="6" fill="#0f172a" />
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">📜 W3C Verifiable Title Credential</text>
    
    <text x="20" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Owner: <tspan fill="#ffffff" font-weight="700">Chileshe Mulenga</tspan></text>
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Chiefdom Consent: <tspan fill="#4ade80" font-weight="700">Verified by Chief Mukuni</tspan></text>
    <text x="20" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Ministry Registry ID: <tspan fill="#ffffff" font-weight="700">ZM-LND-883920</tspan></text>
    
    <rect x="20" y="160" width="290" height="50" rx="6" fill="#0f172a" />
    <text x="35" y="180" font-family="system-ui, sans-serif" font-size="10" font-family="monospace" fill="#38bdf8">Hash: 0x8f2a...9c4b12e</text>
    <text x="35" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#4ade80">✓ Double-Titling Impossibility Guaranteed</text>

    <rect x="20" y="225" width="290" height="35" rx="6" fill="#15803d" />
    <text x="95" y="247" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Bankable Asset Collateral</text>
  </g>
</svg>
