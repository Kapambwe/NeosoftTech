<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Deep green gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065f46;stop-opacity:1" />
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a5c45;stop-opacity:1" />
    </linearGradient>
    <!-- Teal accent gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>
    <!-- Amber accent gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <!-- Green accent -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Node glow -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#6ee7b7" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Title area -->
  <text x="400" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6ee7b7" text-anchor="middle" letter-spacing="3">LIVESTOCK TRACEABILITY SYSTEM · ZAMBIA</text>

  <!-- ===== LIFECYCLE FLOW (top center) ===== -->
  <!-- Flow nodes: Farm → Market → Slaughter → Export -->
  <!-- Farm node -->
  <g filter="url(#nodeGlow)">
    <circle cx="120" cy="100" r="28" fill="#064e3b" stroke="url(#greenGrad)" stroke-width="2" />
    <!-- Barn icon simplified -->
    <rect x="108" y="95" width="24" height="14" rx="1" fill="none" stroke="#4ade80" stroke-width="1.5" />
    <polygon points="108,95 120,83 132,95" fill="none" stroke="#4ade80" stroke-width="1.5" />
    <line x1="116" y1="109" x2="116" y2="103" stroke="#4ade80" stroke-width="1.5" />
    <line x1="124" y1="109" x2="124" y2="103" stroke="#4ade80" stroke-width="1.5" />
  </g>
  <text x="120" y="140" font-family="Arial, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">FARM</text>

  <!-- Arrow 1 -->
  <line x1="150" y1="100" x2="198" y2="100" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3" />
  <polygon points="198,96 206,100 198,104" fill="#2dd4bf" />

  <!-- Market node -->
  <g filter="url(#nodeGlow)">
    <circle cx="235" cy="100" r="28" fill="#064e3b" stroke="url(#tealGrad)" stroke-width="2" />
    <!-- Market/shop icon -->
    <rect x="222" y="92" width="26" height="18" rx="1" fill="none" stroke="#2dd4bf" stroke-width="1.5" />
    <line x1="222" y1="97" x2="248" y2="97" stroke="#2dd4bf" stroke-width="1" />
    <rect x="228" y="101" width="6" height="9" fill="#2dd4bf" opacity="0.5" />
    <rect x="237" y="101" width="6" height="9" fill="#2dd4bf" opacity="0.5" />
    <!-- Canopy -->
    <line x1="219" y1="92" x2="251" y2="92" stroke="#2dd4bf" stroke-width="2" />
  </g>
  <text x="235" y="140" font-family="Arial, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">MARKET</text>

  <!-- Arrow 2 -->
  <line x1="265" y1="100" x2="313" y2="100" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3" />
  <polygon points="313,96 321,100 313,104" fill="#2dd4bf" />

  <!-- Slaughter node -->
  <g filter="url(#nodeGlow)">
    <circle cx="350" cy="100" r="28" fill="#064e3b" stroke="url(#amberGrad)" stroke-width="2" />
    <!-- Processing icon -->
    <rect x="338" y="90" width="24" height="20" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="344" y1="100" x2="356" y2="100" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="350" y1="94" x2="350" y2="106" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="350" cy="100" r="3" fill="#fbbf24" />
  </g>
  <text x="350" y="140" font-family="Arial, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">PROCESSING</text>

  <!-- Arrow 3 -->
  <line x1="380" y1="100" x2="428" y2="100" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3" />
  <polygon points="428,96 436,100 428,104" fill="#2dd4bf" />

  <!-- Export node -->
  <g filter="url(#nodeGlow)">
    <circle cx="465" cy="100" r="28" fill="#064e3b" stroke="#a78bfa" stroke-width="2" />
    <!-- Globe/export icon -->
    <circle cx="465" cy="100" r="12" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <ellipse cx="465" cy="100" rx="5" ry="12" fill="none" stroke="#a78bfa" stroke-width="1" />
    <line x1="453" y1="100" x2="477" y2="100" stroke="#a78bfa" stroke-width="1" />
    <line x1="455" y1="93" x2="475" y2="93" stroke="#a78bfa" stroke-width="0.8" />
    <line x1="455" y1="107" x2="475" y2="107" stroke="#a78bfa" stroke-width="0.8" />
  </g>
  <text x="465" y="140" font-family="Arial, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">EXPORT</text>

  <!-- ===== MAIN DASHBOARD CARDS ===== -->

  <!-- Card 1: Animal Registry -->
  <rect x="30" y="160" width="175" height="120" rx="8" fill="url(#cardGrad)" stroke="#064e3b" stroke-width="1" filter="url(#shadow)" />
  <rect x="30" y="160" width="175" height="4" rx="4" fill="url(#greenGrad)" />
  <text x="42" y="182" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" letter-spacing="1.5">ANIMAL REGISTRY</text>
  <!-- Stat rows -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#a7f3d0">
    <text x="42" y="202">Registered Animals</text>
    <text x="185" y="202" text-anchor="end" fill="#4ade80" font-weight="bold">1,248,430</text>
    <line x1="42" y1="207" x2="185" y2="207" stroke="#065f46" stroke-width="0.5" />
    <text x="42" y="222">Registered Farms</text>
    <text x="185" y="222" text-anchor="end" fill="#4ade80" font-weight="bold">42,180</text>
    <line x1="42" y1="227" x2="185" y2="227" stroke="#065f46" stroke-width="0.5" />
    <text x="42" y="242">ID Agents</text>
    <text x="185" y="242" text-anchor="end" fill="#fbbf24" font-weight="bold">312</text>
    <line x1="42" y1="247" x2="185" y2="247" stroke="#065f46" stroke-width="0.5" />
    <text x="42" y="262">Active Tags</text>
    <text x="185" y="262" text-anchor="end" fill="#4ade80" font-weight="bold">98.4%</text>
  </g>
  <!-- Green status dot -->
  <circle cx="183" cy="168" r="4" fill="#22c55e" filter="url(#glow)" />

  <!-- Card 2: Movement Tracking -->
  <rect x="220" y="160" width="175" height="120" rx="8" fill="url(#cardGrad)" stroke="#064e3b" stroke-width="1" filter="url(#shadow)" />
  <rect x="220" y="160" width="175" height="4" rx="4" fill="url(#tealGrad)" />
  <text x="232" y="182" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" letter-spacing="1.5">MOVEMENT TRACKING</text>
  <!-- Mini map-like dots connected by lines -->
  <g opacity="0.8">
    <line x1="250" y1="210" x2="290" y2="230" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3,2" />
    <line x1="290" y1="230" x2="330" y2="215" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3,2" />
    <line x1="330" y1="215" x2="365" y2="235" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3,2" />
    <circle cx="250" cy="210" r="5" fill="#22c55e" filter="url(#glow)" />
    <circle cx="290" cy="230" r="4" fill="#2dd4bf" />
    <circle cx="330" cy="215" r="4" fill="#fbbf24" />
    <circle cx="365" cy="235" r="5" fill="#a78bfa" />
    <text x="247" y="204" font-family="Arial, sans-serif" font-size="8" fill="#86efac">Farm</text>
    <text x="283" y="245" font-family="Arial, sans-serif" font-size="8" fill="#86efac">Market</text>
    <text x="323" y="208" font-family="Arial, sans-serif" font-size="8" fill="#86efac">Proc.</text>
    <text x="358" y="250" font-family="Arial, sans-serif" font-size="8" fill="#86efac">Export</text>
  </g>
  <text x="232" y="272" font-family="Arial, sans-serif" font-size="9" fill="#6ee7b7">Today: <tspan fill="#2dd4bf" font-weight="bold">3,420 movements</tspan></text>
  <circle cx="373" cy="168" r="4" fill="#14b8a6" filter="url(#glow)" />

  <!-- Card 3: Disease Alerts -->
  <rect x="410" y="160" width="175" height="120" rx="8" fill="url(#cardGrad)" stroke="#064e3b" stroke-width="1" filter="url(#shadow)" />
  <rect x="410" y="160" width="175" height="4" rx="4" fill="url(#amberGrad)" />
  <text x="422" y="182" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" letter-spacing="1.5">DISEASE CONTROL</text>
  <!-- Alert items -->
  <g font-family="Arial, sans-serif" font-size="9">
    <rect x="422" y="191" width="6" height="6" rx="1" fill="#22c55e" />
    <text x="432" y="199" fill="#a7f3d0">FMD — No active outbreak</text>
    <rect x="422" y="208" width="6" height="6" rx="1" fill="#22c55e" />
    <text x="432" y="216" fill="#a7f3d0">Avian Influenza — Clear</text>
    <rect x="422" y="225" width="6" height="6" rx="1" fill="#fbbf24" />
    <text x="432" y="233" fill="#fbbf24">African Swine Fever — Monitor</text>
    <rect x="422" y="242" width="6" height="6" rx="1" fill="#22c55e" />
    <text x="432" y="250" fill="#a7f3d0">Lumpy Skin Disease — Clear</text>
  </g>
  <text x="422" y="268" font-family="Arial, sans-serif" font-size="9" fill="#fbbf24">⚠ 1 region under monitoring</text>
  <circle cx="563" cy="168" r="4" fill="#f59e0b" filter="url(#glow)" />

  <!-- Card 4: Theft Prevention -->
  <rect x="600" y="160" width="170" height="120" rx="8" fill="url(#cardGrad)" stroke="#064e3b" stroke-width="1" filter="url(#shadow)" />
  <rect x="600" y="160" width="170" height="4" rx="4" fill="#a78bfa" />
  <text x="612" y="182" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" letter-spacing="1.5">THEFT PREVENTION</text>
  <g font-family="Arial, sans-serif" font-size="10" fill="#a7f3d0">
    <text x="612" y="202">Verified Ownership</text>
    <text x="750" y="202" text-anchor="end" fill="#4ade80" font-weight="bold">100%</text>
    <line x1="612" y1="207" x2="750" y2="207" stroke="#065f46" stroke-width="0.5" />
    <text x="612" y="222">Stolen — Recovered</text>
    <text x="750" y="222" text-anchor="end" fill="#4ade80" font-weight="bold">87%</text>
    <line x1="612" y1="227" x2="750" y2="227" stroke="#065f46" stroke-width="0.5" />
    <text x="612" y="242">Flagged at markets</text>
    <text x="750" y="242" text-anchor="end" fill="#fbbf24" font-weight="bold">24</text>
    <line x1="612" y1="247" x2="750" y2="247" stroke="#065f46" stroke-width="0.5" />
    <text x="612" y="262">Alerts sent today</text>
    <text x="750" y="262" text-anchor="end" fill="#2dd4bf" font-weight="bold">7</text>
  </g>
  <circle cx="748" cy="168" r="4" fill="#a78bfa" filter="url(#glow)" />

  <!-- ===== VALUE CHAIN STATS ROW ===== -->
  <rect x="30" y="300" width="740" height="80" rx="8" fill="#032015" stroke="#064e3b" stroke-width="1" />
  <text x="42" y="320" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" letter-spacing="2">NATIONAL LIVESTOCK VALUE CHAIN — REAL-TIME OVERVIEW</text>

  <!-- Stats: 5 columns -->
  <!-- Cattle -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="105" y="350" font-size="20" font-weight="bold" fill="url(#greenGrad)">3.2M</text>
    <text x="105" y="366" font-size="9" fill="#6ee7b7">Cattle Registered</text>
    <line x1="170" y1="318" x2="170" y2="370" stroke="#064e3b" stroke-width="1" />
  </g>
  <!-- Goats/Sheep -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="260" y="350" font-size="20" font-weight="bold" fill="url(#tealGrad)">5.8M</text>
    <text x="260" y="366" font-size="9" fill="#6ee7b7">Small Livestock</text>
    <line x1="335" y1="318" x2="335" y2="370" stroke="#064e3b" stroke-width="1" />
  </g>
  <!-- Farms -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="420" y="350" font-size="20" font-weight="bold" fill="url(#amberGrad)">42K+</text>
    <text x="420" y="366" font-size="9" fill="#6ee7b7">Premises Registered</text>
    <line x1="500" y1="318" x2="500" y2="370" stroke="#064e3b" stroke-width="1" />
  </g>
  <!-- Exports -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="580" y="350" font-size="20" font-weight="bold" fill="#a78bfa">14</text>
    <text x="580" y="366" font-size="9" fill="#6ee7b7">Export Destinations</text>
    <line x1="655" y1="318" x2="655" y2="370" stroke="#064e3b" stroke-width="1" />
  </g>
  <!-- Compliance -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="715" y="350" font-size="20" font-weight="bold" fill="url(#greenGrad)">96%</text>
    <text x="715" y="366" font-size="9" fill="#6ee7b7">ID Compliance Rate</text>
  </g>

  <!-- ===== BOTTOM STATUS BAR ===== -->
  <rect x="30" y="400" width="740" height="32" rx="6" fill="#032015" stroke="#064e3b" stroke-width="1" />

  <!-- Status indicators -->
  <circle cx="52" cy="416" r="5" fill="#22c55e" filter="url(#glow)" />
  <text x="62" y="420" font-family="Arial, sans-serif" font-size="9" fill="#86efac">System Online</text>

  <line x1="140" y1="405" x2="140" y2="427" stroke="#064e3b" stroke-width="1" />
  <circle cx="155" cy="416" r="5" fill="#22c55e" filter="url(#glow)" />
  <text x="165" y="420" font-family="Arial, sans-serif" font-size="9" fill="#86efac">National DB Active</text>

  <line x1="280" y1="405" x2="280" y2="427" stroke="#064e3b" stroke-width="1" />
  <circle cx="295" cy="416" r="5" fill="#14b8a6" filter="url(#glow)" />
  <text x="305" y="420" font-family="Arial, sans-serif" font-size="9" fill="#86efac">TrackTrace AgricApp</text>

  <line x1="420" y1="405" x2="420" y2="427" stroke="#064e3b" stroke-width="1" />
  <circle cx="435" cy="416" r="5" fill="#22c55e" filter="url(#glow)" />
  <text x="445" y="420" font-family="Arial, sans-serif" font-size="9" fill="#86efac">Act 2024 Compliant</text>

  <line x1="560" y1="405" x2="560" y2="427" stroke="#064e3b" stroke-width="1" />
  <text x="570" y="420" font-family="Arial, sans-serif" font-size="9" fill="#6ee7b7">Last Sync: <tspan fill="#4ade80">Just now</tspan></text>

  <text x="760" y="420" font-family="Arial, sans-serif" font-size="9" fill="#34d399" text-anchor="end">v2.4.1</text>

  <!-- ===== Livestock Silhouette (decorative, top right) ===== -->
  <!-- Simple stylized cattle silhouette -->
  <g transform="translate(540, 65)" opacity="0.25" fill="#4ade80">
    <!-- Body -->
    <ellipse cx="30" cy="20" rx="28" ry="14" />
    <!-- Head -->
    <circle cx="58" cy="16" r="9" />
    <!-- Legs -->
    <rect x="10" y="30" width="5" height="15" rx="2" />
    <rect x="20" y="30" width="5" height="15" rx="2" />
    <rect x="35" y="30" width="5" height="15" rx="2" />
    <rect x="45" y="30" width="5" height="15" rx="2" />
    <!-- Tail -->
    <path d="M2,18 Q-8,14 -6,8" stroke="#4ade80" stroke-width="2" fill="none" />
    <!-- Horn -->
    <line x1="58" y1="8" x2="55" y2="2" stroke="#4ade80" stroke-width="2" />
    <line x1="63" y1="8" x2="66" y2="2" stroke="#4ade80" stroke-width="2" />
    <!-- Eye -->
    <circle cx="62" cy="15" r="1.5" fill="#032015" />
    <!-- Ear tag -->
    <rect x="63" y="19" width="6" height="4" rx="1" fill="#fbbf24" opacity="2" />
  </g>

  <!-- QR-code style ear tag icon (decorative) -->
  <g transform="translate(620, 58)" opacity="0.5">
    <rect x="0" y="0" width="28" height="28" rx="3" fill="none" stroke="#2dd4bf" stroke-width="1.5" />
    <rect x="3" y="3" width="8" height="8" rx="1" fill="#2dd4bf" />
    <rect x="17" y="3" width="8" height="8" rx="1" fill="#2dd4bf" />
    <rect x="3" y="17" width="8" height="8" rx="1" fill="#2dd4bf" />
    <rect x="17" y="14" width="3" height="3" fill="#2dd4bf" />
    <rect x="22" y="14" width="3" height="3" fill="#2dd4bf" />
    <rect x="17" y="19" width="3" height="3" fill="#2dd4bf" />
    <rect x="22" y="22" width="3" height="3" fill="#2dd4bf" />
  </g>

  <!-- "ANIMAL ID" label above QR -->
  <text x="634" y="56" font-family="Arial, sans-serif" font-size="8" fill="#2dd4bf" text-anchor="middle" opacity="0.7">ANIMAL ID TAG</text>

  <!-- Decorative dots top right area -->
  <g opacity="0.2" fill="#6ee7b7">
    <circle cx="700" cy="65" r="2" />
    <circle cx="710" cy="75" r="1.5" />
    <circle cx="720" cy="60" r="2" />
    <circle cx="730" cy="80" r="1.5" />
    <circle cx="740" cy="70" r="2.5" />
    <circle cx="750" cy="58" r="1.5" />
    <circle cx="760" cy="75" r="2" />
    <circle cx="770" cy="65" r="1.5" />
  </g>
</svg>
